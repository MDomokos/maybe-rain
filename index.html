<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Maybe Rain?</title>
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Glanceable weekly weather: should I expect rain, and when?">
    <!-- Link-preview card (Open Graph / Twitter). Static, so the same branded
         card shows for every place: a per-city preview would need a server to
         render per-place tags, and there's no backend (principle 5). Absolute
         URLs, since crawlers don't resolve relative ones. -->
    <meta property="og:title" content="Maybe Rain?">
    <meta property="og:description" content="Glanceable weekly weather: should I expect rain, and when?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mdomokos.github.io/maybe-rain/">
    <meta property="og:site_name" content="Maybe Rain?">
    <meta property="og:locale" content="en_NZ">
    <meta property="og:image" content="https://mdomokos.github.io/maybe-rain/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A week of Maybe Rain?'s hourly forecast grid, coloured by condition, beside the wordmark">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Maybe Rain?">
    <meta name="twitter:description" content="Glanceable weekly weather: should I expect rain, and when?">
    <meta name="twitter:image" content="https://mdomokos.github.io/maybe-rain/og.png">
    <meta name="twitter:image:alt" content="A week of Maybe Rain?'s hourly forecast grid, coloured by condition, beside the wordmark">
    <!-- Warm up the TLS connection to the forecast API before the first fetch
         fires (preconnect pays off when there's a 100–300 ms gap ahead of the
         request; here, the JS boot + geolocation resolve provide it). -->
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.5f244688.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gutter: 44px;    /* left space for time labels */
            --gap: 10px;       /* horizontal gap between day columns */
            --block-gap: 4px;  /* vertical gap between blocks in a column */
            --overhang: 14px;  /* how far gridlines extend past the grid on the right */
            --band: 6.25%;     /* height of one hour band = 100 / displayed rows (set from JS) */
            --radius: 2px;     /* the one corner radius, used everywhere */
            --line: rgba(255,255,255,0.25); /* one hairline for panels & controls
                                               (gridlines stay at 0.3, intentionally stronger) */
            /* vertical rhythm, 8px scale */
            --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px;
        }
        /* Semantic zoom (pinch / ±): fewer columns, slightly larger type. */
        .container[data-zoom="1"] { --ui: 1.12; }
        .container[data-zoom="2"] { --ui: 1.28; }
        body {
            background: #000;
            color: #fff;
            font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', monospace;
            padding: 20px;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            /* no grey tap flash; no double-tap zoom (pinch zoom still works) */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            /* no long-press selection popups on the UI chrome */
            -webkit-user-select: none;
            user-select: none;
        }
        /* keep the tooltip values and the search field selectable */
        .tooltip, input {
            -webkit-user-select: text;
            user-select: text;
        }
        /* Width follows viewport height so the grid keeps its portrait
           proportions: larger screens get a larger grid, capped at 540px. */
        .container { max-width: clamp(380px, 54vh, 540px); margin: 0 auto; }
        .location-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            /* No flex gap: the breathing room before the ⚙ lives inside the
               location button (as padding) so it's part of the hover/tap
               target, with no dead sliver between the button and the gear. */
            gap: 0;
            margin-bottom: var(--sp-4);
            /* Right inset shared by the search field and its results panel:
               the field stops this far short of the right edge to clear the
               ⚙, while the results panel cancels it out to span the full
               grid width below. Change once, both stay in sync. */
            --search-right: 44px;
        }
        /* Type hierarchy: city name and temps lead, the rest recedes */
        .location {
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
            /* Fill the header row so the whole strip (city name plus the empty
               space up to the ⚙) is one large button: hover paints all of it
               gold and the arrow dips, matching a real click target. A long
               place name still ellipsizes (min-width:0 + the name's overflow)
               instead of pushing the gear or wrapping. */
            flex: 1;
            min-width: 0;
            padding-right: 10px;   /* breathing room before the gear, still tappable */
        }
        .location-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .location::after {
            content: '↓';
            font-size: 16px;
            opacity: 0.6;
            transition: transform 0.2s ease;
            flex-shrink: 0;   /* the arrow is never truncated */
        }
        .location:hover {
            color: #FFD700;
        }
        .location:hover::after {
            transform: translateY(2px);
        }
        /* First-visit "Locating…" state: hide the change-city arrow (there's
           no place to change yet); the header can still be tapped to search. */
        .location.locating::after { display: none; }

        /* Button styles */
        .btn {
            background: transparent;
            border: 1px solid var(--line);
            color: #fff;
            border-radius: var(--radius);
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .btn:hover, .btn:focus { border-color: rgba(255,255,255,0.6); outline: none; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Settings: the only menu in the app. */
        .gear {
            margin-left: auto;
            border: none;    /* quiet: no outline, just the glyph */
            font-size: 16px;
            line-height: 1;
            color: #ccc;
            padding: 6px 9px;
        }
        .gear:hover, .gear:focus-visible { color: #FFD700; }
        .settings {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #111;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 12px;
            z-index: 30;
            min-width: 230px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
        }
        .settings.hidden { display: none; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            color: #ccc;
        }
        /* Segmented control (settings rows + view toggle) */
        .seg {
            display: flex;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .seg button {
            background: transparent;
            border: none;
            color: #888;
            font-family: inherit;
            font-size: 12px;
            padding: 5px 10px;
            cursor: pointer;
        }
        .seg button.active { background: #fff; color: #000; }
        .seg button:focus-visible { outline: 1px solid #FFD700; outline-offset: -2px; }

        /* Rain/temperature view toggle: one tap, near the grid. Shares its
           row with the data-freshness line (freshness left, buttons right).
           Right margin = --overhang, so the buttons align with the last
           column, not the gridline overhang. */
        .view-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: var(--sp-1);
            margin-left: var(--gutter);
            margin-right: var(--overhang);
        }
        .view-toggle .seg { flex: none; }
        /* Slightly tighter than the base seg so the freshness line to its left
           keeps its full text on narrow phones without ellipsis. */
        .view-toggle .seg button { padding: 3px 8px; font-size: 11px; }

        /* Keyboard focus */
        .location:focus-visible { color: #FFD700; outline: none; }
        .weather-block:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #fff;
            z-index: 1;
            position: relative;
        }

        /* Loading states: skeleton grid, no spinner. The placeholder is the grid. */
        .weather-block.skeleton {
            background: #1c1c1c;
            cursor: default;
            animation: skeletonPulse 1.6s ease-in-out infinite;
        }
        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }
        .status.updating {
            color: #888;
            animation: skeletonPulse 1.6s ease-in-out infinite;
        }
        /* Pixelated reveal when forecast data arrives: no fades. Each
           block snaps on (dim briefly, then full) at its own discrete
           tick, in dithered order across the grid. `backwards` fill keeps
           a block invisible until its delay elapses; afterwards it returns
           to natural styles, so the hover opacity transition keeps working. */
        .weather-block.reveal {
            animation: blockIn 120ms linear backwards;
        }
        @keyframes blockIn {
            0% { opacity: 0; }
            5%, 60% { opacity: 0.45; }
            65%, 100% { opacity: 1; }
        }
        /* DR-6: one-shot ~2s pulse on cells whose forecast meaningfully
           moved since the previous model run. Lives on a pseudo-element so
           it composes with the reveal animation and its inline dither
           delay; currentColor is the block's luminance-picked glyph color,
           so the ring reads on any hue. Fires once: the class is set only
           on the first render after a new model run. */
        .weather-block.changed { position: relative; }
        .weather-block.changed::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            box-shadow: inset 0 0 0 2px currentColor;
            animation: changePulse 2s ease-out forwards;
        }
        @keyframes changePulse {
            0%, 55% { opacity: 1; }
            100% { opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .weather-block.skeleton, .status.updating { animation: none; opacity: 0.7; }
            .weather-block.reveal { animation: none; }
            /* No pulse; the was/now tooltip detail still works. */
            .weather-block.changed::after { display: none; }
        }
        /* Temperature and day labels.
           All three rows (temps, day labels, grid columns) share the same
           left gutter, gap, and flex:1 items, so they stay column-aligned
           at every width. */
        .temp-row {
            display: flex;
            gap: var(--gap);
            margin-bottom: var(--sp-1);
            padding-left: var(--gutter);
            padding-right: var(--overhang);
        }
        /* One-line temps "18/9": the ° is dropped here; the unit shows in
           settings, tooltips, and the temp-view legend. Max is white-medium,
           min is the lighter axis grey. */
        .temp-item { flex: 1; text-align: center; white-space: nowrap; }
        .temp-max { font-weight: 500; font-size: calc(14px * var(--ui, 1)); }
        .temp-sep { color: #666; font-size: calc(12px * var(--ui, 1)); }
        .temp-min { color: #888; font-size: calc(12px * var(--ui, 1)); }
        /* Day label sits directly above its temps. */
        .day-labels {
            display: flex;
            gap: var(--gap);
            margin-bottom: 2px;
            padding-left: var(--gutter);
            padding-right: var(--overhang);
        }
        .day-label {
            flex: 1;
            font-size: calc(12px * var(--ui, 1));
            color: #ccc;
            text-align: center;
        }
        .day-label.today {
            color: #FFD700;
            font-weight: 500;
        }

        /* Chart and grid */
        .chart {
            position: relative;
            /* pinch on the grid is semantic zoom (fewer columns), handled in
               JS; pan-y keeps one-finger scroll while blocking browser pinch
               here. Page-level pinch-zoom stays enabled elsewhere. */
            touch-action: pan-y;
            height: clamp(260px, 52vh, 640px);
            padding-left: var(--gutter);
            /* columns stop short of the right edge, so the full-width
               gridlines overhang the grid on both sides */
            padding-right: var(--overhang);
            margin-top: 0;
        }
        .time-labels {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: calc(var(--gutter) - 8px);
        }
        .time-label {
            position: absolute;
            font-size: calc(11px * var(--ui, 1));
            color: #888;
            right: 0;
            /* label is positioned at the vertical middle of its hour band;
               translateY centers the text on that point so each label
               lines up with its row of blocks */
            transform: translateY(-50%);
            font-weight: 300;
        }
        .chart-grid {
            display: flex;
            gap: var(--gap);
            height: 100%;
        }
        /* Gapped "pixel" grid: no column outline. Each block is a discrete
           rounded pixel; the gaps and gridlines provide the structure. */
        .day-column {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* Each hour band is exactly --band = 100% / displayed rows. A block
           fills its band minus a fixed top gap where the gridline shows through.
           (px, not %, for the gap: percentage vertical margins resolve
           against the column width, which was the old misalignment bug.)
           Colors come inline from the JS CONDITIONS array, so no condition
           data lives in CSS; flex centering plus inline color draw the glyph. */
        .weather-block {
            width: 100%;
            height: calc(var(--band) - var(--block-gap));
            margin-top: var(--block-gap);
            border-radius: var(--radius);
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(10px * var(--ui, 1));
            line-height: 1;
            position: relative;   /* anchors the corner markers */
            -webkit-user-select: none;
            user-select: none;
        }
        /* Corner markers: hazard glyphs bottom-right (⚡ ≡ ❆ ♨ ☀), sky event
           bottom-left (moon phase / eclipse). Both are bare glyphs in the
           block's luminance-picked contrast colour; absolute so they never
           disturb a centred wind arrow, and two can coexist on the 21:00
           block without overlapping. */
        .block-mark {
            position: absolute;
            bottom: 0;
            right: 2px;
            font-size: calc(9px * var(--ui, 1));
            line-height: 1;
            pointer-events: none;
        }
        .block-mark.sky { right: auto; left: 2px; }
        .weather-block:hover {
            opacity: 0.8;
        }
        /* Current hour: two-tone inset ring. Outer black band shows on light
           blocks (sunny gold), inner white band on dark blocks (navy,
           overcast). Static; the "now" cue is the axis marker below. */
        .weather-block.current {
            z-index: 1;
            position: relative;
            box-shadow: inset 0 0 0 2px #000, inset 0 0 0 4px #fff;
        }
        /* Side "now" indicator: at the current hour, the axis label becomes
           a gold current-temp marker with a ▶ pointing at today's row.
           Static; gold and weight provide the emphasis, nothing moves. */
        .time-label.now {
            color: #FFD700;
            font-weight: 600;
        }
        .time-label.now::after { content: ' ▶'; font-size: 8px; }
        .weather-block.empty {
            background: transparent;
            cursor: default;
        }

        /* Sunrise/sunset: one straight gold hairline across the full chart
           width (same span as the gridlines) at today's exact minute,
           behind the blocks, so it peeks out in the gaps (negative z-index
           keeps the data pixels on top). Starts at the column field, clear
           of the time labels; keeps the gridlines' right overhang. Per-day
           exact times live in each covering block's tooltip. */
        .sun-line {
            position: absolute;
            left: var(--gutter);
            right: 0;
            height: 0;
            border-top: 1px solid #FFD700;
            z-index: -1;
            pointer-events: none;
        }

        /* Grid lines: one 1px line at the top of each hour band, where the
           2px block gap is. Lines span the full chart width (left: 0), so
           they extend through the label gutter beyond the grid itself. */
        .chart::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.3) 0,
                rgba(255,255,255,0.3) 1px,
                transparent 1px,
                transparent var(--band)
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Legend and tooltip.
           Spectrum legend: both views render the same one-line strip of
           blocks; conditions ordered sun → cloud → rain → storm → snow
           (group labels beneath), or the heat scale in temp view. 2px gaps
           and per-block radius match the grid. */
        .legend {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 2px;
            margin-top: var(--sp-3);
            /* same gutter/overhang as the grid: the strip centers on the
               column field, not the container */
            padding: var(--sp-2) var(--overhang) 0 var(--gutter);
            border-top: 1px solid var(--line);
        }
        .legend-step {
            flex: 1;
            max-width: 52px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: #ccc;
        }
        .legend-step .swatch {
            width: 100%;
            height: 14px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            line-height: 1;
            -webkit-user-select: none;
            user-select: none;
        }
        /* group label may be wider than its cell; neighbors are empty */
        .legend-step span { min-height: 1.2em; white-space: nowrap; }
        .legend-swatch { cursor: pointer; }
        .legend-swatch:focus-visible { outline: 1px solid #fff; outline-offset: 1px; }
        .tooltip {
            position: absolute;
            background: #000;
            color: white;
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: 12px;
            width: max-content;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }
        /* One fact per line, never wrapped mid-fact ("wind 6 km/h NW"
           stays whole); the tooltip grows to fit instead. */
        .tooltip div { white-space: nowrap; line-height: 1.5; }
        /* The freshness explanation is prose, not facts: let it wrap and cap
           the width so it reads as a paragraph rather than one long line. */
        .tooltip.explain { width: auto; max-width: min(260px, calc(100vw - 16px)); padding: 10px 12px; }
        .tooltip.explain div { white-space: normal; line-height: 1.45; margin-top: 7px; }
        /* Title sits tight to the top; the muted rule under it groups the body. */
        .tooltip.explain div:first-child { margin-top: 0; }
        .tooltip.explain .tip-title {
            font-size: 12px;
            padding-bottom: 6px;
            margin-bottom: 1px;
            border-bottom: 1px solid var(--line);
        }
        /* Bold lead-ins ("Local", "Global") brighten so the eye lands on them. */
        .tooltip.explain strong { color: #fff; }
        .tooltip.explain .tip-body { color: #d0d0d0; }
        /* The docs link gets extra separation from the body prose. */
        .tooltip.explain .tip-link { margin-top: 10px; font-size: 11px; }
        /* Link inside the explanation (gold accent; the tooltip becomes
           interactive so it can be clicked; see showTooltip). */
        .tooltip a { color: #FFD700; text-decoration: underline; }
        .tooltip a:hover { color: #fff; }

        /* Status and animations. Centered on the column field like the
           legend. No hue of its own: gold is reserved for now/today/sun and
           the palette for conditions, so the status text carries the state
           in words. */
        /* Data-freshness line: shares the view-toggle row, sits to the left
           of the rain/temp/wind buttons. Ellipsizes so long states never
           push the buttons out of alignment. */
        /* The freshness line is also the refresh button: click/tap refetches,
           hover/focus explains. */
        /* Wrap holds the freshness label (refresh button) plus the ⓘ that
           owns the explanation, so hovering/tapping the label just refreshes
           and the info is a separate, non-intrusive target. */
        .status-wrap {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1 1 auto;
            min-width: 0;
        }
        .status {
            font-size: 11px;
            color: #666;
            text-align: left;
            flex: 0 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }
        .status:hover { color: #999; }
        .status:focus-visible { outline: 1px solid #FFD700; outline-offset: 2px; border-radius: 2px; }
        /* Info affordance for the freshness explanation. A small down chevron
           (inline SVG, hairline) reads as "reveal details" and stays muted so
           it doesn't compete with the state text. The SVG inherits colour via
           currentColor, so hover just brightens it. */
        .status-info {
            flex: none;
            width: 16px;
            height: 16px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            color: #777;
            background: none;
            border: none;
            cursor: help;
        }
        .status-info svg { display: block; width: 12px; height: 12px; }
        .status-info:hover { color: #fff; }
        .status-info:focus-visible { outline: 1px solid #FFD700; outline-offset: 1px; border-radius: 3px; }
        .status.stale {
            color: #B0B0B0;
        }
        /* Out of date: the run is past its expected refresh. The label becomes
           an explicit amber "update" button (bordered pill) prompting a manual
           refresh; the ↻ glyph reads as refresh for colour-blind users too.
           Like the resting line it may shrink and ellipsize (flex 0 1 auto,
           min-width 0) so a long state never overlaps or pushes the
           rain/temp/wind buttons out of the row on a narrow phone. */
        .status.outdated {
            color: #E0A83E;
            flex: 0 1 auto;
            min-width: 0;
            border: 1px solid currentColor;
            border-radius: var(--radius);
            padding: 2px 8px;
            font-weight: 500;
        }
        .status.outdated:hover { color: #F0C060; background: rgba(224,168,62,0.12); }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hidden {
            display: none;
        }

        /* Install banner: bottom-center pill, dismissible, remembered.
           Hidden by default in CSS, since it must never pre-empt the forecast.
           JS adds .revealed only after the grid has painted real data once
           and a short read delay has elapsed (see maybeScheduleInstallBanner).
           Shown once per device until installed or dismissed. */
        .install-banner {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: #111;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: none;              /* revealed only via .revealed */
            align-items: center;
            gap: 12px;
            font-size: 12px;
            z-index: 50;
            max-width: calc(100vw - 32px);
        }
        .install-banner.revealed { display: flex; animation: installIn .25s ease-out; }
        /* Opacity-only fade: animating transform would fight translateX(-50%). */
        @keyframes installIn { from { opacity: 0; } to { opacity: 1; } }
        .install-banner .btn { padding: 5px 12px; font-size: 12px; white-space: nowrap; }
        .install-banner .dismiss {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            line-height: 1;
            padding: 4px;
        }
        .install-banner .dismiss:hover { color: #fff; }

        /* Search functionality.
           When active the field overlays the whole header (absolute, filling
           the wrapper minus the gear on the right) rather than sitting beside
           the city name. This decouples the search width from the place-name
           length: a long name can never squeeze the field on a narrow screen.
           The opaque panel covers the name it replaced; the gear stays clear. */
        .search-container {
            position: absolute;
            /* Extend 8px below the wrapper and pad the bottom by the same, so
               the typed text stays vertically aligned with the city name it
               replaced while the gold underline drops clear of it: no cramp. */
            inset: 0 var(--search-right) -8px 0;   /* leave room for ⚙ on the right */
            display: flex;
            align-items: center;
            /* Flush with the app: no raised #111 box. The field sits on the
               same black as everything else, marked only by a single gold
               hairline underline (the accent, reused). Single-sided border,
               so radius stays 0. No horizontal padding, so the typed text
               starts exactly where the city name did, so the field reads as the
               same element expanded, not a new box. */
            background: #000;
            border: none;
            border-bottom: 1px solid #FFD700;
            border-radius: 0;
            padding: 0 0 8px 0;
            opacity: 0;
            pointer-events: none;   /* hidden until opened, no fade/slide in */
        }
        .search-container.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }
        .search-input {
            flex: 1;
            min-width: 0;   /* let the field shrink beside the GPS button */
            padding: 0;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            /* Match the city-name heading exactly (same size and weight) so
               the field is just that text made editable. */
            font-size: 24px;
            font-weight: 600;
            /* type="search" adds native chrome (clear button, inner spin);
               strip it so the field renders like the plain text input it replaced. */
            -webkit-appearance: none;
            appearance: none;
        }
        .search-input::-webkit-search-cancel-button,
        .search-input::-webkit-search-decoration { -webkit-appearance: none; }
        .search-input:focus {
            outline: none;
        }
        /* Compact "use my location" control, inline at the right edge of the
           search field: a solid gold square (theme accent + one corner radius)
           with a dark GPS crosshair glyph, no label. */
        .geo-btn {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            padding: 0;
            /* Clear the typed text on the left; the container's right inset
               (--search-right) keeps this button clear of the ⚙ on the right. */
            margin-left: 12px;
            background: #FFD700;         /* solid gold, the app accent */
            border: none;
            border-radius: var(--radius);
            color: #000;                 /* dark glyph on the gold fill */
            font-family: inherit;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .geo-btn:hover { background: #FFE44D; }   /* lighter gold */
        .geo-btn:active { background: #E6C200; }  /* darker gold */
        .geo-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.55); }
        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            /* Cancel the field's right inset so the panel spans the full grid
               width below and fully overlaps it, rather than stopping short
               where the field does. */
            right: calc(-1 * var(--search-right));
            margin-top: 5px;
            /* Floats over the dimmed grid on the app's own black: no outline
               box, just the list. */
            background: #000;
            border: none;
            border-radius: 0;
            /* Longer list: scale with the viewport so it fills more of the
               screen, instead of a fixed 200px. dvh overrides vh where
               supported (accurate under mobile browser chrome). */
            max-height: 60vh;
            max-height: 60dvh;
            overflow-y: auto;
            z-index: 1000;
            /* Themed scrollbar: a hairline-thin gold thumb on a dark track,
               matching the app's sunshine accent and the UI's thin lines.
               Firefox uses the standard props; Chromium/Safari use the
               ::-webkit-scrollbar pseudo-elements. */
            scrollbar-width: thin;
            scrollbar-color: #FFD700 transparent;
        }
        .search-results::-webkit-scrollbar { width: 6px; }
        .search-results::-webkit-scrollbar-track {
            background: transparent;
        }
        .search-results::-webkit-scrollbar-thumb {
            /* 2px #000 border + padding-box clip leaves a ~2px gold hairline,
               floating clear of the panel edges */
            background: #FFD700;
            border: 2px solid #000;
            background-clip: padding-box;
            border-radius: var(--radius);
        }
        .search-result {
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        /* Favorites-cap advisory: amber, matching the app's "attention" accent,
           softer than an error. Sits above the results until it self-clears. */
        .fav-hint {
            padding: 8px 12px;
            font-size: 11px;
            line-height: 1.3;
            color: #E0A83E;
            background: rgba(224, 168, 62, 0.08);
            border-bottom: 1px solid var(--line);
        }
        .search-result .forget {
            background: none;
            border: none;
            color: #666;
            font-family: inherit;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 6px;
        }
        .search-result .forget:hover { color: #fff; }
        /* Row actions: ★ favorite toggle + ✕ dismiss, right-aligned. */
        .result-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
        .search-result .fav {
            background: none;
            border: none;
            color: #555;              /* muted outline star when not a favorite */
            font-family: inherit;
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
            padding: 4px 6px;
        }
        .search-result .fav.on { color: #FFD700; }   /* gold when favorited */
        .search-result .fav:hover { color: #FFD700; }
        /* One active row at a time. Hover and the keyboard both drive this
           single .highlighted class (see the mouseover sync in JS), so the
           pointer and the Enter target never disagree, and there's only ever
           one gold row, including the first-result preselect. */
        .search-result.highlighted {
            color: #FFD700;   /* highlight by tinting the text, not the row */
        }
        .search-result + .search-result {
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        /* Also gold the divider just beneath the active row, to bracket it */
        .search-result.highlighted + .search-result {
            border-top-color: #FFD700;
        }
        .container.search-active #content {
            /* Dim the grid and disable its taps so a stray touch can't open a
               tooltip while searching. The tap still reaches the document,
               which reads it as an outside-click and closes search; that
               dimmed area is the escape target. */
            filter: brightness(0.4);
            pointer-events: none;
            transition: filter 0.3s ease;
        }

        /* Mobile styles */
        @media (max-width: 480px) {
            :root {
                --gutter: 36px;
                --gap: 7px;
                --block-gap: 3px;
                --overhang: 10px;
            }
            body {
                padding: 10px;
                min-height: 100vh;
                min-height: -webkit-fill-available;
                min-height: 100dvh;
            }
            .container {
                max-width: 100%;
                height: 100vh;
                height: -webkit-fill-available;
                height: 100dvh;
                display: flex;
                flex-direction: column;
            }
            /* Let the grid absorb whatever height the screen has:
               tall phones get a taller grid, everything stays one screen. */
            #content {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            .chart {
                flex: 1;
                height: auto;
                min-height: 280px;
                margin-top: var(--sp-1);
            }
            .location-wrapper {
                margin-bottom: var(--sp-2);
            }
            .location {
                font-size: 18px;
            }
            .search-input {
                font-size: 18px;   /* stay matched to the heading on phones */
            }
            .location::after {
                font-size: 14px;
            }
            .time-label {
                font-size: calc(10px * var(--ui, 1));
            }
            .temp-max {
                font-size: calc(13px * var(--ui, 1));
            }
            .temp-min, .temp-sep {
                font-size: calc(11px * var(--ui, 1));
            }
            /* °F triple digits ("104/86" = 6 monospace chars) need a font
               step down to fit a ~36px phone column. °C never triggers it. */
            .temp-row.unit-f .temp-max { font-size: calc(10px * var(--ui, 1)); }
            .temp-row.unit-f .temp-min, .temp-row.unit-f .temp-sep { font-size: calc(9px * var(--ui, 1)); }
            .day-label {
                font-size: calc(11px * var(--ui, 1));
            }
            .legend {
                margin-top: var(--sp-2);
                padding-top: var(--sp-2);
            }
            .legend-step {
                font-size: 9px;
            }
            html {
                height: -webkit-fill-available;
            }
        }

        /* Installed PWA on a phone: the app fills the screen. Lock the
           viewport (no scroll, no rubber-banding) and pad into the safe
           areas (viewport-fit=cover plus a translucent status bar mean
           content otherwise runs under the notch/home bar). The .standalone
           class is set from JS (display-mode media query + iOS legacy). */
        @media (max-width: 480px) {
            html.standalone, html.standalone body {
                overflow: hidden;
                overscroll-behavior: none;
                height: 100dvh;
            }
            html.standalone body {
                position: fixed;
                inset: 0;
                padding: calc(10px + env(safe-area-inset-top, 0px))
                         calc(10px + env(safe-area-inset-right, 0px))
                         calc(10px + env(safe-area-inset-bottom, 0px))
                         calc(10px + env(safe-area-inset-left, 0px));
            }
            html.standalone .container { height: 100%; }
            html.standalone .chart { min-height: 0; }
        }

        /* ------------------------------------------------------------------
           Tablet / iPad. The phone rule (≤480px) fills the screen edge to
           edge; the default rule centers a narrow ≤540px column. Between them
           an iPad got that narrow column floating in a sea of black. These
           two rules close the gap. Portrait is the intended orientation for a
           vertical agenda grid, so it does the real work: the column widens
           and the grid stretches to the bottom of the screen. Landscape (short
           and wide) just stays tidy and centered. The landscape rule is gated
           on pointer:coarse + a tall min-height so desktop/laptop browsers in
           the same width range are never caught. */

        /* Portrait tablet: fill the viewport height like the phone, but keep a
           centered column with a larger cap and roomier margins. */
        @media (min-width: 481px) and (orientation: portrait) {
            /* A *definite* container height (not flex-grow inside a min-height
               body) is required so the grid's percentage cell heights (--band)
               resolve, the same approach the phone rule uses. Growing the
               container with flex:1 fills the screen but collapses every cell
               to ~0 height (an empty grid). calc(100dvh - 56px) accounts for
               the 28px body padding top+bottom, so it fills without overflow. */
            body { padding: 28px; }
            .container {
                max-width: min(820px, 90vw);
                height: calc(100vh - 56px);
                height: calc(100dvh - 56px);
                margin: 0 auto;
                display: flex;
                flex-direction: column;
            }
            #content {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            /* the grid absorbs the extra height so it reaches the bottom */
            .chart {
                flex: 1;
                height: auto;
                min-height: 360px;
                margin-top: var(--sp-2);
            }
            /* larger lead type for the bigger canvas (grid cells scale with
               the chart height on their own; these are the text elements) */
            .location { font-size: 28px; }
            .search-input { font-size: 28px; }   /* stay matched to the heading */
            .location::after { font-size: 18px; }
            .time-label { font-size: calc(12px * var(--ui, 1)); }
            .day-label { font-size: calc(13px * var(--ui, 1)); }
            .temp-max { font-size: calc(15px * var(--ui, 1)); }
            .temp-min, .temp-sep { font-size: calc(13px * var(--ui, 1)); }
        }

        /* Landscape tablet (touch, tall viewport): short and wide. Don't fill
           height; center the portrait grid and cap it so it never overflows.
           min-height rules out phones in landscape; pointer:coarse rules out
           desktops. */
        @media (orientation: landscape) and (min-height: 600px) and (pointer: coarse) {
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: -webkit-fill-available;
                min-height: 100dvh;
                padding: 24px;
            }
            .container { max-width: clamp(420px, 64vh, 600px); width: 100%; }
            .chart { height: clamp(280px, 58vh, 620px); }
        }

        /* desktop keyboard-shortcut reference in the settings pane */
        .shortcuts-hint {
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: #666;
            font-size: 11px;
            border-top: 1px solid var(--line);
            padding-top: 10px;
            margin-top: 2px;
        }
        .shortcuts-hint .sc { display: flex; justify-content: space-between; gap: 12px; }
        .shortcuts-hint .sc span:last-child { color: #888; letter-spacing: 0.04em; }

        /* Window Controls Overlay: on Chromium desktop the black background
           extends into the OS title bar. The drag strip keeps the window
           movable; content is padded below it. display:none outside this
           display mode, so mobile, standalone, and browser are unaffected. */
        .titlebar-drag { display: none; }
        @media (display-mode: window-controls-overlay) {
            .titlebar-drag {
                display: block;
                position: fixed;
                top: 0;
                left: env(titlebar-area-x, 0);
                width: env(titlebar-area-width, 100%);
                height: env(titlebar-area-height, 33px);
                -webkit-app-region: drag;
                app-region: drag;
                z-index: 40;
            }
            body { padding-top: calc(env(titlebar-area-height, 33px) + 8px); }
            /* keep controls clickable if any reaches the bar */
            .location, .gear, .btn, .search-container {
                -webkit-app-region: no-drag;
                app-region: no-drag;
            }
        }
    </style>
</head>
<body>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <div class="container fade-in">
        <div class="location-wrapper">
            <div class="location" id="location" role="button" tabindex="0" aria-label="Change city"><span class="location-name" id="locationName"></span></div>
            <div class="search-container" id="searchContainer">
                <input type="search"
                       class="search-input"
                       id="searchInput"
                       name="q"
                       placeholder="Search city..."
                       inputmode="search"
                       enterkeyhint="search"
                       autocomplete="off"
                       autocorrect="off"
                       autocapitalize="off"
                       spellcheck="false"
                       data-lpignore="true"
                       data-1p-ignore
                       data-form-type="other">
                <button type="button" class="geo-btn" id="geoBtn"
                        aria-label="Use my location" title="Use my location">⌖</button>
                <div class="search-results" id="searchResults"></div>
            </div>
            <button class="btn gear" id="gear" aria-label="Settings" aria-expanded="false">⚙</button>
            <div class="settings hidden" id="settings"></div>
        </div>

        <div id="content">
            <div class="day-labels" id="days"></div>
            <div class="temp-row" id="temps"></div>
            <div class="chart">
                <div id="sunLines"></div>
                <div class="time-labels" id="times"></div>
                <div class="chart-grid" id="grid"></div>
            </div>
            <div class="view-toggle" id="viewToggle">
                <div class="status-wrap">
                    <div id="status" class="status" tabindex="0" role="button"></div>
                    <button class="status-info" id="statusInfo" aria-label="About forecast freshness"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                </div>
                <div class="seg">
                    <button data-view="rain">rain</button>
                    <button data-view="temp">temp</button>
                    <button data-view="wind">wind</button>
                </div>
            </div>
            <div class="legend" id="legend"></div>
        </div>
    </div>

    <div class="install-banner" id="installBanner">
        <span id="installText"></span>
        <button class="btn" id="installGo">Install</button>
        <button class="dismiss" id="installDismiss" aria-label="Dismiss">✕</button>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        // ---------------------------------------------------------------
        // Maybe Rain? A single-file weather app.
        // Data: Open-Meteo (keyless, true hourly, 7 days, city-local time).
        // ---------------------------------------------------------------
        const FRESH_TIME = 10 * 60 * 1000;   // consider data fresh for 10 min
        const FETCH_TIMEOUT = 10 * 1000;     // abort a stalled forecast fetch after 10s
        const HOUR_START = 6, HOUR_END = 21; // displayed hours (inclusive)
        // The forecast uses Open-Meteo "Best Match" (a different model per
        // location, whose identity the API never returns). For the freshness
        // line we read the *run* time of the global model that drives the
        // 7-day horizon (DWD ICON, 6-hourly, hourly, 7.5 days) as an honest
        // reference for how recent the underlying model output is. The
        // metadata endpoint is tiny and is NOT counted against rate limits.
        const META_URL = 'https://api.open-meteo.com/data/dwd_icon/static/meta.json';
        // Regional high-resolution models Best Match may use for the near-term
        // hours; each refreshes more often than the global run and covers a
        // limited area. bbox = [latMin, lonMin, latMax, lonMax], read from each
        // model's own meta.json. Best Match never reveals which model it picked
        // per point, so this is an approximation: of the models whose grid
        // contains the location, pick the one whose center is nearest (see
        // localModelFor). A location outside every box → global indicator only.
        const LOCAL_MODELS = [
            { slug: 'meteofrance_arome_france_hd',     label: 'AROME',    bbox: [37.5, -12.0, 55.4, 16.0] },
            { slug: 'dwd_icon_d2',                     label: 'ICON-D2',  bbox: [43.18, -3.94, 58.08, 20.34] },
            { slug: 'knmi_harmonie_arome_netherlands', label: 'HARMONIE', bbox: [49.0, 0.0, 56.0, 11.28] },
            { slug: 'ukmo_uk_deterministic_2km',       label: 'UKMO',     bbox: [44.51, -17.15, 61.93, 15.35] },
            { slug: 'ncep_hrrr_conus',                 label: 'HRRR',     bbox: [21.14, -122.72, 47.84, -60.92] },
            { slug: 'jma_msm',                         label: 'MSM',      bbox: [22.4, 120.0, 47.6, 150.0] }
        ];
        const localMetaURL = slug => `https://api.open-meteo.com/data/${slug}/static/meta.json`;
        const localModelFor = (lat, lon) => {
            let best = null, bestD = Infinity;
            for (const m of LOCAL_MODELS) {
                const [a, b, c, d] = m.bbox;
                if (lat < a || lat > c || lon < b || lon > d) continue;
                const dist = (lat - (a + c) / 2) ** 2 + (lon - (b + d) / 2) ** 2;
                if (dist < bestD) { bestD = dist; best = m; }
            }
            return best;
        };
        // The line counts down to the next model update, estimated from the
        // current run's own publish lag. Once that estimate passes by more than
        // this grace, the update is genuinely overdue → warn amber.
        const NEXT_UPDATE_GRACE = 60 * 60 * 1000;
        // DR-7: the status line is the app's single state channel. A transient
        // message (a copy confirmation, a geolocation error, "Back online")
        // lives this long, then the line reverts to its resting freshness job.
        const STATUS_TRANSIENT_MS = 2200;
        // DR-6/DR-7: staleness escalation is normally tied to the model's
        // cadence (a missed next-release, see forecastOverdue). This 24h age is
        // only the fallback used when no model metadata is available to reason
        // about cadence, so a day-old forecast still escalates to the amber
        // dated warning instead of the calm grey "outdated".
        const DEEP_STALE_TIME = 24 * 60 * 60 * 1000;
        // DR-6 layer 2: per-view "meaningfully moved" thresholds. A cell
        // whose forecast moved at least this much since the previous model
        // run pulses once in the matching view; the was/now detail rides
        // the tooltip. Per-view because a single pop-based rule would leave
        // the temp and wind views inert.
        const CHANGE_POP = 30;  // percentage points of rain probability
        const CHANGE_TEMP = 3;  // °C
        const CHANGE_WIND = 15; // km/h
        const DEFAULT_PLACE = {
            name: 'Whakatane', country: 'New Zealand', admin1: 'Bay of Plenty',
            latitude: -37.9586, longitude: 176.9854
        };
        const LS_PLACE = 'mr-place';
        // DR-6: per-place cache prefix. Entries live at mr-forecast:<placeKey>
        // → {timestamp, payload}, so switching cities paints instantly.
        const LS_FORECAST = 'mr-forecast';
        const LS_CITIES = 'mr-cities';   // saved search shortcuts, MRU, max 12
        const LS_SETTINGS = 'mr-settings';
        const LS_VIEW = 'mr-view';       // 'rain' | 'temp' | 'wind' grid mode
        const LS_INSTALL = 'mr-install-dismissed';
        const LS_FAVORITES = 'mr-favorites'; // explicit ★ favorites (capped, user-curated)
        const LS_META = 'mr-model-meta';     // cached global model-run metadata (run time + cadence)
        const LS_META_LOCAL = 'mr-model-meta-local'; // cached regional model meta, keyed by model slug
        const MAX_CITIES = 12;   // cap on recent cities (MRU-evicted); favorites are separate
        const MAX_FAVORITES = 6; // cap on ★ favorites (user must unfavorite to add more)
        // ⌘ on Apple platforms, Ctrl elsewhere, for the shortcut hint label.
        const MOD = /mac|iphone|ipad/i.test(navigator.platform || navigator.userAgent) ? '⌘' : 'Ctrl+';

        // --- Preferences (the app's only menu) ---------------------------
        // settings + view are initialised below, after loadJSON is defined.
        let settings, view;
        let zoom = 0; // semantic zoom (pinch/±): 0 = full week, never persisted;
                      // the app always opens on the full week

        const ZOOM_DAYS = [7, 5, 3];      // columns per zoom level
        const ZOOM_HOUR_FRAC = [1, 0.75, 0.5]; // share of the hour range shown

        const hourRange = () => settings.allHours
            ? { start: 0, end: 23 } : { start: HOUR_START, end: HOUR_END };

        // The window of days/hours actually rendered at the current zoom.
        // Hours center on "now" (clamped to the range); days keep today first.
        const visibleWindow = () => {
            const { start, end } = hourRange();
            const full = end - start + 1;
            const n = Math.max(6, Math.round(full * ZOOM_HOUR_FRAC[zoom]));
            if (n >= full) return { start, end, days: ZOOM_DAYS[zoom] };
            const s = Math.max(start, Math.min(cityNow().hour - (n >> 1), end - n + 1));
            return { start: s, end: s + n - 1, days: ZOOM_DAYS[zoom] };
        };
        const applyBand = () => {
            const w = visibleWindow();
            document.documentElement.style.setProperty('--band', `${100 / (w.end - w.start + 1)}%`);
        };

        const displayTemp = c => settings.unit === 'F' ? Math.round(c * 9 / 5 + 32) : c;
        // Wind is stored in km/h (Open-Meteo default); converted at render.
        const WIND_UNITS = { kmh: ['km/h', 1], mph: ['mph', 0.621371], kn: ['kn', 0.539957] };
        const displayWind = k => Math.round(k * WIND_UNITS[settings.windUnit][1]);
        const windUnitLabel = () => WIND_UNITS[settings.windUnit][0];
        const hourLabel = h => settings.clock === '12'
            ? `${((h + 11) % 12) + 1}${h < 12 ? 'am' : 'pm'}`
            : `${h}:00`;
        // Minute-exact variant for sunrise/sunset.
        const timeLabel = (h, m) => settings.clock === '12'
            ? `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`
            : `${h}:${String(m).padStart(2, '0')}`;

        // --- Temperature & wind view scales -------------------------------
        // One piecewise-linear interpolator over [value, rgb] stops.
        const scaleRGB = (stops, t) => {
            if (t <= stops[0][0]) return stops[0][1];
            for (let i = 1; i < stops.length; i++) {
                const [t1, c1] = stops[i - 1], [t2, c2] = stops[i];
                if (t <= t2) {
                    const f = (t - t1) / (t2 - t1);
                    return c1.map((c, j) => Math.round(c + (c2[j] - c) * f));
                }
            }
            return stops[stops.length - 1][1];
        };
        // Heat: cold blue → white → gold → hot red, anchored in °C.
        const HEAT_STOPS = [[-5, [74, 144, 217]], [10, [245, 245, 245]], [22, [255, 215, 0]], [35, [229, 72, 77]]];
        const heatRGB = t => scaleRGB(HEAT_STOPS, t);
        // Wind: calm grey → breeze teal → fresh green → strong gold → gale
        // red, anchored in km/h (≈ Beaufort 0 / 3 / 5 / 7 / 9+).
        const WIND_STOPS = [[0, [58, 58, 58]], [12, [72, 143, 138]], [29, [80, 200, 120]], [50, [255, 215, 0]], [75, [229, 72, 77]]];
        const windRGB = v => scaleRGB(WIND_STOPS, v);
        // Open-Meteo reports the bearing the wind comes from; the block
        // arrow points where it blows to (wind from N → ↓). 8 octants.
        const WIND_ARROWS = ['↓', '↙', '←', '↖', '↑', '↗', '→', '↘'];
        const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        const windOctant = d => Math.round(d / 45) % 8;

        // --- Conditions: defined in one place -----------------------------
        // Ordered scales: gold sun; 3-step grey for cloud cover (fog folds
        // into the lightest grey, marked by its ≡ glyph); 3-step blue for
        // rain intensity; violet storm; white snow. Grid colors, legend
        // strip, and tooltip labels all derive from this array; condition
        // data is defined only here, not in CSS or HTML.
        const CONDITIONS = [
            { key: 'sunny',         color: '#FFD700', label: 'Sunny',         group: 'sun' },
            { key: 'partly-cloudy', color: '#B0B0B0', label: 'Partly cloudy', group: 'cloud' },
            { key: 'cloudy',        color: '#757575', label: 'Cloudy',        group: 'cloud' },
            { key: 'overcast',      color: '#454545', label: 'Overcast',      group: 'cloud' },
            { key: 'light-rain',    color: '#87CEEB', label: 'Light rain',    group: 'rain' },
            { key: 'moderate-rain', color: '#4169E1', label: 'Rain',          group: 'rain' },
            { key: 'heavy-rain',    color: '#191970', label: 'Heavy rain',    group: 'rain' },
            { key: 'thunderstorm',  color: '#7B2FBE', label: 'Storm',         group: 'storm' },
            { key: 'snow',          color: '#F0F8FF', label: 'Snow',          group: 'snow' }
        ];
        const COND = Object.fromEntries(CONDITIONS.map(c => [c.key, c]));
        const PRECIP = new Set(['rain', 'storm', 'snow']); // probability fade applies

        // Hazard glyphs: redundant non-color markers for hazards only,
        // never ordinary data. Vocabulary of five (DR-10): ⚡ lightning incl.
        // hail, ≡ fog, ❆ freezing rain/drizzle (weather-coded, below), plus
        // ♨ extreme heat and ☀ very-high UV (threshold hazards, applied at
        // render time by value not code). Every applicable one shows, packed
        // into the block corner (rarely more than two). U+FE0E keeps the
        // glyphs non-emoji.
        const HAZARD_GLYPH = {
            95: '⚡︎', 96: '⚡︎', 99: '⚡︎',       // thunderstorm / hail
            45: '≡', 48: '≡',                  // fog, visibility hazard
            56: '❆', 57: '❆', 66: '❆', 67: '❆' // freezing precipitation
        };
        // A legend cell carries a glyph only when every code mapping to it
        // has the same one (⚡ on storm); exceptional hazards (fog, freezing
        // rain) mark blocks, not legend cells.
        const glyphFor = key => {
            const glyphs = Object.entries(WMO)
                .filter(([, [k]]) => k === key)
                .map(([code]) => HAZARD_GLYPH[code] || '');
            return glyphs.length && glyphs.every(g => g && g === glyphs[0]) ? glyphs[0] : '';
        };

        // Blocks/legend cells get an inline background + a black or white
        // glyph color picked by luminance.
        const hexRGB = hex => {
            const n = parseInt(hex.slice(1), 16);
            return [n >> 16, (n >> 8) & 255, n & 255];
        };
        const textOn = rgb =>
            (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.55 ? '#000' : '#fff';

        // --- Rain probability fade ---------------------------------------
        // Precipitation blocks fade toward a dark navy (not black) as the
        // probability drops, so a 30%-chance shower stays clearly blue and
        // is not mistaken for the cloudy greys. Solid hue = certain rain.
        const NAVY = [13, 32, 77];
        const fadeRGB = (hex, pop) => {
            const w = 0.35 + 0.65 * Math.max(0, Math.min(100, pop)) / 100;
            return hexRGB(hex).map((c, i) => Math.round(NAVY[i] + (c - NAVY[i]) * w));
        };

        // --- Sky events: moon phase + notable lunar eclipses -------------
        // Marked as a bare glyph on each day's 21:00 block (bottom-left, so
        // it never collides with a bottom-right hazard). Text glyphs match
        // the hazard vocabulary; custom SVG icons are a planned follow-up.
        //
        // Phase instants come from Meeus' "Astronomical Algorithms" ch.49
        // (principal periodic terms only): a mean-synodic model drifts up to
        // a day by the 2020s, but this stays within minutes, so a phase
        // always lands on the right night. ΔT (<2 min) and planetary terms
        // (<0.001 d) are dropped as far below a day boundary. `k` counts
        // quarter-phases from the 2000 new moon: integer = new, +.25 first
        // quarter, +.5 full, +.75 last.
        const D2R = Math.PI / 180;
        const phaseInstantMs = k => {
            const p = k - Math.floor(k);            // .00/.25/.50/.75
            const T = k / 1236.85;
            let J = 2451550.09766 + 29.530588861 * k
                + 0.00015437 * T*T - 0.000000150 * T*T*T + 0.00000000073 * T*T*T*T;
            const M  = (2.5534   + 29.10535670 * k - 0.0000014 * T*T - 0.00000011 * T*T*T) * D2R;
            const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T*T + 0.00001238 * T*T*T - 0.000000058 * T*T*T*T) * D2R;
            const F  = (160.7108 + 390.67050284 * k - 0.0016118 * T*T - 0.00000227 * T*T*T + 0.000000011 * T*T*T*T) * D2R;
            const Om = (124.7746 - 1.56375588 * k + 0.0020672 * T*T + 0.00000215 * T*T*T) * D2R;
            const E = 1 - 0.002516 * T - 0.0000074 * T*T;
            const s = Math.sin;
            if (p < 1e-6 || Math.abs(p - 0.5) < 1e-6) { // new / full share the term set
                J += -0.40720*s(Mp) + 0.17241*E*s(M) + 0.01608*s(2*Mp) + 0.01039*s(2*F)
                    + 0.00739*E*s(Mp-M) - 0.00514*E*s(Mp+M) + 0.00208*E*E*s(2*M)
                    - 0.00111*s(Mp-2*F) - 0.00057*s(Mp+2*F) + 0.00056*E*s(2*Mp+M)
                    - 0.00042*s(3*Mp) + 0.00042*E*s(M+2*F) + 0.00038*E*s(M-2*F)
                    - 0.00024*E*s(2*Mp-M) - 0.00017*s(Om) - 0.00007*s(Mp+2*M)
                    + 0.00004*s(2*Mp-2*F) + 0.00004*s(3*M) + 0.00003*s(Mp+M-2*F)
                    + 0.00003*s(2*Mp+2*F) - 0.00003*s(Mp+M+2*F) + 0.00003*s(Mp-M+2*F)
                    - 0.00002*s(Mp-M-2*F) - 0.00002*s(3*Mp+M) + 0.00002*s(4*Mp);
            } else {                                  // first / last quarter
                J += -0.62801*s(Mp) + 0.17172*E*s(M) - 0.01183*E*s(Mp+M) + 0.00862*s(2*Mp)
                    + 0.00804*s(2*F) + 0.00454*E*s(Mp-M) + 0.00204*E*E*s(2*M)
                    - 0.00180*s(Mp-2*F) - 0.00070*s(Mp+2*F) - 0.00040*s(3*Mp)
                    - 0.00034*E*s(2*Mp-M) + 0.00032*E*s(M+2*F) + 0.00032*E*s(M-2*F)
                    - 0.00028*E*E*s(Mp+2*M) + 0.00027*E*s(2*Mp+M) - 0.00017*s(Om)
                    - 0.00005*s(Mp-M-2*F) + 0.00004*s(2*Mp+2*F) - 0.00004*s(Mp+M+2*F)
                    + 0.00004*s(Mp-2*M) + 0.00003*s(Mp+M-2*F) + 0.00003*s(3*M)
                    + 0.00002*s(2*Mp-2*F) + 0.00002*s(Mp-M+2*F) - 0.00002*s(3*Mp+M);
                const W = 0.00306 - 0.00038*E*Math.cos(M) + 0.00026*Math.cos(Mp)
                    - 0.00002*Math.cos(Mp-M) + 0.00002*Math.cos(Mp+M) + 0.00002*Math.cos(2*F);
                J += p < 0.5 ? W : -W;                // first quarter +W, last quarter -W
            }
            return (J - 2440587.5) * 86400000;        // Julian Day → Unix ms (UTC)
        };
        const PHASE_MARK = { 0: ['○', 'New moon'], 0.25: ['◐', 'First quarter'],
                             0.5: ['●', 'Full moon'], 0.75: ['◑', 'Last quarter'] };
        // total/partial lunar eclipses only (penumbral are barely perceptible);
        // greatest eclipse in UTC. A 7-day forecast only ever reaches a few.
        const LUNAR_ECLIPSES = [
            { t: Date.UTC(2026, 2, 3, 11, 34),   kind: 'total'   },
            { t: Date.UTC(2026, 7, 28, 4, 14),   kind: 'partial' },
            { t: Date.UTC(2028, 0, 12, 4, 14),   kind: 'partial' },
            { t: Date.UTC(2028, 6, 6, 18, 20),   kind: 'partial' },
            { t: Date.UTC(2028, 11, 31, 16, 52), kind: 'total'   }
        ];
        // Sky event for a city-local date ("YYYY-MM-DD"), or null. The local
        // day becomes a UTC window via the forecast's utc offset, so the mark
        // lands on the right calendar day for the city. An eclipse (always at
        // full moon) outranks the plain full-moon mark.
        const skyEventFor = date => {
            const dayStart = Date.parse(date + 'T00:00:00Z') - (state.utcOffset || 0) * 1000;
            const dayEnd = dayStart + 86400000;
            const ecl = LUNAR_ECLIPSES.find(e => e.t >= dayStart && e.t < dayEnd);
            if (ecl) return { glyph: '◉', label: `Lunar eclipse (${ecl.kind})` };
            // scan the quarter-phases around this date for one landing today
            const approxK = (dayStart / 86400000 / 365.25 + 1970 - 2000) * 12.3685;
            const base = Math.round(approxK);
            for (let k = base - 1; k <= base + 1; k += 0.25) {
                const t = phaseInstantMs(k);
                if (t >= dayStart && t < dayEnd) {
                    const mark = PHASE_MARK[Math.round((k - Math.floor(k)) * 4) / 4];
                    return { glyph: mark[0], label: mark[1] };
                }
            }
            return null;
        };

        const $ = id => document.getElementById(id);
        const show = (el, visible = true) => el.classList.toggle('hidden', !visible);
        const esc = s => String(s).replace(/[&<>"']/g, c =>
            ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        let state = {
            place: DEFAULT_PLACE,
            tz: 'Pacific/Auckland', // overwritten by every forecast response
            data: [],     // [day][{hour, temp, pop, condition, description}], all real hours
            days: [],     // [{text, isToday, date}]
            sun: {},      // date → { rise: {h, m}, set: {h, m} } (city-local)
            fetchedAt: 0, // timestamp of the forecast currently displayed
            modelRun: null, // global model run: { init, interval, nextUpdate } ms, from the metadata API
            localRun: null, // regional high-res model run (or null): { init, interval, nextUpdate, slug, label }
            loading: false,
            controller: null,
            online: navigator.onLine, // tracked via online/offline events (DR-7)
            swUpdate: false, // a newer app version is waiting (DR-7 reload CTA)
            lastError: '',   // last no-data error text, so updateStatus can restate it
            changed: null,   // DR-6: "date|hour" → {pop|temp|wind: [was, now]} vs the previous model run
            pulsePending: false, // DR-6: the next render pulses changed cells, then consumes this
            suggestions: [] // saved cities + geocoding hits, in display order
        };

        // --- localStorage persistence ------------------------------------
        const placeKey = p => `${p.latitude.toFixed(3)},${p.longitude.toFixed(3)}`;
        const loadJSON = key => {
            try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
        };
        const saveJSON = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* full/blocked: non-fatal */ }
        };

        // --- DR-6: per-place forecast cache -------------------------------
        // One entry per place, keyed by placeKey. An entry leaves the cache
        // three ways only, never by wall-clock age: superseded (a fetch
        // overwrites it), orphaned (its place leaves favorites ∪ recents ∪
        // the place on screen, so no UI path reaches it), or fully expired
        // (its last forecast hour is in the past, place-local, so nothing
        // honest can be rendered). Old-but-labeled data answers something;
        // a purged cache answers nothing.
        const forecastCacheKey = p => `${LS_FORECAST}:${placeKey(p)}`;
        const loadForecast = p => loadJSON(forecastCacheKey(p));
        const saveForecast = (p, entry) => saveJSON(forecastCacheKey(p), entry);
        // Fully expired: the payload's hourly times are place-local ISO
        // strings and it carries utc_offset_seconds, so "is the last hour in
        // the past?" is a string compare against place-local now. For a
        // 7-day payload this fires ~7 days after fetch.
        const forecastExpired = entry => {
            const t = entry?.payload?.hourly?.time;
            if (!t?.length) return true;
            const offset = entry.payload.utc_offset_seconds || 0;
            const localNow = new Date(Date.now() + offset * 1000).toISOString().slice(0, 16);
            return t[t.length - 1] < localNow;
        };
        // Sweep: drop every entry that is orphaned or fully expired. The
        // keep-set includes the current place even when it is in neither
        // list (a timezone guess or favorite cycling arrives with
        // remember=false), since it is on screen and its cache serves the
        // next open. Called at startup (off the critical path) and at the
        // membership-removal points: ✕ dismiss, MRU eviction, unfavorite.
        const sweepForecasts = () => {
            const keep = new Set([...favorites, ...savedCities, state.place].map(placeKey));
            const prefix = `${LS_FORECAST}:`;
            try {
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const k = localStorage.key(i);
                    if (!k || !k.startsWith(prefix)) continue;
                    if (!keep.has(k.slice(prefix.length)) || forecastExpired(loadJSON(k))) {
                        localStorage.removeItem(k);
                    }
                }
            } catch { /* blocked storage: non-fatal */ }
        };
        // DR-6 layer 2: history is keyed by model run, not by poll. Two
        // payloads count as the same run when the hourly arrays that drive
        // the grid are identical; string equality on ~9 KB is microseconds,
        // so no hash function (principle 5: less code).
        const hourlySnapshot = p => JSON.stringify([
            p.hourly.time, p.hourly.temperature_2m, p.hourly.weather_code,
            p.hourly.precipitation_probability, p.hourly.wind_speed_10m
        ]);
        // Cells present in both payloads whose delta crosses a per-view
        // threshold, as "date|hour" → {pop|temp|wind: [was, now]}.
        const diffHourly = (oldP, newP) => {
            const o = oldP.hourly, n = newP.hourly;
            const at = new Map(o.time.map((t, i) => [t, i]));
            const moved = (a, b, min) => a != null && b != null && Math.abs(a - b) >= min;
            const out = {};
            for (let i = 0; i < n.time.length; i++) {
                const j = at.get(n.time[i]);
                if (j == null) continue;
                const d = {};
                if (moved(n.precipitation_probability?.[i], o.precipitation_probability?.[j], CHANGE_POP))
                    d.pop = [o.precipitation_probability[j], n.precipitation_probability[i]];
                if (moved(n.temperature_2m?.[i], o.temperature_2m?.[j], CHANGE_TEMP))
                    d.temp = [o.temperature_2m[j], n.temperature_2m[i]];
                if (moved(n.wind_speed_10m?.[i], o.wind_speed_10m?.[j], CHANGE_WIND))
                    d.wind = [o.wind_speed_10m[j], n.wind_speed_10m[i]];
                if (d.pop || d.temp || d.wind)
                    out[`${n.time[i].slice(0, 10)}|${+n.time[i].slice(11, 13)}`] = d;
            }
            return out;
        };
        // Was/now tooltip lines for a changed cell, in the user's units.
        const changeLines = ch => {
            if (!ch) return [];
            const lines = [];
            if (ch.pop) lines.push(`rain ${ch.pop[0]}% → ${ch.pop[1]}%`);
            if (ch.temp) lines.push(`${displayTemp(Math.round(ch.temp[0]))}° → ${displayTemp(Math.round(ch.temp[1]))}°`);
            if (ch.wind) lines.push(`wind ${displayWind(ch.wind[0])} → ${displayWind(ch.wind[1])} ${windUnitLabel()}`);
            return lines;
        };

        // One-time migration: the legacy single mr-forecast slot becomes the
        // keyed entry for its own place, then the old key goes.
        {
            const legacy = loadJSON(LS_FORECAST);
            if (legacy?.placeKey && legacy.payload) {
                saveJSON(`${LS_FORECAST}:${legacy.placeKey}`,
                    { timestamp: legacy.timestamp, payload: legacy.payload });
            }
            if (legacy) { try { localStorage.removeItem(LS_FORECAST); } catch { /* non-fatal */ } }
        }
        // heatWarn is anchored in °C; uvWarn is a UV index; ♨/☀ thresholds,
        // user-settable in the ⚙ menu because regions differ.
        const VIEWS = ['rain', 'temp', 'wind'];
        const enabledViews = () => VIEWS.filter(v => settings.views[v]);
        {
            const saved = loadJSON(LS_SETTINGS) || {};
            settings = {
                unit: 'C', clock: '24', allHours: false, heatWarn: 35, uvWarn: 8,
                windUnit: 'kmh', legend: true, sunLines: true, ...saved,
                // deep-merged so pre-wind saved settings still get defaults
                views: { rain: true, temp: true, wind: true, ...(saved.views || {}) }
            };
        }
        {
            const saved = loadJSON(LS_VIEW);
            view = VIEWS.includes(saved) && settings.views[saved]
                ? saved : (enabledViews()[0] || 'rain');
        }

        // --- WMO weather code → CONDITIONS key + exact label ------------
        const WMO = {
            0: ['sunny', 'Clear sky'], 1: ['sunny', 'Mainly clear'],
            2: ['partly-cloudy', 'Partly cloudy'],
            // 3 (overcast) resolved via cloud cover below
            // fog folds into the lightest grey; its ≡ glyph marks the hazard
            45: ['partly-cloudy', 'Fog'], 48: ['partly-cloudy', 'Rime fog'],
            51: ['light-rain', 'Light drizzle'], 53: ['light-rain', 'Drizzle'], 55: ['light-rain', 'Dense drizzle'],
            56: ['light-rain', 'Freezing drizzle'], 57: ['light-rain', 'Freezing drizzle'],
            61: ['light-rain', 'Light rain'], 63: ['moderate-rain', 'Rain'], 65: ['heavy-rain', 'Heavy rain'],
            66: ['moderate-rain', 'Freezing rain'], 67: ['heavy-rain', 'Freezing rain'],
            71: ['snow', 'Light snow'], 73: ['snow', 'Snow'], 75: ['snow', 'Heavy snow'], 77: ['snow', 'Snow grains'],
            80: ['light-rain', 'Light showers'], 81: ['moderate-rain', 'Showers'], 82: ['heavy-rain', 'Heavy showers'],
            85: ['snow', 'Snow showers'], 86: ['snow', 'Snow showers'],
            95: ['thunderstorm', 'Thunderstorm'], 96: ['thunderstorm', 'Thunderstorm, hail'], 99: ['thunderstorm', 'Thunderstorm, hail']
        };
        const conditionFor = (code, clouds) => {
            if (code === 3) return clouds > 90
                ? { condition: 'overcast', description: 'Overcast', glyph: '' }
                : { condition: 'cloudy', description: 'Cloudy', glyph: '' };
            const [condition, description] = WMO[code] || ['cloudy', `Unknown (${code})`];
            return { condition, description, glyph: HAZARD_GLYPH[code] || '' };
        };

        // --- City-local date/time via the forecast's IANA timezone -----
        const cityNow = () => {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: state.tz, year: 'numeric', month: '2-digit',
                day: '2-digit', hour: '2-digit', hourCycle: 'h23'
            }).formatToParts(new Date());
            const get = type => parts.find(p => p.type === type).value;
            return { date: `${get('year')}-${get('month')}-${get('day')}`, hour: +get('hour') };
        };
        const DAY_ABBR = ['SU', 'M', 'T', 'W', 'TH', 'F', 'S'];
        const weekdayOf = dateStr => DAY_ABBR[new Date(dateStr + 'T00:00:00Z').getUTCDay()];
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const dateLabel = dateStr => {
            const d = new Date(dateStr + 'T00:00:00Z');
            return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
        };

        // --- UI state ---------------------------------------------------
        // DR-7: the freshness line under the grid (#status) is the app's one
        // place for all app-level state. It has two layers. The *resting* layer
        // (updateStatus) is its home state: model run + next update, or offline,
        // outdated, deep-stale, or no-data. The *transient* layer briefly
        // overlays it (a copy confirmation, a geolocation error, "Back online")
        // and then clears back down on its own via one shared timer, so a
        // "copied" message never sits stranded. Every user-visible message goes
        // through here: no alert, toast, or second banner anywhere.
        let statusTimer = null;
        const setStatus = (text, cls = '', opts = {}) => {
            const el = $('status');
            // Any new status cancels a pending auto-clear first, so transient
            // messages never stack or clear early.
            if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
            el.textContent = text;
            el.className = `status ${cls}`.trim();
            // It's a button now, so always name the refresh action; updateStatus
            // overrides with a richer description for the run line.
            el.setAttribute('aria-label', text ? `${text}. Refresh forecast` : 'Refresh forecast');
            // Transient messages (opts.transient) carry a ~2s life, after which
            // the line reverts to whatever the resting layer now says. Resting
            // states are set without the flag and persist until their own
            // condition changes.
            if (opts.transient) {
                statusTimer = setTimeout(() => { statusTimer = null; updateStatus(); }, STATUS_TRANSIENT_MS);
            }
        };

        // Shared time-axis labels (real grid and skeleton alike).
        // (i + 0.5) * band% = vertical middle of hour band i, so each label
