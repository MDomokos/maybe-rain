        const LS_FAVORITES = 'mr-favorites'; // explicit ★ favorites (capped, user-curated)
        const LS_META = 'mr-model-meta';     // cached global model-run metadata (run time + cadence)
        const LS_META_LOCAL = 'mr-model-meta-local'; // cached regional model meta, keyed by model slug
        const LS_VERSION = 'mr-version';     // build id last seen on this device (drives the post-update note)
        // The running build's id. build.mjs swaps __APP_VERSION__ for sw.js's
        // CACHE_NAME at publish, so the version lives in one place. An unbuilt dev
        // copy keeps the literal token, so the post-update note just never fires.
        const APP_VERSION = '__APP_VERSION__';
        const MAX_CITIES = 12;   // cap on recent cities (MRU-evicted); favorites are separate
        const MAX_FAVORITES = 9; // cap on ★ favorites (user must unfavorite to add more)
        // ⌘ on Apple platforms, Ctrl elsewhere, for the shortcut hint label.
        const MOD = /mac|iphone|ipad/i.test(navigator.platform || navigator.userAgent) ? '⌘' : 'Ctrl+';

        // --- Preferences (the app's only menu) ---------------------------
        // settings + view are initialised below, after loadJSON is defined.
        let settings, view;

        // --- The reveal windows (DR-29) ----------------------------------
        // The grid frame never changes size. Both reveals slide a fixed window
        // over more data instead of growing the grid: the viewport is already
        // full at 7x16, so more rows or columns could only come out of block
        // size, and shrinking blocks to fit a temporary look degrades the
        // resting glance to pay for it. A block therefore always holds exactly
        // one hour, never a blend of two.
        const DAY_SPAN = 7;      // columns in the frame, at rest and revealed
        const DAY_OFF_MAX = 7;   // drawer's hard cap: leftmost column = lead day 7,
                                 // so the rightmost is lead day 13, the 14th day
        // The fetch horizon is derived from the cap rather than set beside it, so
        // the two can never drift: everything the drawer can reach, plus the
        // rollover spare the app has always carried (at local midnight the past
        // day drops out and the spare slides in, so the window stays full without
        // waiting on the network).
        const FORECAST_DAYS = DAY_SPAN + DAY_OFF_MAX + 1; // 15
        const HOUR_SPAN = HOUR_END - HOUR_START + 1; // 16 slots
        // Both offsets are transient view state, never persisted: the app always
        // opens on the default week and the default hours (principle 2).
        let dayOff = 0;   // lead day of the leftmost column; latched by the drawer
        let hourOff = 0;  // whole hours the hour window has slid; springs back

        // How far the drawer may reach right now. Capped by the data actually in
        // hand as well as by DAY_OFF_MAX, so a short cached payload can never be
        // stepped into columns that do not exist (principle 4).
        const maxDayOff = () => Math.max(0, Math.min(DAY_OFF_MAX, state.data.length - DAY_SPAN));
        // Hour peek travel, in whole hours, either side of the default window.
        // Clamped so the window can never leave the real day: earliest slot
        // 00:00, latest 23:00. In 24-hour mode the window already fills the day,
        // so the range collapses to zero and the peek has nothing to reveal.
        const hourPeekRange = () => settings.allHours
            ? { min: 0, max: 0 } : { min: -HOUR_START, max: 24 - HOUR_SPAN - HOUR_START };

        const hourRange = () => {
            if (settings.allHours) return { start: 0, end: 23 };
            const { min, max } = hourPeekRange();
            const s = HOUR_START + Math.max(min, Math.min(max, hourOff));
            return { start: s, end: s + HOUR_SPAN - 1 };
        };

        // The window rendered: 7 columns from the current day offset, across the
        // current hour window. Kept as a function so its callers still read
        // { start, end, days } unchanged; `off` is the day the frame starts on.
        const visibleWindow = () => {
            const { start, end } = hourRange();
            return { start, end, days: DAY_SPAN, off: Math.min(dayOff, maxDayOff()) };
        };

        // The drawer's ⌂ chip is the only thing either reveal ever draws, and it
        // exists only while the drawer is away from today. At rest both reveals
        // are invisible and the screen is unchanged.
        let revealTimer = null;
        const renderDayHome = () => {
            const chip = $('dayHome');
            chip.hidden = !dayOff;
            chip.textContent = dayOff ? '⌂' : '';
        };
        // Send both windows home without repainting, for callers that are about
        // to repaint anyway (a view or city change, which own the whole grid).
        // Neither offset is ever persisted, so the app always opens on the
        // default week and the default hours (principle 2).
        const resetReveal = () => {
            clearTimeout(revealTimer);
            dayOff = 0; hourOff = 0;
            renderDayHome();
        };
        const applyBand = () => {
            const w = visibleWindow();
            document.documentElement.style.setProperty('--band', `${100 / (w.end - w.start + 1)}%`);
        };

        const displayTemp = c => settings.unit === 'F' ? Math.round(c * 9 / 5 + 32) : c;
        // Wind is stored in km/h (Open-Meteo default); converted at render.
        const WIND_UNITS = { kmh: ['km/h', 1], mph: ['mph', 0.621371], kn: ['kn', 0.539957] };
        const displayWind = k => Math.round(k * WIND_UNITS[settings.windUnit][1]);
        const windUnitLabel = () => WIND_UNITS[settings.windUnit][0];
        const hourLabel = h => settings.clock === '12'
            ? `${((h + 11) % 12) + 1}${h < 12 ? 'am' : 'pm'}`
            : `${h}:00`;
        // Minute-exact variant for sunrise/sunset.
        const timeLabel = (h, m) => settings.clock === '12'
            ? `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`
            : `${h}:${String(m).padStart(2, '0')}`;

        // --- Temperature & wind view scales -------------------------------
        // One piecewise-linear interpolator over [value, rgb] stops.
        const scaleRGB = (stops, t) => {
            if (t <= stops[0][0]) return stops[0][1];
            for (let i = 1; i < stops.length; i++) {
                const [t1, c1] = stops[i - 1], [t2, c2] = stops[i];
                if (t <= t2) {
                    const f = (t - t1) / (t2 - t1);
                    return c1.map((c, j) => Math.round(c + (c2[j] - c) * f));
                }
            }
            return stops[stops.length - 1][1];
        };
        // DR-17 temperature view: colour by apparent temperature (feels-like,
        // Open-Meteo's apparent_temperature) into eight absolute human comfort
        // bands, the same edges in every city, so the grid orients across cities
        // and weeks instead of self-scaling. Comfort-diverging palette: palest at
        // Comfortable, deepening both ways so darkness reads as distance from
        // comfortable. Each band carries one prep cue. Danger stays an escalation
        // glyph (dangerGlyph), not a band, so a normal Minneapolis winter or
        // Florida summer never cries wolf. Edges, colours and cues are locked in
        // Weather PWA/Maybe Rain Temperature.md (5y ERA5, four cities).
        const TEMP_BANDS = [
            { max: -8,       rgb: [58, 45, 107],   name: 'Bitter',   cue: 'bundle up - gloves and hat, skip the run' },
            { max: 0,        rgb: [70, 110, 196],  name: 'Freezing', cue: 'below freezing - coat, watch for ice' },
            { max: 8,        rgb: [110, 160, 220], name: 'Cold',     cue: 'warm coat; layers to bike' },
            { max: 13,       rgb: [176, 205, 232], name: 'Cool',     cue: 'light jacket or windbreaker' },
            { max: 22,       rgb: [234, 231, 220], name: 'Comfort',  cue: 'wear whatever - great for a walk or ride' },
            { max: 27,       rgb: [240, 199, 117], name: 'Warm',     cue: 't-shirt and shorts' },
            { max: 32,       rgb: [232, 150, 63],  name: 'Hot',      cue: 'hydrate, shade, you will sweat' },
            { max: Infinity, rgb: [194, 59, 50],   name: 'Very hot', cue: 'extra water, limit midday sun' }
        ];
        // Band for a feels-like °C (lower edge inclusive: -8 is Freezing, 0 is
        // Cold). scaleRGB stays for the wind view; temperature no longer ramps.
        const bandIndex = feels => {
            const i = TEMP_BANDS.findIndex(b => feels < b.max);
            return i < 0 ? TEMP_BANDS.length - 1 : i;
        };
        // Snap to the band colour, then shade within the band toward the
        // neighbouring band by TEMP_BLEND of the gap (mockup mode 5): the cooler
        // half deepens, the warmer half lightens, so the daily trend reads while
        // the band step stays visible. 0 would be pure discrete, 0.5 continuous;
        // 0.30 keeps band identity with enough gradient to see the swing. The
        // outer half of the two end bands keeps deepening toward black, so a -25 °
        // cell already looks worse than a -10 ° one before the glyph confirms it.
        const TEMP_BLEND = 0.30;
        const bandRGB = feels => {
            const i = bandIndex(feels), b = TEMP_BANDS[i];
            const loRaw = i === 0 ? -Infinity : TEMP_BANDS[i - 1].max;
            const lo = isFinite(loRaw) ? loRaw : b.max - 12;
            const hi = isFinite(b.max) ? b.max : lo + 12;
            const p = Math.max(0, Math.min(1, (feels - lo) / (hi - lo)));
            const s = (p - 0.5) * 2; // -1 at the cold edge, +1 at the warm edge
            const target = s < 0
                ? (i > 0 ? TEMP_BANDS[i - 1].rgb : [0, 0, 0])
                : (i < TEMP_BANDS.length - 1 ? TEMP_BANDS[i + 1].rgb : [0, 0, 0]);
            const f = Math.abs(s) * TEMP_BLEND;
            return b.rgb.map((c, j) => Math.round(c + (target[j] - c) * f));
        };
        // DR-17: danger is an escalation glyph, not a band (rain-parity with the
        // heavy-rain warning). On feels-like: frostbite at <= -20 (about 430 h/yr
        // in Minneapolis, near-never elsewhere), heat-stress at >= 38 (the real
        // heat-index line; ERA5 smooths the tail, live models fire it). The
        // first-pass -10 / 32 edges cried wolf on the record and were dropped.
        const TEMP_DANGER_COLD = -20, TEMP_DANGER_HOT = 38;
        // DR-17 possible-frost buffer: frost and black ice form at reported air
        // temps a couple of degrees above zero (surfaces radiate below the 2 m
        // air on clear calm nights; advisories fire there, not at 0 °), and the
        // buffer also honours the forecast's own uncertainty. Solid line at true
        // 0 °, dashed possible-frost at the +2 ° edge, so the marker only appears
        // below +2 °.
        const FROST_POSSIBLE = 2;
        // Wind: calm grey → breeze teal → fresh green → strong gold → gale
        // red, anchored in km/h (≈ Beaufort 0 / 3 / 5 / 7 / 9+).
        const WIND_STOPS = [[0, [58, 58, 58]], [12, [72, 143, 138]], [29, [80, 200, 120]], [50, [255, 215, 0]], [75, [229, 72, 77]]];
        const windRGB = v => scaleRGB(WIND_STOPS, v);
        // Open-Meteo reports the bearing the wind comes from; the wind-view
        // arrow (MR_ICON.wind, base points up) is rotated to point where it
        // blows to: wind from N (octant 0) points down, so rotation is
        // octant × 45° + 180°. 8 octants.
        const COMPASS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
        const windOctant = d => Math.round(d / 45) % 8;

        // --- Conditions: defined in one place -----------------------------
        // Ordered scales: gold sun; 3-step grey for cloud cover (fog folds
        // into the lightest grey, marked by its ≡ glyph); 3-step blue for
        // rain intensity; violet storm; white snow. Grid colors, legend
        // strip, and tooltip labels all derive from this array; condition
        // data is defined only here, not in CSS or HTML.
        const CONDITIONS = [
            { key: 'sunny',         color: '#FFD700', label: 'Sunny',         group: 'sun' },
            { key: 'partly-cloudy', color: '#B0B0B0', label: 'Partly cloudy', group: 'cloud' },
            { key: 'cloudy',        color: '#757575', label: 'Cloudy',        group: 'cloud' },
            { key: 'overcast',      color: '#454545', label: 'Overcast',      group: 'cloud' },
            { key: 'light-rain',    color: '#87CEEB', label: 'Light rain',    group: 'rain' },
            { key: 'moderate-rain', color: '#4169E1', label: 'Rain',          group: 'rain' },
            { key: 'heavy-rain',    color: '#191970', label: 'Heavy rain',    group: 'rain' },
            { key: 'thunderstorm',  color: '#7B2FBE', label: 'Storm',         group: 'storm' },
            { key: 'snow',          color: '#F0F8FF', label: 'Snow',          group: 'snow' }
        ];
        const COND = Object.fromEntries(CONDITIONS.map(c => [c.key, c]));
        const PRECIP = new Set(['rain', 'storm', 'snow']); // probability fade applies

        // --- Default grid palette: the sky, by WMO code (Maybe Rain Sky
        // Palette Explorer) --------------------------------------------------
        // Every block is a picture of the sky. Each of the 28 WMO codes maps
        // to one of eight sky levels, each with a fixed day colour and a
        // warm-neutral night colour: night dims and desaturates the sky rather
        // than recolouring it, so no night is blue and blue reads only as rain.
        // Three modifiers then run per hour:
        //   1. rain codes get a slight blue tint, so the block reads "wet"
        //      even before the streak overlay (DR-12/DR-13) is drawn on top,
        //   2. cloud cover spreads the brightness around the swatch (clear
        //      hours lift, overcast hours ease down), so neighbouring hours
        //      read as visibly different without the grid trending dark,
        //   3. nightFactor blends each hour between its day and night colour
        //      across a twilight window, so the grid eases into night over the
        //      sunset/sunrise hour instead of flipping palette in one row.
        const SKY_DAY = {
            clear:    [255, 207,  51],
            mclear:   [230, 220, 170],
            partly:   [205, 209, 214],
            cloudy:   [163, 168, 174],
            overcast: [120, 126, 133],
            fog:      [172, 176, 180],
            storm:    [ 70,  26, 120],
            snow:     [240, 248, 255]
        };
        // A1 (warm dim): dimmed, desaturated versions of the day sky. The
        // bright end keeps a faint warmth (a clear night reads as dusk-gold at
        // rest, not blue), the greys stay neutral, and brightness falls as the
        // sky thickens. Nothing here is blue except a residual violet on storm,
        // so the blue rain tint/streaks are the only blue after dark.
        const SKY_NIGHT = {
            clear:    [ 88,  76,  54],
            mclear:   [ 80,  74,  62],
            partly:   [ 68,  70,  74],
            cloudy:   [ 58,  60,  64],
            overcast: [ 50,  52,  56],
            fog:      [ 62,  64,  68],
            storm:    [ 40,  28,  52],
            snow:     [150, 156, 168]
        };
        // WMO code → sky level. Rain / drizzle / freezing precip fall from an
        // overcast sky; ordinary showers (80/81) from a brighter broken sky;
        // violent showers (82) from overcast; snow codes take the grey they
        // fall from (see skyLevelFor, the white lattice is the snow); thunder
        // is the violet. Code 3 splits by cover (below), like DR-12. The snow
        // level below is kept for reference but the base uses the grey.
        const SKY_LEVEL = {
            0: 'clear', 1: 'mclear', 2: 'partly',
            45: 'fog', 48: 'fog',
            51: 'overcast', 53: 'overcast', 55: 'overcast',
            56: 'overcast', 57: 'overcast',
            61: 'overcast', 63: 'overcast', 65: 'overcast',
            66: 'overcast', 67: 'overcast',
            71: 'snow', 73: 'snow', 75: 'snow', 77: 'snow',
            80: 'cloudy', 81: 'cloudy', 82: 'overcast',
            85: 'snow', 86: 'snow',
            95: 'storm', 96: 'storm', 99: 'storm'
        };
        // Liquid-precip codes lean the base slightly blue; snow, storm and dry
        // skies stay untinted.
        const RAIN_CODES = new Set([51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 80, 81, 82]);
        const RAIN_TINT = [27, 45, 140];   // blue anchor for the wet-sky nudge
        const RAIN_TINT_W = 0.12;          // how far toward it (slight)
        // Cloud cover spreads each block's brightness around its swatch, so
        // neighbouring hours read as visibly different without the grid
        // trending dark: overcast eases down a little, clear lifts more.
        const CLOUD_DARKEN = 0.06;         // 100% cloud sits this far below the swatch
        const CLOUD_LIGHTEN = 0.14;        // 0% cloud sits this far above it
        // Snow codes take the grey sky the snow falls from, not a white block:
        // the white dot lattice (DR-12) is the snow, and it needs a grey base
        // to read. ~97% of snow hours are overcast (Climatology note).
        const SNOW_CODES = new Set([71, 73, 75, 77, 85, 86]);
        const skyLevelFor = (code, cloud) => {
            if (code === 3) return (cloud ?? 0) > 90 ? 'overcast' : 'cloudy';
            if (SNOW_CODES.has(code)) {
                const cl = cloud ?? 100;
                return cl > 90 ? 'overcast' : cl > 60 ? 'cloudy' : cl > 25 ? 'partly' : 'clear';
            }
            return SKY_LEVEL[code] || 'cloudy';
        };
        const mix3 = (a, b, t) => [0, 1, 2].map(i => a[i] + (b[i] - a[i]) * t);
        const clamp255 = v => Math.max(0, Math.min(255, Math.round(v)));
        const clamp01 = v => Math.max(0, Math.min(1, v));
        // A block's "nightness" for the day→night palette blend: 0 in full day,
        // 1 in full night, easing linearly across a ±TWILIGHT window either
        // side of the day's sunrise/sunset so the grid never flips palette in a
        // single row. No sun data (polar edge, missing) → treated as full day.
        const TWILIGHT = 1; // hours of half-transition each side of the event
        const nightFactor = (hour, sun) => {
            if (!sun || !sun.rise || !sun.set) return 0;
            const rise = sun.rise.h + sun.rise.m / 60;
            const set = sun.set.h + sun.set.m / 60;
            const evening = clamp01((hour - (set - TWILIGHT)) / (2 * TWILIGHT));  // 0→1 across sunset
            const morning = clamp01(((rise + TWILIGHT) - hour) / (2 * TWILIGHT)); // 1→0 across sunrise
            return Math.max(evening, morning);
        };
        // The default-view colour for one hour: sky level → tint → cloud dim.
        // nf (0..1) blends the level's day and night colour, so twilight hours
        // sit part-way between instead of snapping over at the sunset row.
        const conditionRGB = (h, nf) => {
            const level = skyLevelFor(h.code, h.cloud);
            let c = mix3(SKY_DAY[level], SKY_NIGHT[level], nf);
            if (RAIN_CODES.has(h.code)) c = mix3(c, RAIN_TINT, RAIN_TINT_W);
            const cl = h.cloud;
            const f = cl == null ? 1
                : 1 + CLOUD_LIGHTEN * (1 - cl / 100) - CLOUD_DARKEN * (cl / 100);
            return c.map(v => clamp255(v * f));
        };

        // Hazard markers: redundant non-color icons for hazards only, never
        // ordinary data. Vocabulary of five (DR-10): storm (lightning, incl.
        // hail), fog, and freeze (freezing rain/drizzle) are weather-coded
        // below; heat (extreme heat) and uv (very-high UV) are threshold
        // hazards applied at render time by value, not code. Every applicable
        // one shows, packed into the block corner (rarely more than two).
        // Values are MR_ICON keys; the render turns them into inline SVGs.
        const HAZARD_GLYPH = {
            95: 'storm', 96: 'storm', 99: 'storm',            // thunderstorm / hail
            45: 'fog', 48: 'fog',                             // fog, visibility hazard
            56: 'freeze', 57: 'freeze', 66: 'freeze', 67: 'freeze' // freezing precipitation
        };
        // A legend cell carries an icon only when every code mapping to it has
        // the same one (storm on the thunderstorm cell); exceptional hazards
        // (fog, freezing rain) mark blocks, not legend cells. Returns the
        // shared MR_ICON key, or ''.
        const glyphFor = key => {
            const glyphs = Object.entries(WMO)
                .filter(([, [k]]) => k === key)
                .map(([code]) => HAZARD_GLYPH[code] || '');
            return glyphs.length && glyphs.every(g => g && g === glyphs[0]) ? glyphs[0] : '';
        };

        // Blocks/legend cells get an inline background + a black or white
        // glyph color picked by luminance.
        const hexRGB = hex => {
            const n = parseInt(hex.slice(1), 16);
            return [n >> 16, (n >> 8) & 255, n & 255];
        };
        const textOn = rgb =>
            (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255 > 0.55 ? '#000' : '#fff';

        // --- Rain probability fade ---------------------------------------
        // Precipitation blocks fade toward a dark navy (not black) as the
        // probability drops, so a 30%-chance shower stays clearly blue and
        // is not mistaken for the cloudy greys. Solid hue = certain rain.
        const NAVY = [13, 32, 77];
        const fadeRGB = (hex, pop) => {
            const w = 0.35 + 0.65 * Math.max(0, Math.min(100, pop)) / 100;
            return hexRGB(hex).map((c, i) => Math.round(NAVY[i] + (c - NAVY[i]) * w));
        };

        // --- Rain view: sky base + rain-streak overlay (DR-12/DR-13/DR-14) --
        // The block colour is the sky (conditionRGB above: the WMO sky palette,
        // rain-tinted, cloud-spread, night after local sunset), and rain lives
        // entirely in a streak overlay drawn on top. Chance = left-to-right
        // fill extent (nothing below 8%); intensity = one density/weight ramp
        // (gamma 0.4, capped at 8 mm) under texture bands: below 0.3 mm a faint
        // trace tick when the chance clears 8% (a likely light sprinkle the
        // amount misses, since chance is the ensemble and amount the
        // deterministic run), then ticks to 1, broken runs to 2, solid above;
        // line colour = a luminance-tuned blue (DR-13), so "blue = rain" reads.
        // No base escalation (owner call): heavy rain saturates the density and
        // adds a warning mark above 20 mm, and a genuine storm is already the
        // violet by weather code, so the base holds the sky. Lines lean with
        // the wind: angle = 55deg x clamp(E-W wind component / 40 km/h),
        // calibrated on 5y wet-hour data (p50 ~11deg, p90 ~21-28deg, saturation
        // only at 5-year extremes). The frozen family: snow = constant white
        // dot lattice from snowfall cm/h (no floor, cap 2 cm/h, half wind lean)
        // on the cloud-derived grey; lines + lattice together on a mixed hour
        // IS sleet; hail (WMO 96/99, category only) = sparse open rings, full
        // width. Fog and freezing rain stay corner glyphs; uncertainty hatch is
        // earmarked and owns no texture.
        // Config locked 2026-07-24 (Maybe Rain Precipitation + Climatology).
        const LN = { sp0: 15, sp1: 4.7, sw0: 0.85, sw1: 2.6, gamma: 0.4, cap: 8,
                     floor: 0.3, b1: 1, tlen: 3.7, tgap: 5.1, b2: 2, blen: 14, bgap: 6,
                     shade: 0.5, alpha: 0.6, popFloor: 8, warn: 20,
                     traceSp: 16, traceLen: 2.5, traceGap: 7, traceSw: 0.7, traceAlpha: 0.55,
                     maxAngle: 55, windSat: 40,
                     snowCap: 2 }; // cm/h; the 5y Budapest max (Climatology note)
        const lnLum = ([r, g, b]) => 0.299 * r + 0.587 * g + 0.114 * b;
        const lnMix = (a, b, t) => [0, 1, 2].map(i => Math.round(a[i] + (b[i] - a[i]) * t));
        // Hail rings borrow a neutral adaptive shade of the base (frozen, not
        // rain, so not blue): darken a bright base, lighten a dark one.
        const lnShade = b => lnLum(b) > 135 ? lnMix(b, [0, 0, 0], LN.shade) : lnMix(b, [255, 255, 255], LN.shade);
        // DR-13: rain lines are blue, contrast-tuned to the background by
        // luminance band. Deep steel-blue on light skies (gold, the light
        // greys), pale steel-blue on the dark ones (dark greys, storm violet,
        // the night palette), so the streaks stay legible everywhere and read
        // as "blue = rain". Line colour carries no data; density does.
        const LN_BLUE_HI = [20, 54, 110];   // deep, on bright bases (lum > 135)
        const LN_BLUE_LO = [206, 228, 247]; // pale, on dark bases
        const lnBlue = base => lnLum(base) > 135 ? LN_BLUE_HI : LN_BLUE_LO;
        // Wind lean: signed E-W component of travel (wind blows toward
        // dir+180), linear to 55deg at a 40 km/h component. Positive SVG
        // rotation = drifting east. No wind data = vertical fall.
        const windLean = h => {
            if (h.wind == null || h.windDir == null) return 0;
            const u = h.wind * Math.sin((h.windDir + 180) * Math.PI / 180);
            return LN.maxAngle * Math.max(-1, Math.min(1, u / LN.windSat));
        };
        let lnId = 0; // unique per-render pattern ids
        // The streak overlay for one block, or ''. The wrapper span is the
        // chance channel (width = pop%, anchored left, bare front edge); the
        // SVG pattern is the intensity channel. Chance unknown = full width
        // (the amount is a real forecast; the chance channel is just absent).
        const rainLinesSVG = (h, base) => {
            // Lines draw from the liquid part only (rain + showers); the
            // white lattice carries the frozen part. Old cached payloads
            // lack the split: fall back to total mm, except on snow-coded
            // hours where drawing rain lines would misrepresent.
            const liquid = h.liquid ?? (COND[h.condition].group === 'snow' ? null : h.mm);
            if (liquid == null) return '';
            const c = lnBlue(base); // DR-13: blue, tuned to the base luminance
            const ang = windLean(h).toFixed(1);
            const id = 'mrln' + (lnId++);
            let pat, wp;
            if (liquid < LN.floor) {
                // Trace tier: the amount is below the 0.3 mm floor (often ~0),
                // but the chance is real. Amount is the deterministic run;
                // chance is the ensemble (P > 0.1 mm), so a high chance with
                // ~0 mm is a likely light sprinkle the amount misses (Open-
                // Meteo). Draw the chance as the fill, with the faintest,
                // sparsest tick, below the drizzle band, so it stops vanishing.
                // Chance-driven: it needs a real pop to fire, and it is liquid
                // rain only, so a snow-coded hour draws nothing here (its
                // precipitation is the white lattice, not a rain trace).
                if (COND[h.condition].group === 'snow') return '';
                if (h.pop == null || h.pop < LN.popFloor) return '';
                const col = `rgba(${c[0]},${c[1]},${c[2]},${LN.traceAlpha})`;
                const per = (LN.traceLen + LN.traceGap).toFixed(2);
                const x = (LN.traceSp / 2).toFixed(2);
                pat = `<pattern id="${id}" width="${LN.traceSp.toFixed(2)}" height="${per}" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><line x1="${x}" y1="-${per}" x2="${x}" y2="${(2 * (LN.traceLen + LN.traceGap)).toFixed(2)}" stroke="${col}" stroke-width="${LN.traceSw}" stroke-dasharray="${LN.traceLen} ${LN.traceGap}"/></pattern>`;
                wp = Math.min(100, h.pop);
            } else {
                if (h.pop != null && h.pop < LN.popFloor) return '';
                const t = Math.pow(Math.min(liquid, LN.cap) / LN.cap, LN.gamma);
                const sp = LN.sp0 + (LN.sp1 - LN.sp0) * t;
                const sw = LN.sw0 + (LN.sw1 - LN.sw0) * t;
                const col = `rgba(${c[0]},${c[1]},${c[2]},${LN.alpha})`;
                let dl = 0, dg = 0; // dash pattern: ticks, then broken runs, then solid
                if (liquid < LN.b1) { dl = LN.tlen; dg = LN.tgap; }
                else if (liquid < LN.b2) { dl = LN.blen; dg = LN.bgap; }
                if (dl > 0) { // two columns, dash phase staggered so breaks never align
                    const per = dl + dg;
                    const line = (x, off) =>
                        `<line x1="${x.toFixed(2)}" y1="${(-per).toFixed(2)}" x2="${x.toFixed(2)}" y2="${(2 * per).toFixed(2)}" stroke="${col}" stroke-width="${sw.toFixed(2)}" stroke-dasharray="${dl} ${dg}" stroke-dashoffset="${off.toFixed(2)}"/>`;
                    pat = `<pattern id="${id}" width="${(sp * 2).toFixed(2)}" height="${per.toFixed(2)}" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})">${line(sp / 2, 0)}${line(sp * 1.5, per / 2)}</pattern>`;
                } else {
                    pat = `<pattern id="${id}" width="${sp.toFixed(2)}" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})"><line x1="${(sp / 2).toFixed(2)}" y1="-2" x2="${(sp / 2).toFixed(2)}" y2="16" stroke="${col}" stroke-width="${sw.toFixed(2)}"/></pattern>`;
                }
                wp = h.pop == null ? 100 : Math.min(100, h.pop);
            }
            return `<span class="rain-ov" style="width:${wp}%"><svg xmlns="http://www.w3.org/2000/svg"><defs>${pat}</defs><rect width="100%" height="100%" fill="url(#${id})"/></svg></span>`;
        };
        // Snow: a staggered lattice of constant-white dots (snow is white,
        // and it lands on the overcast grey in ~97% of snow hours, per the
        // Climatology note). No amount floor: any snowfall draws. Density
        // and dot size ramp on cm/h (same gamma, cap 2 cm/h = the 5y max);
        // fill = chance as for rain; wind lean at half strength (flakes
        // drift, lines fall). A rainy-and-snowy hour stacks both overlays:
        // that IS the sleet encoding, no extra vocabulary.
        const snowLatticeSVG = h => {
            if (h.snow == null || h.snow <= 0) return '';
            if (h.pop != null && h.pop < LN.popFloor) return '';
            const t = Math.pow(Math.min(h.snow, LN.snowCap) / LN.snowCap, LN.gamma);
            const sp = 14 - (14 - 5.2) * t, r = 0.8 + 0.8 * t;
            const ang = (windLean(h) * 0.5).toFixed(1);
            const id = 'mrsn' + (lnId++);
            const dot = (cx, cy) => `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${r.toFixed(2)}" fill="rgba(255,255,255,0.92)"/>`;
            const pat = `<pattern id="${id}" width="${sp.toFixed(2)}" height="${(sp * 2).toFixed(2)}" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})">${dot(sp / 2, sp / 2)}${dot(sp * 0.05, sp * 1.5)}</pattern>`;
            const wp = h.pop == null ? 100 : Math.min(100, h.pop);
            return `<span class="rain-ov" style="width:${wp}%"><svg xmlns="http://www.w3.org/2000/svg"><defs>${pat}</defs><rect width="100%" height="100%" fill="url(#${id})"/></svg></span>`;
        };
        // Hail (WMO 96/99): sparse open rings, full width. A category with
        // no quantity anywhere in Open-Meteo, so a fixed texture, never a
        // ramp. Rings (open, larger, adaptive shade) vs snow dots (filled,
        // small, white) keeps the frozen family related but unconfusable;
        // storm violet and lightning ride the same block.
        const HAIL_CODES = new Set([96, 99]);
        const hailRingsSVG = (h, base) => {
            if (!HAIL_CODES.has(h.code)) return '';
            const c = lnShade(base);
            const id = 'mrhl' + (lnId++);
            const ring = (cx, cy) => `<circle cx="${cx}" cy="${cy}" r="2.2" fill="none" stroke="rgba(${c[0]},${c[1]},${c[2]},0.9)" stroke-width="0.9"/>`;
            const pat = `<pattern id="${id}" width="18" height="18" patternUnits="userSpaceOnUse">${ring(4.5, 4.5)}${ring(13.5, 13.5)}</pattern>`;
            return `<span class="rain-ov"><svg xmlns="http://www.w3.org/2000/svg"><defs>${pat}</defs><rect width="100%" height="100%" fill="url(#${id})"/></svg></span>`;
        };

        // --- Sky events: moon phase + notable lunar eclipses -------------
        // Marked as a bare glyph on each day's 21:00 block (bottom-left, so
        // it never collides with a bottom-right hazard). Text glyphs match
        // the hazard vocabulary; custom SVG icons are a planned follow-up.
        //
        // Phase instants come from Meeus' "Astronomical Algorithms" ch.49
        // (principal periodic terms only): a mean-synodic model drifts up to
        // a day by the 2020s, but this stays within minutes, so a phase
        // always lands on the right night. ΔT (<2 min) and planetary terms
        // (<0.001 d) are dropped as far below a day boundary. `k` counts
        // quarter-phases from the 2000 new moon: integer = new, +.25 first
        // quarter, +.5 full, +.75 last.
        const D2R = Math.PI / 180;
        const phaseInstantMs = k => {
            const p = k - Math.floor(k);            // .00/.25/.50/.75
            const T = k / 1236.85;
            let J = 2451550.09766 + 29.530588861 * k
                + 0.00015437 * T*T - 0.000000150 * T*T*T + 0.00000000073 * T*T*T*T;
            const M  = (2.5534   + 29.10535670 * k - 0.0000014 * T*T - 0.00000011 * T*T*T) * D2R;
            const Mp = (201.5643 + 385.81693528 * k + 0.0107582 * T*T + 0.00001238 * T*T*T - 0.000000058 * T*T*T*T) * D2R;
            const F  = (160.7108 + 390.67050284 * k - 0.0016118 * T*T - 0.00000227 * T*T*T + 0.000000011 * T*T*T*T) * D2R;
            const Om = (124.7746 - 1.56375588 * k + 0.0020672 * T*T + 0.00000215 * T*T*T) * D2R;
            const E = 1 - 0.002516 * T - 0.0000074 * T*T;
            const s = Math.sin;
            if (p < 1e-6 || Math.abs(p - 0.5) < 1e-6) { // new / full share the term set
                J += -0.40720*s(Mp) + 0.17241*E*s(M) + 0.01608*s(2*Mp) + 0.01039*s(2*F)
                    + 0.00739*E*s(Mp-M) - 0.00514*E*s(Mp+M) + 0.00208*E*E*s(2*M)
                    - 0.00111*s(Mp-2*F) - 0.00057*s(Mp+2*F) + 0.00056*E*s(2*Mp+M)
                    - 0.00042*s(3*Mp) + 0.00042*E*s(M+2*F) + 0.00038*E*s(M-2*F)
                    - 0.00024*E*s(2*Mp-M) - 0.00017*s(Om) - 0.00007*s(Mp+2*M)
                    + 0.00004*s(2*Mp-2*F) + 0.00004*s(3*M) + 0.00003*s(Mp+M-2*F)
                    + 0.00003*s(2*Mp+2*F) - 0.00003*s(Mp+M+2*F) + 0.00003*s(Mp-M+2*F)
                    - 0.00002*s(Mp-M-2*F) - 0.00002*s(3*Mp+M) + 0.00002*s(4*Mp);
            } else {                                  // first / last quarter
                J += -0.62801*s(Mp) + 0.17172*E*s(M) - 0.01183*E*s(Mp+M) + 0.00862*s(2*Mp)
                    + 0.00804*s(2*F) + 0.00454*E*s(Mp-M) + 0.00204*E*E*s(2*M)
                    - 0.00180*s(Mp-2*F) - 0.00070*s(Mp+2*F) - 0.00040*s(3*Mp)
                    - 0.00034*E*s(2*Mp-M) + 0.00032*E*s(M+2*F) + 0.00032*E*s(M-2*F)
                    - 0.00028*E*E*s(Mp+2*M) + 0.00027*E*s(2*Mp+M) - 0.00017*s(Om)
                    - 0.00005*s(Mp-M-2*F) + 0.00004*s(2*Mp+2*F) - 0.00004*s(Mp+M+2*F)
                    + 0.00004*s(Mp-2*M) + 0.00003*s(Mp+M-2*F) + 0.00003*s(3*M)
                    + 0.00002*s(2*Mp-2*F) + 0.00002*s(Mp-M+2*F) - 0.00002*s(3*Mp+M);
                const W = 0.00306 - 0.00038*E*Math.cos(M) + 0.00026*Math.cos(Mp)
                    - 0.00002*Math.cos(Mp-M) + 0.00002*Math.cos(Mp+M) + 0.00002*Math.cos(2*F);
                J += p < 0.5 ? W : -W;                // first quarter +W, last quarter -W
            }
            return (J - 2440587.5) * 86400000;        // Julian Day → Unix ms (UTC)
        };

        // label rides the tooltip and aria.
        const PHASE_MARK = { 0: ['new', 'New moon'], 0.25: ['first', 'First quarter'],

        // greatest eclipse in UTC. A 7-day forecast only ever reaches a few.
        const LUNAR_ECLIPSES = [
            { t: Date.UTC(2026, 2, 3, 11, 34),   kind: 'total'   },
            { t: Date.UTC(2026, 7, 28, 4, 14),   kind: 'partial' },
            { t: Date.UTC(2028, 0, 12, 4, 14),   kind: 'partial' },
            { t: Date.UTC(2028, 6, 6, 18, 20),   kind: 'partial' },

        // day becomes a UTC window via the forecast's utc offset, so the mark
        // lands on the right calendar day for the city. An eclipse (always at
        // full moon) outranks the plain full-moon mark.
        const skyEventFor = date => {
            const dayStart = Date.parse(date + 'T00:00:00Z') - (state.utcOffset || 0) * 1000;
            const dayEnd = dayStart + 86400000;
            const ecl = LUNAR_ECLIPSES.find(e => e.t >= dayStart && e.t < dayEnd);
            if (ecl) return { glyph: 'lunar', label: `Lunar eclipse (${ecl.kind})` };
            // scan the quarter-phases around this date for one landing today
            const approxK = (dayStart / 86400000 / 365.25 + 1970 - 2000) * 12.3685;
            const base = Math.round(approxK);
            for (let k = base - 1; k <= base + 1; k += 0.25) {
                const t = phaseInstantMs(k);
                if (t >= dayStart && t < dayEnd) {
                    const mark = PHASE_MARK[Math.round((k - Math.floor(k)) * 4) / 4];
                    return { glyph: mark[0], label: mark[1] };
                }
            }
            return null;
        };

        // Saved favourite: the plus mark in gold with a heavier stroke.
        const MR_ICON_STAR_SAVED = "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path vector-effect=\"non-scaling-stroke\" d=\"M12 5.5V18.5\"/><path vector-effect=\"non-scaling-stroke\" d=\"M5.5 12H18.5\"/></svg>";

        let state = {
            place: DEFAULT_PLACE,
            tz: 'Pacific/Auckland', // overwritten by every forecast response
            data: [],     // [day][{hour, temp, pop, condition, description}], all real hours
            days: [],     // [{text, isToday, date}]
            sun: {},      // date → { rise: {h, m}, set: {h, m} } (city-local)
            fetchedAt: 0, // timestamp of the forecast currently displayed
            modelRun: null, // global model run: { init, interval, nextUpdate } ms, from the metadata API
            localRun: null, // regional high-res model run (or null): { init, interval, nextUpdate, slug, label }
            loading: false,
            controller: null,
            online: navigator.onLine, // tracked via online/offline events (DR-7)
            swUpdate: false, // a newer app version is waiting a reload (DR-7 CTA); only a genuine mid-session deploy, never the load-time cache catch-up
            updateNote: false, // the brief "New version" note is up (tap opens the changelog), vs the resting reload CTA

            changed: null,   // DR-6: "date|hour" → {pop|temp|wind: [was, now]} vs the previous model run
            pulsePending: false, // DR-6: the next render pulses changed cells, then consumes this
            suggestions: [] // saved cities + geocoding hits, in display order
        };

        // --- localStorage persistence ------------------------------------
        const placeKey = p => `${p.latitude.toFixed(3)},${p.longitude.toFixed(3)}`;
        const loadJSON = key => {
            try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
        };
        const saveJSON = (key, value) => {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* full/blocked: non-fatal */ }
        };

        // --- DR-6: per-place forecast cache -------------------------------
        // One entry per place, keyed by placeKey. An entry leaves the cache
        // three ways only, never by wall-clock age: superseded (a fetch
        // overwrites it), orphaned (its place leaves favorites ∪ recents ∪
        // the place on screen, so no UI path reaches it), or fully expired
        // (its last forecast hour is in the past, place-local, so nothing
        // honest can be rendered). Old-but-labeled data answers something;
        // a purged cache answers nothing.
        const forecastCacheKey = p => `${LS_FORECAST}:${placeKey(p)}`;
        const loadForecast = p => loadJSON(forecastCacheKey(p));
        // Every write stamps the horizon the payload was fetched with, so there
        // is one place to keep it honest rather than four call sites.
        const saveForecast = (p, entry) => saveJSON(forecastCacheKey(p), { ...entry, days: FORECAST_DAYS });
        // Fully expired: the payload's hourly times are place-local ISO
        // strings and it carries utc_offset_seconds, so "is the last hour in
        // the past?" is a string compare against place-local now. For a
        // 7-day payload this fires ~7 days after fetch.
        // An entry also carries the horizon it was fetched with, because that is
        // the one thing about a cached payload that can go out of date without
        // the payload itself being wrong. When the drawer's reach grows, every
        // cached entry is still perfectly good data covering a shorter span, and
        // the freshness window would otherwise hold it for another 10 minutes
        // while the drawer sat clamped at whatever the old payload happened to
        // reach. So a short horizon is not a cache miss (the entry still paints
        // instantly, principle 6) but it does force the revalidation through,
        // regardless of freshness. Recorded rather than measured from the payload
        // on purpose: measuring would re-fire every day as the payload ages past
        // its own horizon, where this fires exactly once per place, on the first
        // load after the reach changed. Entries written before this existed have
        // no `days` and read as 0, which is correct, they predate it.
        const staleHorizon = entry => (entry?.days || 0) < FORECAST_DAYS;
        const forecastExpired = entry => {
            const t = entry?.payload?.hourly?.time;
            if (!t?.length) return true;
            const offset = entry.payload.utc_offset_seconds || 0;
            const localNow = new Date(Date.now() + offset * 1000).toISOString().slice(0, 16);
            return t[t.length - 1] < localNow;
        };
        // Sweep: drop every entry that is orphaned or fully expired. The
        // keep-set includes the current place even when it is in neither
        // list (a timezone guess or favorite cycling arrives with
        // remember=false), since it is on screen and its cache serves the
        // next open. Called at startup (off the critical path) and at the
        // membership-removal points: ✕ dismiss, MRU eviction, unfavorite.
        const sweepForecasts = () => {
            const keep = new Set([...favorites, ...savedCities, state.place].map(placeKey));
            const prefix = `${LS_FORECAST}:`;
            try {
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const k = localStorage.key(i);
                    if (!k || !k.startsWith(prefix)) continue;
                    if (!keep.has(k.slice(prefix.length)) || forecastExpired(loadJSON(k))) {
                        localStorage.removeItem(k);
                    }
                }
            } catch { /* blocked storage: non-fatal */ }
        };
        // DR-6 layer 2: history is keyed by model run, not by poll. Two
        // payloads count as the same run when the hourly arrays that drive
        // the grid are identical; string equality on ~9 KB is microseconds,
        // so no hash function (principle 5: less code).
        const hourlySnapshot = p => JSON.stringify([
            p.hourly.time, p.hourly.temperature_2m, p.hourly.weather_code,
            p.hourly.precipitation_probability, p.hourly.wind_speed_10m
        ]);
        // Cells present in both payloads whose delta crosses a per-view
        // threshold, as "date|hour" → {pop|temp|wind: [was, now]}.
        const diffHourly = (oldP, newP) => {
            const o = oldP.hourly, n = newP.hourly;
            const at = new Map(o.time.map((t, i) => [t, i]));
            const moved = (a, b, min) => a != null && b != null && Math.abs(a - b) >= min;
            const out = {};
            for (let i = 0; i < n.time.length; i++) {
                const j = at.get(n.time[i]);
                if (j == null) continue;
                const d = {};
                if (moved(n.precipitation_probability?.[i], o.precipitation_probability?.[j], CHANGE_POP))
                    d.pop = [o.precipitation_probability[j], n.precipitation_probability[i]];
                if (moved(n.temperature_2m?.[i], o.temperature_2m?.[j], CHANGE_TEMP))
                    d.temp = [o.temperature_2m[j], n.temperature_2m[i]];
                if (moved(n.wind_speed_10m?.[i], o.wind_speed_10m?.[j], CHANGE_WIND))
                    d.wind = [o.wind_speed_10m[j], n.wind_speed_10m[i]];
                if (d.pop || d.temp || d.wind)
                    out[`${n.time[i].slice(0, 10)}|${+n.time[i].slice(11, 13)}`] = d;
            }
            return out;
        };
        // Was/now tooltip lines for a changed cell, in the user's units.
        const changeLines = ch => {
            if (!ch) return [];
            const lines = [];
            if (ch.pop) lines.push(`rain ${ch.pop[0]}% → ${ch.pop[1]}%`);
            if (ch.temp) lines.push(`${displayTemp(Math.round(ch.temp[0]))}° → ${displayTemp(Math.round(ch.temp[1]))}°`);
            if (ch.wind) lines.push(`wind ${displayWind(ch.wind[0])} → ${displayWind(ch.wind[1])} ${windUnitLabel()}`);
            return lines;
        };

        // One-time migration: the legacy single mr-forecast slot becomes the
        // keyed entry for its own place, then the old key goes.
        {
            const legacy = loadJSON(LS_FORECAST);
            if (legacy?.placeKey && legacy.payload) {
                saveJSON(`${LS_FORECAST}:${legacy.placeKey}`,
                    { timestamp: legacy.timestamp, payload: legacy.payload });
            }
            if (legacy) { try { localStorage.removeItem(LS_FORECAST); } catch { /* non-fatal */ } }
        }
        // heatWarn is anchored in °C; uvWarn is a UV index; ♨/☀ thresholds,
        // user-settable in the ⚙ menu because regions differ.
        const VIEWS = ['rain', 'temp', 'wind'];
        const enabledViews = () => VIEWS.filter(v => settings.views[v]);
        {
            const saved = loadJSON(LS_SETTINGS) || {};
            settings = {
                unit: 'C', clock: '24', allHours: false, heatWarn: 35, uvWarn: 8,
                windUnit: 'kmh', legend: true, sunLines: true, ...saved,
                // deep-merged so pre-wind saved settings still get defaults
                views: { rain: true, temp: true, wind: true, ...(saved.views || {}) }
            };
        }
        {
            const saved = loadJSON(LS_VIEW);
            view = VIEWS.includes(saved) && settings.views[saved]
                ? saved : (enabledViews()[0] || 'rain');
        }

        // --- WMO weather code → CONDITIONS key + exact label ------------
        const WMO = {
            0: ['sunny', 'Clear sky'], 1: ['sunny', 'Mainly clear'],
            2: ['partly-cloudy', 'Partly cloudy'],
            // 3 (overcast) resolved via cloud cover below
            // fog folds into the lightest grey; its ≡ glyph marks the hazard
            45: ['partly-cloudy', 'Fog'], 48: ['partly-cloudy', 'Rime fog'],
            51: ['light-rain', 'Light drizzle'], 53: ['light-rain', 'Drizzle'], 55: ['light-rain', 'Dense drizzle'],
            56: ['light-rain', 'Freezing drizzle'], 57: ['light-rain', 'Freezing drizzle'],
            61: ['light-rain', 'Light rain'], 63: ['moderate-rain', 'Rain'], 65: ['heavy-rain', 'Heavy rain'],
            66: ['moderate-rain', 'Freezing rain'], 67: ['heavy-rain', 'Freezing rain'],
            71: ['snow', 'Light snow'], 73: ['snow', 'Snow'], 75: ['snow', 'Heavy snow'], 77: ['snow', 'Snow grains'],
            80: ['light-rain', 'Light showers'], 81: ['moderate-rain', 'Showers'], 82: ['heavy-rain', 'Heavy showers'],
            85: ['snow', 'Snow showers'], 86: ['snow', 'Snow showers'],
            95: ['thunderstorm', 'Thunderstorm'], 96: ['thunderstorm', 'Thunderstorm, hail'], 99: ['thunderstorm', 'Thunderstorm, hail']
        };
        const conditionFor = (code, clouds) => {
            if (code === 3) return clouds > 90
                ? { condition: 'overcast', description: 'Overcast', glyph: '' }
                : { condition: 'cloudy', description: 'Cloudy', glyph: '' };
            const [condition, description] = WMO[code] || ['cloudy', `Unknown (${code})`];
            return { condition, description, glyph: HAZARD_GLYPH[code] || '' };
        };

        // --- City-local date helpers (weekday + date label) -------------
        // (cityParts / cityNow, which read the forecast timezone, live just
        // below with the shared city formatter.)
        // Weekday index (0 = Sun) for a "YYYY-MM-DD" date, read at UTC midnight
        // so the calendar day never shifts by local offset. The two label sets
        // (the grid's single letters here, the status line's 3-letter stamp
        // below) both index into it.
        const dowOf = dateStr => new Date(dateStr + 'T00:00:00Z').getUTCDay();
        const DAY_ABBR = ['SU', 'M', 'T', 'W', 'TH', 'F', 'S'];
        const weekdayOf = dateStr => DAY_ABBR[dowOf(dateStr)];
        const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const dateLabel = dateStr => {
            const d = new Date(dateStr + 'T00:00:00Z');
            return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`;
        };

        // --- UI state ---------------------------------------------------
        // DR-7: the freshness line under the grid (#status) is the app's one
        // place for all app-level state. It has two layers. The *resting* layer
        // (updateStatus) is its home state: model run + next update, or offline,
        // outdated, deep-stale, or no-data. The *transient* layer briefly
        // overlays it (a copy confirmation, a geolocation error, "Back online")
        // and then clears back down on its own via one shared timer, so a
        // "copied" message never sits stranded. Every user-visible message goes
        // through here: no alert, toast, or second banner anywhere.
        let statusTimer = null;
        // Separate from statusTimer: the post-update note re-shows itself on every
        // repaint inside this window (so a fetch/paint can't clobber it), then
        // clears. A shared transient timer can't express "re-show while active".
        let whatsNewTimer = null;
        const setStatus = (text, cls = '', opts = {}) => {
            const el = $('status');
            // Any new status cancels a pending auto-clear first, so transient
            // messages never stack or clear early.
            if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
            // A leading "↻ " marks the refresh/update CTA: draw it as the
            // refresh icon, then the (escaped) label. Every other message is
            // plain text via textContent, so no markup can slip in.
            const cta = text.startsWith('↻ ');
            const label = cta ? text.slice(2) : text;
            if (cta) el.innerHTML = `<span class="status-icon">${MR_ICON.refresh}</span>${esc(label)}`;
            else el.textContent = text;
            el.className = `status ${cls}`.trim();
            // It's a button now, so always name the refresh action; updateStatus
            // overrides with a richer description for the run line.
            el.setAttribute('aria-label', label ? `${label}. Refresh forecast` : 'Refresh forecast');
            // Transient messages (opts.transient) carry a ~2s life, after which
            // the line reverts to whatever the resting layer now says. Resting
            // states are set without the flag and persist until their own
            // condition changes.
            if (opts.transient) {
                statusTimer = setTimeout(() => { statusTimer = null; updateStatus(); }, STATUS_TRANSIENT_MS);
            }
        };

        // Shared time-axis labels (real grid and skeleton alike).
        // (i + 0.5) * band% = vertical middle of hour band i, so each label
        // sits level with its row of blocks. Every hour is labelled.
        // Side "now" indicator: when today's column and the current
        // hour are both on screen, that hour's label becomes a gold marker
        // with the current temp; no temp data, arrow only (never a guess).
        const renderTimes = () => {
            const { start, end, days, off } = visibleWindow();
            const rows = end - start + 1;
            const band = 100 / rows;
            const step = 1;
            const now = cityNow().hour;
            const ti = state.days.findIndex(d => d.isToday);
            // Today has to be inside the *shown* columns as well as the shown
            // hours: with the day drawer open past today, or the hour window
            // peeked away from the current hour, there is no now to mark.
            const hasNow = ti >= off && ti < off + days && now >= start && now <= end;
            // Separator lines run above every labeled row except the first
            // (that boundary is the grid's own top edge, left bare) so the
            // grid's top and bottom stay free of lines.
            let firstLabel = true;
            $('times').innerHTML = Array(rows).fill().map((_, i) => {
                const h = start + i;
                if (hasNow && h === now) {
                    // Current hour: the label becomes the exact current time to the
                    // minute (white bold). The white bar on today's current block
                    // is the graphic marker; no triangle, no temp duplication.
                    const sep = firstLabel ? '' : `<div class="hour-sep" style="top:${i * band}%;"></div>`;
                    firstLabel = false;
                    return `${sep}<div class="time-label now" style="top:${(i + 0.5) * band}%;"
                                 aria-label="Now">${runClockLabel(Date.now())}</div>`;
                }
                if (h % step) return '';
                const sep = firstLabel ? '' : `<div class="hour-sep" style="top:${i * band}%;"></div>`;
                firstLabel = false;
                return `${sep}<div class="time-label" style="top:${(i + 0.5) * band}%;">${hourLabel(h)}</div>`;
            }).join('');
        };

        // Placeholder grid while no forecast is available yet.
        // Colorless by design (no fake weather): a dim pulse across the
        // week, replaced in place by real data.
        const renderSkeleton = () => {
            const { start, end, days } = visibleWindow();
            const rows = end - start + 1;
            $('days').innerHTML = Array(days).fill('<div class="day-label">–</div>').join('');
            $('temps').className = `temp-row${settings.unit === 'F' ? ' unit-f' : ''}`;
            $('temps').innerHTML = Array(days).fill(
                `<div class="temp-item"><span class="temp-max">–</span><span class="temp-sep">/</span><span class="temp-min">–</span></div>`
            ).join('');
            renderTimes();
            $('locationNow').textContent = ''; // no data yet, no readout
            $('sunLines').innerHTML = ''; // no data, no lines
            $('grid').innerHTML = Array(days).fill().map((_, d) =>
                `<div class="day-column">${
                    `<div class="weather-block skeleton" style="animation-delay:${(d * 0.12).toFixed(2)}s"></div>`.repeat(rows)
                }</div>`
            ).join('');
        };

        const setLoading = loading => {
            state.loading = loading;
            if (!loading) return;
            if (!state.data.length) {
                // Nothing to show yet: skeleton grid + explicit indicator.
                renderSkeleton();
                setStatus('Loading forecast…', 'updating');
            } else {
                // Stale data stays on screen; just hint at the background refresh.
                setStatus('Updating…', 'updating');
            }
        };

        // No separate error banner: the freshness label carries the failure
        // and doubles as the retry button (tap/click to refetch). The message
        // is remembered so updateStatus can restate it (it holds until a fetch
        // succeeds, since nothing else can render). Resting layer, no timer.
        const showError = (msg = 'No data. Tap to retry') => {
            state.loading = false;
            state.lastError = msg;
            updateStatus();
        };

        // City-local calendar parts for any instant (date + hour + minute),
        // using the forecast's IANA timezone so times match the grid. One
        // cached formatter, rebuilt only when the timezone changes (every
        // forecast response may overwrite state.tz), serves both this and
        // cityNow instead of each rebuilding its own.
        let cityFmt = null, cityFmtTz = null;
        const cityParts = ms => {
            if (cityFmtTz !== state.tz) {
                cityFmt = new Intl.DateTimeFormat('en-CA', {
                    timeZone: state.tz, year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
                });
                cityFmtTz = state.tz;
            }
            const parts = cityFmt.formatToParts(new Date(ms));
            const g = t => parts.find(p => p.type === t).value;
            return { date: `${g('year')}-${g('month')}-${g('day')}`, h: +g('hour'), m: +g('minute') };
        };
        // "Now" in the city's timezone: date + hour only (the grid keys the
        // current block on cityNow().hour). Folded onto cityParts so there is
        // one city formatter, not two.
        const cityNow = () => { const p = cityParts(Date.now()); return { date: p.date, hour: p.h }; };
        // Clock time of an instant, in the user's 12/24h style (reuses timeLabel
        // so it matches the grid's own axis labels).
        const runClockLabel = ms => { const p = cityParts(ms); return timeLabel(p.h, p.m); };
        // Expected next-release clock time; adds a day hint when it lands after
        // midnight (the interval is at most a few hours, so "tomorrow" covers it).
        const nextTimeLabel = ms => {
            const p = cityParts(ms);
            const label = timeLabel(p.h, p.m);
            return p.date === cityParts(Date.now()).date ? label : `${label} tomorrow`;
        };
        // Coarse "time until" for the tooltip/aria (Minutes < 1h, hours < 1d).
        const relFuture = ms => {
            const min = Math.round(ms / 60000);
            if (min < 60) return `in ${Math.max(1, min)}m`;
            const h = Math.round(min / 60);
            if (h < 24) return `in ${h}h`;
            return `in ${Math.round(h / 24)}d`;
        };

        // Absolute "Tue 14:00" stamp (city-local) for the deep-stale warning.
        const WEEKDAY_3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const staleStamp = ms => {
            const p = cityParts(ms);
            return `${WEEKDAY_3[dowOf(p.date)]} ${timeLabel(p.h, p.m)}`;
        };

        // DR-7 resting layer: updateStatus computes the line's home state and is
        // the tie-break when several conditions are true. Priority, highest
        // first: (1) no-data error (nothing can render, so it holds until a
        // fetch succeeds); (2) offline with a forecast on screen (name the
        // honest state, principle 4); (3) a waiting app version (reload CTA);
        // (4) deep-stale / out-of-date CTA; (5) the normal freshness line (model
        // run + next update, else the fetch-time fallback). In-flight notices
        // ("Loading forecast…", "Updating…", "Locating…") outrank this layer and
        // are set directly; they clear when their process ends, which re-runs
        // updateStatus on success or drops to the relevant resting state.
        // Staleness is measured against the model's own cadence, not a wall
        // clock (owner-directed): the forecast is "overdue" once the next
        // expected model release has come and gone (by more than the grace),
        // i.e. a newer forecast should exist, whether or not we can reach it.
        // With no model metadata to reason about cadence, fall back to a 24h
        // age. stampMs dates the forecast we're showing: the model run when
        // known, else our fetch time.
        const forecastOverdue = () => state.modelRun
            ? Date.now() - state.modelRun.nextUpdate > NEXT_UPDATE_GRACE
            : !!state.fetchedAt && Date.now() - state.fetchedAt > DEEP_STALE_TIME;
        const forecastStampMs = () => state.modelRun ? state.modelRun.init : state.fetchedAt;

        const updateStatus = () => {
            // A resting repaint means the brief "New version" note is no longer
            // up, so its tap-opens-changelog mode ends here.
            state.updateNote = false;
            // (1) No data at all: the retry CTA holds. While actively loading,
            // "Loading forecast…" owns the line, so leave it be.
            if (!state.data.length) {
                if (state.loading) return;
                setStatus(state.lastError || 'No data. Tap to retry', 'stale');
                return;
            }
            const overdue = forecastOverdue();
            // (2) Offline with a forecast on screen. While the data is still
            // within its model cycle, the calm grey notice is honest enough.
            // Once a release has been missed it escalates to amber and dates the
            // forecast, so "how stale" is visible even with no way to refresh.
            if (!state.online) {
                const stampMs = forecastStampMs();
                if (overdue && stampMs) {
                    const stamp = staleStamp(stampMs);
                    // Show *when* the shown data is from: offline for a long
                    // time, the stamp is the real signal of how stale it is.
                    // The amber pill already reads as the warning; the stamp
                    // carries the age. Fits a phone row in 12h and 24h forms.
                    setStatus(`Offline · from ${stamp}`, 'outdated');
                    $('status').setAttribute('aria-label',
                        `Offline. The forecast is stale, from ${stamp}; a newer model run is due. It will refresh when the connection returns.`);
                } else {
                    setStatus('Offline · last forecast', 'stale');
                }
                return;
            }
            // (3) A newer app version is waiting: one reload CTA, styled like the
            // outdated pill, in this same line instead of a separate banner.
            if (state.swUpdate) {
                setStatus('↻ Update app', 'outdated');
                $('status').setAttribute('aria-label',
                    'A new version of the app is available. Tap to reload.');
                return;
            }
            // Post-update note. A build we hadn't seen before is now running (the
            // update already landed, via network-first HTML or a prior reload):
            // point at what changed. Fired from here, the resting layer, so it
            // only appears once the line is at a clean freshness state (data
            // present, online, not overdue) and waits behind no-data / offline /
            // reload / overdue states, which outrank it. It owns the line for
            // WHATS_NEW_MS and is re-shown on every repaint inside that window,
            // so a cache paint or the startup revalidation can't clobber it (the
            // fix for it showing inconsistently); then it clears back to
            // freshness on its own. whatsNewPending is armed once per new build.
            if (state.whatsNewPending && !overdue) {
                if (!whatsNewTimer) {
                    whatsNewTimer = setTimeout(() => {
                        whatsNewTimer = null;
                        state.whatsNewPending = false;
                        state.updateNote = false;
                        updateStatus();
                    }, WHATS_NEW_MS);
                }
                state.updateNote = true; // a tap now opens the changelog (What's new)
                setStatus('New version · see ⚙', 'outdated');
                $('status').setAttribute('aria-label', 'New version available. Open what\'s new, also under the settings menu');
                return;
            }
            // (4) The normal freshness line reports the weather model's *run*
            // time (when the forecast was computed, not when we fetched it) and
            // the time until the next model update. When that update is overdue
            // it warns amber. Falls back to fetch time if the metadata API
            // hasn't answered.
            const m = state.modelRun;
            if (m) {
                const toNext = m.nextUpdate - Date.now();
                const loc = state.localRun;
                if (overdue) {
                    // A newer run should be out, so present an explicit refresh CTA.
                    setStatus('↻ Update forecast', 'outdated');
                    $('status').setAttribute('aria-label',
                        `Forecast out of date (global model last run ${runClockLabel(m.init)}). Refresh to update.`);
                } else if (loc) {
                    // Two-model line: the regional high-res model drives the
                    // near-term hours and refreshes more often; the global run
                    // covers the full 7-day horizon. Show both run times so
                    // "how fresh" is honest for each. Overdue stays tied to the
                    // global cadence (above), since it governs the whole grid.
                    setStatus(`Local ${runClockLabel(loc.init)} · Global ${runClockLabel(m.init)}`, '');
                    const toLoc = loc.nextUpdate - Date.now();
                    $('status').setAttribute('aria-label',
                        `Forecast freshness: ${loc.label} local model last run at ${runClockLabel(loc.init)}` +
                        (toLoc > 0 ? ` (next update ~${nextTimeLabel(loc.nextUpdate)})` : ' (update due)') +
                        `; global model last run at ${runClockLabel(m.init)}` +
                        (toNext > 0 ? ` (next ~${nextTimeLabel(m.nextUpdate)})` : ' (update due)') +
                        '. Click to refresh.');
                } else {
                    const tail = toNext > 0 ? `next ~${nextTimeLabel(m.nextUpdate)}` : 'update due';
                    setStatus(`Run ${runClockLabel(m.init)} · ${tail}`, '');
                    $('status').setAttribute('aria-label',
                        `Forecast freshness: weather model last run at ${runClockLabel(m.init)}; ` +
                        (toNext > 0
                            ? `next update expected around ${nextTimeLabel(m.nextUpdate)} (${relFuture(toNext)}). `
                            : 'next update is due. ') +
                        'Click to refresh.');
                }
                return;
            }
            // Fallback: no model metadata yet → fetch-time wording. Past the 24h
            // fallback (overdue with no cadence), escalate to the amber dated
            // warning, matching the model-driven path above.
            if (!state.fetchedAt) { setStatus(''); return; }
            const age = Date.now() - state.fetchedAt;
            const minutes = Math.floor(age / 60000);
            if (age < 60000) {
                setStatus('Data is fresh', 'fresh');
            } else if (overdue) {
                const stamp = staleStamp(state.fetchedAt);
                setStatus('↻ Update forecast', 'outdated');
                $('status').setAttribute('aria-label',
                    `Forecast is stale, last updated ${stamp}. Tap to refresh.`);
            } else if (age > FRESH_TIME) {
                setStatus('Data may be outdated', 'stale');
            } else {
                setStatus(`Updated ${minutes} minute${minutes !== 1 ? 's' : ''} ago`);
            }
        };

        const renderLocation = () => {
            document.title = state.place.name;
            $('location').classList.remove('locating');
            // Set the inner span (not .location itself) so the ellipsis rule
            // applies and the ↓ arrow pseudo-element is preserved.
            $('locationName').textContent = state.place.name;
        };
        // Current-hour temperature shown inline in the header. Independent of
        // the grid's visible hour window (all hours live in state.data), so it
        // still answers "what is it right now?" at night when the current hour
        // sits outside the 06:00–21:00 grid. Empty when there's no today column
        // or no reading for this hour; :empty CSS then collapses the node.
        const renderNowTemp = () => {
            const ti = state.days.findIndex(d => d.isToday);
            const t = ti >= 0 ? state.data[ti]?.find(x => x.hour === cityNow().hour)?.temp : null;
            $('locationNow').textContent = t != null ? `${displayTemp(t)}°` : '';
        };
        // First-visit holding state, shown while the timezone guess resolves so
        // the hardcoded default never flashes before the real nearby city. The
        // .locating class hides the ↓ arrow; the title stays generic (no city).
        const renderLocating = () => {
            document.title = 'Maybe Rain?';
            $('location').classList.add('locating');
            $('locationName').textContent = 'Locating…';
            $('locationNow').textContent = '';   // no reading yet
        };

        // --- Fetch forecast (Open-Meteo, no API key) ----------------------
        const forecastURL = p =>
            'https://api.open-meteo.com/v1/forecast' +
            `?latitude=${p.latitude}&longitude=${p.longitude}` +
            '&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,cloud_cover,precipitation,rain,showers,snowfall,precipitation_probability,uv_index,wind_speed_10m,wind_direction_10m,wind_gusts_10m' +
            '&daily=sunrise,sunset' +
            // FORECAST_DAYS (15) fetched, 7 columns ever displayed at once
            // (visibleWindow). 14 of them are reachable: the shipped week is lead
            // days 0-6 and the day drawer slides that frame out to lead day 13.
            // The 15th is the rollover spare, as above. Open-Meteo's ceiling is
            // forecast_days=16, so this sits one day inside it.
            //
            // Every day is fetched hourly, on the same request and the same
            // fields as the shipped week, so a revealed column is an ordinary
            // column. DR-29 planned to coarsen the far days to a daily aggregate
            // on the grounds that hourly data past day 7 does not exist; DR-34
            // measured that and found it false (Open-Meteo returns an
            // hourly-shaped value out to the ceiling, interpolated past a model's
            // native cadence). The coarsening may still be right, but it is a
            // resolution and confidence question, not a data-availability one,
            // and it waits on the confidence pass with the rest of DR-33/35.
            `&timezone=auto&forecast_days=${FORECAST_DAYS}`;

        // Parse the metadata payload (Unix seconds) into ms state. The next
        // update is computed from the *actual* previous release: the model's
        // last run became available at last_run_availability_time, so the next
        // run should release about one update interval after that. This gives a
        // real expected time rather than a guess.
        const parseRun = meta => {
            const init = meta.last_run_initialisation_time * 1000;
            const interval = (meta.update_interval_seconds || 6 * 3600) * 1000;
            // When the current run actually became available on the API.
            const released = meta.last_run_availability_time
                ? meta.last_run_availability_time * 1000
                : init + 4 * 60 * 60 * 1000; // fallback: typical global publish lag
            return { init, interval, nextUpdate: released + interval };
        };
        const setModelRun = meta => { state.modelRun = parseRun(meta); };
        const setLocalRun = (meta, model) =>
            { state.localRun = { ...parseRun(meta), slug: model.slug, label: model.label }; };

        // Fetch the model-run metadata. Fired in parallel with the forecast
        // (never chained after it) and non-blocking: the grid paints first and
        // this fills in the freshness line when it lands. Cached in
        // localStorage and only re-fetched once the next run is due, so it
        // adds no perceptible load. On any failure the line falls back to
        // fetch time (see updateStatus).
        const fetchModelMeta = async () => {
            // Until the next update is expected, the cached value is still correct.
            if (state.modelRun && Date.now() < state.modelRun.nextUpdate) return;
            try {
                const r = await fetch(META_URL, {
                    cache: 'no-store',
                    signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined
                });
                if (!r.ok) return;
                const meta = await r.json();
                if (!meta?.last_run_initialisation_time) return;
                setModelRun(meta);
                saveJSON(LS_META, meta);
                if (!state.loading) updateStatus(); // don't clobber "Loading…"/"Updating…"
            } catch { /* offline / CORS / timeout: keep fetch-time fallback */ }
        };

        // Fetch the regional model's run time for the current place, same
        // pattern as fetchModelMeta (parallel, non-blocking, cadence-guarded).
        // The model is chosen by location; if none covers it, state.localRun is
        // cleared so the line shows the global run alone. Per-slug cache, since
        // switching cities can switch regions. Called alongside fetchModelMeta
        // on every fetch, so it re-evaluates whenever the place changes.
        const fetchLocalMeta = async () => {
            const model = localModelFor(state.place.latitude, state.place.longitude);
            if (!model) { state.localRun = null; return; }
            // Have this model's run already and it's still current.
            if (state.localRun?.slug === model.slug && Date.now() < state.localRun.nextUpdate) return;
            const cache = loadJSON(LS_META_LOCAL) || {};
            const cached = cache[model.slug];
            if (cached?.last_run_initialisation_time) {
                setLocalRun(cached, model);
                if (Date.now() < state.localRun.nextUpdate) return; // cache still within cadence
            } else if (state.localRun?.slug !== model.slug) {
                state.localRun = null; // don't show the previous region's run while fetching
            }
            try {
                const r = await fetch(localMetaURL(model.slug), {
                    cache: 'no-store',
                    signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined
                });
                if (!r.ok) return;
                const meta = await r.json();
                if (!meta?.last_run_initialisation_time) return;
                // The place may have changed regions mid-fetch, discard if so.
                if (localModelFor(state.place.latitude, state.place.longitude)?.slug !== model.slug) return;
                setLocalRun(meta, model);
                saveJSON(LS_META_LOCAL, { ...(loadJSON(LS_META_LOCAL) || {}), [model.slug]: meta });
                if (!state.loading) updateStatus(); // don't clobber "Loading…"/"Updating…"
            } catch { /* offline / CORS / timeout: fall back to global-only line */ }
        };

        const fetchWeather = async (force = false) => {
            if (state.loading && !force) return;
            // Pin the place this fetch is for. A mid-flight city switch aborts
            // our controller, but if the response already resolved in the gap
            // before the abort lands, the continuation would otherwise read the
            // *new* state.place and save this payload under the wrong city. Pin
            // it, fetch/load/save against the pin, and bail after the awaits if
            // the user has since moved on.
            const place = state.place;
            fetchModelMeta(); // parallel, non-blocking; self-guards on cadence
            fetchLocalMeta(); // regional run time for this place; self-guards too
            // Fresh enough to skip, unless what is cached was fetched over a
            // shorter horizon than the drawer can now reach: that payload is not
            // stale, it is just short, and holding it for the rest of the
            // freshness window would leave the drawer clamped at a reach the user
            // can see is wrong. Fires once per place, on the first load after the
            // reach changed, then never again.
            if (!force && state.data.length && (Date.now() - state.fetchedAt) < FRESH_TIME
                && !staleHorizon(loadForecast(place))) {
                updateStatus();
                return;
            }
            setLoading(true);
            let timedOut = false;
            let timer;
            try {
                state.controller?.abort();
                state.controller = new AbortController();
                // Abort a connection that stalls: a hung socket would otherwise
                // spin on "Loading forecast…" forever with no way out.
                timer = setTimeout(() => { timedOut = true; state.controller.abort(); }, FETCH_TIMEOUT);
                const response = await fetch(forecastURL(place), { signal: state.controller.signal });
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const payload = await response.json();
                // Superseded by a city switch while we awaited: drop this result
                // so it can't render under, or be saved against, the place now on
                // screen. The newer fetch owns the loading state, so just return.
                if (place !== state.place) return;
                if (!payload.hourly?.time?.length) throw new Error('Invalid data received');

                state.fetchedAt = Date.now();
                state.lastError = '';   // a good fetch clears any held error
                state.online = true;    // it reached the network, so we're online
                // DR-6 layer 2: compare against the cached payload. Identical
                // (most 30-min polls, the models update ~6-hourly): the fetch
                // was real so freshness advances, but the render is skipped
                // entirely; that removes the render burst from no-change polls
                // and post-switch revalidations. Different: the old current
                // rotates into prev (the last payload that actually differed)
