<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget=resizes-content is the actual fix for the
         on-screen keyboard. Without it Android Chrome shrinks only the
         VISUAL viewport, so anything positioned against the layout viewport
         (every `position: fixed` element, this app's sheet included) stays
         where it was and the keyboard covers it. With it the layout viewport
         shrinks too, `bottom: 0` means "above the keyboard" on its own, and
         the JS fallback in app.js measures zero and does nothing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Maybe Rain?</title>
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Glanceable weekly weather: should I expect rain, and when?">
    <!-- Link-preview card (Open Graph / Twitter). Static, so the same branded
         card shows for every place: a per-city preview would need a server to
         render per-place tags, and there's no backend (principle 5). Absolute
         URLs, since crawlers don't resolve relative ones. -->
    <meta property="og:title" content="Maybe Rain?">
    <meta property="og:description" content="Glanceable weekly weather: should I expect rain, and when?">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://mdomokos.github.io/maybe-rain/">
    <meta property="og:site_name" content="Maybe Rain?">
    <meta property="og:locale" content="en_NZ">
    <meta property="og:image" content="https://mdomokos.github.io/maybe-rain/og.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="A week of Maybe Rain?'s hourly forecast grid, coloured by condition, beside the wordmark">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Maybe Rain?">
    <meta name="twitter:description" content="Glanceable weekly weather: should I expect rain, and when?">
    <meta name="twitter:image" content="https://mdomokos.github.io/maybe-rain/og.png">
    <meta name="twitter:image:alt" content="A week of Maybe Rain?'s hourly forecast grid, coloured by condition, beside the wordmark">
    <!-- Warm up the TLS connection to the forecast API before the first fetch
         fires (preconnect pays off when there's a 100–300 ms gap ahead of the
         request; here, the JS boot + geolocation resolve provide it). -->
    <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.5f244688.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --gutter: 44px;    /* left space for time labels */
            --gap: 6px;        /* horizontal gap between day columns */
            --block-gap: 6px;  /* vertical gap between blocks in a column (matches --gap for an even grid) */
            --overhang: 14px;  /* how far gridlines extend past the grid on the right */
            --band: 6.25%;     /* height of one hour band = 100 / displayed rows (set from JS) */
            --radius: 2px;     /* the one corner radius, used everywhere */
            --line: rgba(255,255,255,0.25); /* one hairline for panels & controls */
            /* The structural hairline: the chart gridlines and the header
               separator both draw from this one token (0.3, stronger than
               --line), so every full-width rule in the app reads as one system.
               Change the line weight/colour here and both move together. */
            --gridline: rgba(255,255,255,0.3);
            /* vertical rhythm, 8px scale */
            --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 32px;
            /* Colour tokens. The gold accent with its two shades, the three
               text greys, and the row hairline, named once here so the search
               field and the settings menu draw from one set instead of
               repeating literals. Values are the ones already in use. */
            --accent: #FFD700;    /* gold: selection, focus, the one accent */
            --accent-hi: #FFE44D; /* lighter gold, hover on filled controls */
            --accent-lo: #E6C200; /* darker gold, press on filled controls */
            --text: #fff;         /* primary text */
            --text-muted: #ccc;   /* labels and the gear glyph */
            --text-faint: #888;   /* inactive segmented options */
            --divider: rgba(255,255,255,0.1); /* row hairline, softer than --line */
            /* Surfaces and the dark foreground that sits on gold. With black
               itself named, a future theme becomes a second block of values
               with no component CSS touched. Grid hues, the skeleton fill, and
               the gridline mesh stay literal, on the grid's own palette. */
            --bg: #000;            /* the one black plane and every flush panel */
            --on-accent: #000;     /* dark text and glyphs on a gold fill */
            --marker: #fff;        /* the now/focus marker ring, and legend focus */
            --scrim: rgba(0,0,0,0.72); /* dim behind the changelog modal */
            /* The city switcher's own dim, darker than --scrim because its
               rows carry 20px names and a gold aim, and the grid behind is a
               preview rather than something to read through. Its own token,
               so the changelog is not dragged along with it. */
            --switch-scrim: rgba(0,0,0,0.86);
            --line-strong: rgba(255,255,255,0.6); /* button hover border, above --line */
            /* Extra text greys past the main three, brightest to faintest. */
            --tip-body: #d0d0d0;   /* tooltip body copy */
            --tip-temp: #E0D875;   /* the temp figure in the block tooltip, muted yellow-gold */
            --tip-rain: #87CEEB;   /* the rain figure in the block tooltip, from CONDITIONS light-rain */
            --tip-wind: #50C878;   /* the wind figure in the block tooltip, from WIND_STOPS fresh green */
            --text-dim: #666;      /* temp separator, dismiss, hints */
            --text-dimmer: #555;   /* the off (unfavorited) star */
            /* Status line states. */
            --status-hover: #999;
            --status-info: #777;   /* the quiet info chevron */
            --status-stale: #B0B0B0;
            /* Amber attention, softer than an error. */
            --warn: #E0A83E;
            --warn-strong: #F0C060; /* outdated, on hover */
            --warn-bg: rgba(224,168,62,0.12);
            --warn-bg-soft: rgba(224, 168, 62, 0.08);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Roboto Mono', monospace;
            padding: 20px;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            min-height: 100dvh;
            /* no grey tap flash; no double-tap zoom (pinch zoom still works) */
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            /* no long-press selection popups on the UI chrome */
            -webkit-user-select: none;
            user-select: none;
        }
        /* keep the tooltip values and the search field selectable */
        .tooltip, input {
            -webkit-user-select: text;
            user-select: text;
        }
        /* Width follows viewport height so the grid keeps its portrait
           proportions: larger screens get a larger grid, capped at 540px. */
        .container { max-width: clamp(380px, 54vh, 540px); margin: 0 auto; }
        /* The city name, which lives in the control row at the bottom. The
           base rule is what the control row then overrides. */
        .location {
            font-size: 24px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
            /* Fill the header row so the whole strip (city name plus the empty
               space up to the ⚙) is one large button: hover paints all of it
               gold and the arrow dips, matching a real click target. A long
               place name still ellipsizes (min-width:0 + the name's overflow)
               instead of pushing the gear or wrapping. */
            flex: 1;
            min-width: 0;
            padding-right: 10px;   /* breathing room before the gear, still tappable */
        }
        .location-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }
        .location-caret {
            flex-shrink: 0;   /* the caret is never truncated */
            opacity: 0.6;
            display: inline-flex;
            align-items: center;
            transition: transform 0.2s ease;
        }
        .location-caret svg { width: 16px; height: 16px; display: block; }
        .location:hover {
            color: var(--accent);
        }
        .location:hover .location-caret {
            transform: translateY(2px);
        }
        /* First-visit "Locating…" state: hide the change-city caret (there's
           no place to change yet); the header can still be tapped to search. */
        .location.locating .location-caret { display: none; }
        /* Current-hour temperature, inline on the city name's baseline in the
           former dead space before the ⚙. Same size/weight as the name (both
           lead the hierarchy); gold ties it to the grid's now-marker. Answers
           "what is it right now?" without spending a second header row. */
        /* No reading (locating, or no data for the current hour): collapse it,
           so nothing floats where a value would be. */

        /* Button styles */
        .btn {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
            border-radius: var(--radius);
            padding: 8px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .btn:hover, .btn:focus { border-color: var(--line-strong); outline: none; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Settings: still the only menu in the app, reached from the one
           row in the sheet the city name opens. There is no ⚙ on the screen:
           the header is a readout and the control row is for the two things
           touched every session. */
        .settings {
            position: static;
            /* Flush with the app, matching the sheet's own rows: opaque
               black, no raised box, rows marked off by hairlines. */
            background: var(--bg);
            border: none;
            border-radius: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            font-size: 12px;
        }
        .settings.hidden { display: none; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            /* aligned to the sheet's own rows, which share the grid gutter */
            min-height: 40px;
            padding: 6px var(--gutter);
            color: var(--text-muted);
        }
        /* Hairline between rows, the same one the search results use. */
        .setting-row + .setting-row { border-top: 1px solid var(--divider); }
        /* Segmented control (settings rows + view toggle). No box: the options
           sit as plain words, the active one gold with a gold underline, the
           same accent language as the search field's underline and the
           highlighted result. */
        .seg {
            display: flex;
            gap: 10px;
        }
        .seg button {
            background: transparent;
            border: none;
            /* 1px active underline: one gold line weight across the app,
               matching the search-result underline and the sun lines. */
            border-bottom: 1px solid transparent;
            color: var(--text-faint);
            font-family: inherit;
            font-size: 12px;
            padding: 4px 2px 3px;
            cursor: pointer;
        }
        .seg button.active { color: var(--accent); border-bottom-color: var(--accent); }
        .seg button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

        /* Rain/temperature view toggle: one tap, near the grid. Shares its
           row with the data-freshness line (freshness left, buttons right).
           Right margin = --overhang, so the buttons align with the last
           column, not the gridline overhang. */
        .view-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: var(--sp-1);
            margin-left: var(--gutter);
            margin-right: var(--overhang);
        }
        .view-toggle .seg { flex: none; position: relative; }
        /* DR-30: while a horizontal scrub is live the grid says what the data
           looks like but not what it is called, so the underline slides toward
           the view being pulled toward and names it. Drawn only once it has
           been measured onto a laid-out button (`has-bar`); until then the
           button's own border-bottom is still the underline, so a browser that
           never lays this out is no worse off than before. */
        .view-toggle .seg .segbar {
            position: absolute;
            bottom: 0;
            /* 1px wide at the origin: the element is placed and sized by one
               transform, so nothing here touches layout. scaleX is the width
               in pixels, translateX the offset. */
            left: 0;
            width: 1px;
            height: 1px;
            transform-origin: 0 50%;
            background: var(--accent);
            pointer-events: none;
            /* A tap used to move this instantly while the grid below took
               ~320ms to answer, so the label changed before the thing it
               labels. It now travels on its own, slightly quicker than the
               grid so it still arrives first. */
            transition: transform 160ms ease;
        }
        /* Driven off a finger: one easing at a time. */
        .view-toggle .seg.bar-scrub .segbar { transition: none; }
        .view-toggle .seg.has-bar button.active { border-bottom-color: transparent; }
        /* --- The one-handed layout --------------------------------------
           Everything below is the redesign. It changes where controls sit and
           what arms them; it introduces no colour, no type family, and no
           radius that the app did not already have. Every value here is an
           existing token or an existing literal from the row it replaces. */

        /* Conditions summary. Occupies the header strip the city name and the
           now-temp used to share, so the strip's gutter/overhang alignment and
           its hairline cap are inherited untouched. The now-temp keeps its own
           rule above (24px gold, lead type); only the trailing detail is new,
           at the app's secondary size and grey. */
        /* The bottom line. One occupant at a time: the status line at rest,
           the key while the grid is being touched, the swipe hint on a first
           run. HEIGHT, not min-height, and sized to the tallest of the three
           (the key, which is a swatch over a label): a slot that sized itself
           to its occupant would move the control row every time a finger
           landed on the grid.

           It sits below the grid rather than above it, which is the whole
           reason the header went. The key exists for the moment a finger is on
           the grid, and in the header that was exactly the moment the hand was
           covering it.

           It is also the LAST row, under the control row rather than over it.
           The control row is the only thing on this screen that gets touched,
           so it takes the position nearest the thumb; the line above it was
           spending the best reach in the app on text that is only ever read. */
        .botcap {
            height: 26px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-left: var(--gutter);
            margin-right: var(--overhang);
        }
        .botcap > * { width: 100%; }
        .status-wrap[hidden] { display: none; }
        /* Once the first render has run the three occupants stop being shown
           and hidden and start being faded between: same cell, same fixed
           height, one of them at opacity 1. The swap used to be a hard cut on
           every touchstart and touchend, which on a line sitting directly
           under the thumb read as a flicker rather than as one thing giving
           way to another. `visibility` rides along so the two that are out
           are not tab stops and cannot be read aloud. */
        .botcap.stacked {
            display: grid;
            align-items: center;
            /* One row, the slot's own height. The three occupants are all
               laid out now rather than one at a time, so without this the
               row would auto-size to the tallest of them and the slot's
               fixed height would stop being fixed. */
            grid-template-rows: 100%;
            overflow: hidden;
        }
        .botcap.stacked > * {
            grid-area: 1 / 1;
            align-self: center;
            transition: opacity 120ms ease, visibility 120ms;
        }
        /* The key's spacing was written for when it was the only child of
           this slot and could push it around. Stacked, it is one of three
           in one cell, and 16px of margin plus 16px of padding on a 26px
           slot would shift everything else in it. */
        .botcap.stacked .legend { margin-top: 0; padding-top: 0; }
        .botcap.stacked > .cap-off {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        /* The header is a readout in every state now: search happens in the
           sheet, so nothing up here ever has to get out of its way. */

        /* Calendar day strip. The weekday keeps the old .day-label rule; the
           date number is added beneath it at the temp row's own lead size and
           weight, so the three stacked rows (weekday, date, min/max) read as
           one type ladder rather than three sizes. Today is gold, exactly as
           the weekday already was: the marker is not restated as a dot, since
           the app's rule is one signal per thing. */
        .day-label { line-height: 1.25; }
        .day-date {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }
        .day-label.today .day-date { color: var(--accent); }

        /* The control row. Stacked under the status line inside the existing
           .view-toggle block, so the bottom zone keeps one owner and DR-7's
           state channel keeps its home. */
        .view-toggle { flex-direction: column; align-items: stretch; gap: 6px; }
        .control-row {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            /* The whole row is dragged: up for the city switcher, sideways
               for the view switcher. The browser must not claim either as a
               page pan first, so the whole row opts out, not just the name. */
            touch-action: none;
        }
        /* The city name in the row: lead weight, one step down from the header
           size it had, because it now shares a line with 44px tap targets. */
        .control-row .location {
            /* The largest target on the screen, because it is the one that
               matters most: tap for search, hold or swipe to switch city.
               Lead size, and a 52px box so the whole word plus its slack is
               one hit area rather than a line of text you have to find. */
            font-size: 20px;
            font-weight: 600;
            gap: 6px;
            /* centred, not baseline: the caret is a glyph in a box, and at
               20px text in a 52px row the two rules disagree by enough to
               look like the caret has come loose from the word. */
            align-items: center;
            min-height: 52px;
            padding: 0 12px 0 0;
        }
        .control-row .location-caret svg { width: 13px; height: 13px; }
        /* The caret is the same glyph the header used, turned to point the way
           the sheet opens, and turned back once it is open. Reusing the signal
           beats inventing one. */
        .control-row .location-caret { transform: rotate(180deg); }
        .control-row .location:hover .location-caret { transform: rotate(180deg) translateY(2px); }
        .control-row .location.sheet-open .location-caret { transform: rotate(0deg); }

        /* The three view buttons, as the words they name. An icon has to be
           learned before it can be read, and the underline that names the
           active view was argued for on exactly that ground: a wind grid and a
           temperature grid are both coloured squares until something names
           them. The words do that themselves. The hit box is still 44px tall,
           grown by padding rather than by type size, so the row does not. */
        .control-row .seg { flex: none; position: relative; gap: 10px; }
        .control-row .seg button {
            min-width: 44px;
            height: 44px;
            /* Column, not row: each button carries its current reading above
               its name. The stack fits because 44px was never a content size —
               it is the tap-target minimum, and one 13px word only ever used
               14px of it. The row does not grow by a pixel. */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            line-height: 1.1;
            padding: 0 3px;
            font-size: 13px;
        }
        /* --- The buttons as the readout ---------------------------------
           Each view button shows its own current-hour value: chance of rain,
           temperature, wind speed. Three things the app has never shown at
           once, in a row that already existed, and the button is now a preview
           of what tapping it gives you.

           The word stays. A control that rewrites its own label cannot be
           learned — you cannot build muscle memory for "the button that says
           16°" when tomorrow it says 4° — so the value moves and the name below
           it does not. That is also what makes the no-data state free: strip
           the numbers and what is left is exactly the row this replaced. */
        .control-row .seg .seg-val {
            font-size: 13px;
            font-weight: 600;
            /* fixed-width digits: the value changes every hour and the button
               must not twitch when 9% becomes 10% */
            font-variant-numeric: tabular-nums;
        }
        .control-row .seg .seg-lb {
            font-size: 9px;
            opacity: 0.72;
        }
        /* The active view's reading takes lead size. Without this the row is
           three equal numbers and nothing says which one the grid below is
           drawing; with it, the largest number on the screen is always the one
           being shown. It also restores a lead-size reading to the layout,
           which is the job the 24px header temperature used to do.
           17 + 1 + 10 = 28px in a 44px box: inside the target, with room. */
        .control-row .seg button.active .seg-val { font-size: 17px; }
        /* No reading in hand. `pop` is left null rather than faked, so this is
           a real state, not an edge case: dim the dash and let the word carry
           the button. */
        .control-row .seg .seg-val.none { opacity: 0.45; font-weight: 500; }

        /* The swipe hint. Lives in the status line's own row, shown only while
           the status line is at rest and only until the sheet has been opened
           once, so it costs nothing at the glance after that. */
        .swipe-hint {
            font-size: 10px;
            color: var(--text-dimmer);
            text-align: center;
            padding-bottom: 2px;
        }
        .swipe-hint[hidden] { display: none; }

        /* --- The city sheet ---------------------------------------------
           Flush black with hairline rows, the treatment the settings menu and
           the search results already use: no raised card, no new radius, no
           shadow. Nothing here is drawn at rest. */
        .sheet-scrim {
            position: fixed;
            inset: 0;
            background: var(--scrim);
            /* above the install banner (50), which is bottom-anchored too */
            z-index: 59;
        }
        .sheet-scrim[hidden] { display: none; }
        /* The switch draws its own translucency, so a scrim behind it would
           only double the dimming. Still there, still catching the tap that
           dismisses. */
        .sheet-scrim.clear { background: transparent; }
        /* The sheet arrives and leaves. It used to flip `hidden` and appear
           fully formed at the bottom of the screen, which reads as a repaint
           rather than as something opening: the one surface that covers the
           grid gave no sign of where it came from. 140ms of rise, and the
           scrim fades with it so the two read as one movement.

           Short on purpose. The drag path shows the sheet while a finger is
           already moving toward it, so anything longer would have the list
           still settling under a thumb that has arrived. */
        @keyframes sheetIn { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes sheetOut { from { transform: none; opacity: 1; } to { transform: translateY(10px); opacity: 0; } }
        @keyframes scrimIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scrimOut { from { opacity: 1; } to { opacity: 0; } }
        .city-sheet.sheet-in { animation: sheetIn 140ms ease-out; }
        .city-sheet.sheet-out { animation: sheetOut 140ms ease-in forwards; }
        .sheet-scrim.sheet-in { animation: scrimIn 140ms ease-out; }
        .sheet-scrim.sheet-out { animation: scrimOut 140ms ease-in forwards; }
        /* On the way out the rows are still drawn (they are what is fading)
           but they are no longer a target: a tap landing during the exit
           would aim at a list the app has already finished with. */
        .city-sheet.sheet-out, .sheet-scrim.sheet-out { pointer-events: none; }
        .city-sheet {
            position: fixed;
            left: 0;
            right: 0;
            /* Sits on top of the on-screen keyboard rather than under it.
               `position: fixed` is laid out against the LAYOUT viewport,
               which Android does not shrink when the keyboard opens, so a
               sheet anchored to bottom:0 ends up behind it with the field
               and its buttons cut off. --kb is the keyboard's height, read
               off visualViewport in app.js, and 0 whenever there is none. */
            bottom: var(--kb, 0px);
            z-index: 60;
            background: var(--bg);
            transition: background 0.15s ease;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            /* dvh so mobile browser chrome is accounted for. The sheet is a
               column: the grip and the action row are fixed, and only the
               middle scrolls. The action row is how you get between the two
               modes, so it is the one thing that must never scroll away, and
               the twelve-row menu is long enough to push it off a phone. */
            /* Against the VISUAL viewport, for the same reason: with the
               keyboard up there is far less room than 70dvh claims. */
            max-height: min(calc(var(--vvh, 100dvh) - 96px), 520px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* The drag that opens this never targets it (touchmove goes to
               the row the touch started on), so the sheet keeps ordinary
               vertical scrolling for the tap-mode case. */
            touch-action: pan-y;
        }
        .city-sheet > .sheet-grip,
        .city-sheet > .sheet-actions { flex: none; }
        .city-sheet > .sheet-list,
        .city-sheet > .search-results,
        .city-sheet > .settings {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            touch-action: pan-y;
        }
        .city-sheet[hidden] { display: none; }
        /* More transparent than search and the menu, on purpose: this one is
           held open for a second over a grid you are still reading. Same
           spacing, same rows, same everything else, so the two read as one
           surface in two weights. */
        .city-sheet.switching { background: var(--switch-scrim); }
        /* Held open by a finger: the list and the weather, nothing else. The
           action row cannot be aimed at during a drag, so it is not drawn,
           and dropping it lets the bottom row of the list fall where the
           control row sits, which is where the name you release on will
           rest. Opacity rather than visibility on the row underneath,
           because the row is the element the touch is captured on and it has
           to keep receiving the rest of the gesture. */
        .city-sheet.gesture .sheet-actions { display: none; }
        /* The control row hands the screen over to the sheet. Without a
           transition on it the whole bottom row (a 20px city name and three
           44px buttons) blinked out in one frame, which read as a glitch
           rather than as a handover. It fades on the sheet's own timing, so
           the row leaves as the list arrives. */
        #viewToggle { transition: opacity 140ms ease; }
        .container.switching #viewToggle { opacity: 0; }
        /* The readout takes the action row's place, at the control row's size,
           so the two coincide and the release is a swap rather than a move. */
        .sheet-aim { display: none; }
        .city-sheet.gesture .sheet-aim {
            display: flex;
            align-items: center;
            flex: none;
            min-height: 52px;
            padding: 0 var(--gutter);
            font-size: 20px;
            font-weight: 600;
            color: var(--accent);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sheet-grip {
            width: 36px;
            height: 3px;
            border-radius: var(--radius);
            background: var(--line);
            margin: 0 auto 10px;
        }
        /* Rows follow .search-result: a reserved bottom hairline whose colour
           travels with the selection, gold under the row a release would land
           on. 44px minimum, since this list is aimed at with a thumb. */
        .sheet-row {
            display: flex;
            align-items: center;
            gap: var(--sp-1);
            min-height: 44px;
            padding: 0 var(--gutter) 0 var(--gutter);
            font-size: 15px;
            color: var(--text);
            border-bottom: 1px solid var(--divider);
            cursor: pointer;
            transition: color 0.15s ease, border-color 0.15s ease;
        }
        /* `display:flex` on the row beats the hidden attribute's implicit
           display:none, so the wide slot has to be told twice. */
        .sheet-row[hidden] { display: none; }
        .sheet-row .sr-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sheet-row .sr-mark { flex-shrink: 0; font-size: 11px; color: var(--text-dim); }
        .sheet-row.current .sr-name { font-weight: 600; }
        /* The reading. Right-aligned in a fixed column with tabular figures,
           so the values line up as a column that can be read down in one
           pass — which is the entire reason they are here rather than being
           previewed one at a time. The slot keeps its width when a city has
           no cached forecast, so a blank never shifts the numbers beside it.
           Brighter than the tier marks and quieter than the name: the name
           is what you are choosing, the number is why. */
        .sheet-row .sr-val {
            flex-shrink: 0;
            min-width: 3.6em;
            text-align: right;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            color: var(--text-muted);
        }
        .sheet-row.aim .sr-val { color: var(--accent); }
        /* The tier seam. An inset hairline rather than a border or a
           separator row, because both of those are geometry: a border grows
           the row by a pixel and throws off the readout alignment, and a row
           of its own is a strip the aim falls into and finds no .sheet-row
           on. This is a paint and nothing else, so the list the thumb walks
           is exactly the list it was walking before. Doubled against the
           divider above it, which is what makes it read as a seam rather
           than as one more row line. */
        .sheet-row.seam { box-shadow: inset 0 1px 0 var(--line-strong); }
        /* Tier names sit on the first row of their block, beside the seam
           they explain. They are gone during a drag: at 11px, under a moving
           thumb, on a list that is being scrubbed rather than read, they are
           noise on top of the one word that matters. The seam itself stays,
           because a boundary you can see without reading still helps. The
           two anchor rows keep their marks throughout — "now" and "back" are
           what the bottom of the list is FOR. */
        .city-sheet.gesture .tier-recent .sr-mark,
        .city-sheet.gesture .tier-pinned .sr-mark { display: none; }
        .sheet-row.aim {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        .sheet-list:focus { outline: none; }   /* the aim row is the focus cue */
        /* The sheet's actions. The city name is the only way into anything
           that is not the grid now, so search and the settings menu both hang
           off it. They sit under the places, split by one hairline, smaller
           and grey with a glyph, so a row of this kind can never be mistaken
           for another city. */
        .sheet-actions {
            display: flex;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid var(--divider);
            padding: 6px 0 0;
        }
        .sheet-row.sheet-action {
            color: var(--text-faint);
            font-size: 15px;
            border-bottom: none;
            flex: 1;
            min-width: 0;
            min-height: 56px;
        }
        /* The other mode, as a button on the end of the same row. It was
           44px and glyph-only on a bare row, which is the minimum rather than
           a size, and beside a solid gold GPS square it read as decoration on
           the end of the field rather than a control you could press. It is
           drawn as a button now: the app's own outline treatment (--line at
           one radius, the same as .btn), 44px of ink in a 56px box, and the
           brighter of the two greys. */
        .sheet-row.sheet-mode {
            flex: none;
            width: 44px;
            height: 44px;
            min-height: 44px;
            margin: 0 var(--sp-1);
            justify-content: center;
            padding: 0;
            gap: 0;
            color: var(--text-muted);
            border: 1px solid var(--line);
            border-radius: var(--radius);
        }
        .sheet-row.sheet-mode:hover { border-color: var(--line-strong); color: var(--accent); }
        .sheet-row.sheet-mode .sr-glyph { width: 20px; }
        .sheet-row.sheet-mode .sr-glyph svg { width: 20px; height: 20px; }
        .sheet-row.sheet-action.aim { color: var(--accent); }
        /* The current mode's own label is a heading, not a control. */
        .sheet-row.sheet-here { color: var(--text-muted); cursor: default; }
        .sheet-row .sr-glyph { flex-shrink: 0; display: inline-flex; width: 16px; }
        .sheet-row .sr-glyph svg { width: 15px; height: 15px; display: block; }

        /* Keyboard focus */
        .location:focus-visible { color: var(--accent); outline: none; }
        .weather-block:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 2px var(--bg), inset 0 0 0 4px var(--marker);
            z-index: 1;
            position: relative;
        }

        /* Loading states: skeleton grid, no spinner. The placeholder is the grid. */
        .weather-block.skeleton {
            background: #1c1c1c;
            cursor: default;
            animation: skeletonPulse 1.6s ease-in-out infinite;
        }
        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }
        .status.updating {
            color: var(--text-faint);
            animation: skeletonPulse 1.6s ease-in-out infinite;
        }
        /* The reveal and change-pulse animations that used to live here are
           gone. Both were classic's: primary's grid has been driven by the
           playhead in app.js since the wave landed, and neither `.reveal` nor
           `.changed` has been applied by this variant's code since. A changed
           cell is now the `refresh` sweep, and the first paint is the `reveal`
           sweep, both of them timed in JS. */

        /* Reduced motion. Two halves that have to agree: the media query
           below, and `html.reduce-motion`, which app.js keeps in step with
           the same preference. The class exists because the JS gates read the
           preference too, and a user who toggles the OS setting mid-session
           should not get a page where half the rules have noticed and half
           have not. Every rule here is stated for both. */
        @media (prefers-reduced-motion: reduce) {
            .weather-block.skeleton, .status.updating { animation: none; opacity: 0.7; }
            /* Entrances: nothing arrives by moving. */
            .city-sheet.sheet-in, .city-sheet.sheet-out,
            .sheet-scrim.sheet-in, .sheet-scrim.sheet-out,
            .install-banner.revealed { animation: none; }
            /* Transitions that move or fade rather than recolour. Colour and
               border changes are kept: they are how a control says it is
               focused, and they do not move anything. */
            .segbar, #viewToggle, .botcap.stacked > *, .tooltip,
            .weather-block, .location-caret, .btn, .status.outdated,
            .city-sheet, .sheet-row { transition: none; }
            /* A hover that MOVES the caret is the exact class of thing this
               preference is for. The colour change stays. */
            .location:hover .location-caret,
            .control-row .location:hover .location-caret { transform: none; }
            .control-row .location:hover .location-caret { transform: rotate(180deg); }
        }
        html.reduce-motion .weather-block.skeleton,
        html.reduce-motion .status.updating { animation: none; opacity: 0.7; }
        html.reduce-motion .city-sheet.sheet-in,
        html.reduce-motion .city-sheet.sheet-out,
        html.reduce-motion .sheet-scrim.sheet-in,
        html.reduce-motion .sheet-scrim.sheet-out,
        html.reduce-motion .install-banner.revealed { animation: none; }
        html.reduce-motion .segbar,
        html.reduce-motion #viewToggle,
        html.reduce-motion .botcap.stacked > *,
        html.reduce-motion .tooltip,
        html.reduce-motion .weather-block,
        html.reduce-motion .location-caret,
        html.reduce-motion .btn,
        html.reduce-motion .status.outdated,
        html.reduce-motion .city-sheet,
        html.reduce-motion .sheet-row { transition: none; }
        html.reduce-motion .location:hover .location-caret { transform: none; }
        html.reduce-motion .control-row .location:hover .location-caret { transform: rotate(180deg); }
        /* Day labels.
           The label row and the grid columns share the same left gutter, gap,
           and flex:1 items, so they stay column-aligned at every width. */
        /* The calendar strip: weekday over date, one column per grid column. */
        /* The gap between columns is a margin on each column rather than
           the flex `gap`, because the elastic writes both the widths and
           the gaps from JS (DR-39) and a container gap would be counted
           twice. The variable stays the single source of the number. */
        .day-labels {
            display: flex;
            gap: 0;
            margin-bottom: 2px;
            padding-left: var(--gutter);
            padding-right: var(--overhang);
        }
        .day-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            white-space: nowrap;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
        /* A column whose day is outside the payload. It says nothing —
           it has no date to say — but it is still sized and laid out by
           the same pass as every other label, because a home-week column
           the payload falls short of is still a column, and a label row
           that skipped it would stop sitting over the days it names. */
        .day-label.absent { color: transparent; }
        .day-label.today {
            color: var(--accent);
            font-weight: 500;
        }

        /* Days behind today, reachable by paging the grid to the right.
           They are ordinary data and stay fully legible; the recession
           says only that they are behind now, so the eye lands on today
           first when the window is part-way back. Opacity rather than a
           colour change, so it composes with the block colours instead
           of fighting them, and the hazard glyphs and rain lines recede
           by the same amount as the cell they sit on.

           0.55 was picked to sit clearly below the live columns while
           keeping the blue/grey rain colours apart from each other on
           an OLED phone at low brightness; much below that and light
           rain and overcast stop being distinguishable, which is the
           one comparison a past column exists to support.

           .temp-item is no longer in this list: the min/max row it named
           is gone, and the day label and the blocks carry the recession
           between them. */
        .day-label.past { opacity: 0.55; }
        .weather-block.past { opacity: 0.55; }
        /* The current-hour marker never lands on a past column, so no
           .current interaction to handle here. Focus is left at full
           strength: a keyboard user tabbing into a past block should
           see the same focus ring as anywhere else. */
        .weather-block.past:focus-visible { opacity: 1; }

        /* --- The hour rail (DR-29) --------------------------------------
           One transparent, never-rebuilt gesture layer. Nothing is drawn at
           rest, so the resting screen is unchanged: the rails are pure hit
           boxes. Each covers the origin that arms its reveal, and `touch-action:
           none` on them keeps the browser from claiming the drag as a page pan
           (the grid itself keeps pan-y, so the view/city swipes are untouched).

           Only the hour rail is left. The day rail went with the drawer: date
           paging is armed by the grid field now, so there is no second origin
           left to separate it from. */
        .day-row { position: relative; }
        .rail {
            position: absolute;
            touch-action: none;
            z-index: 2;
        }
        /* The hour rail is the time-label gutter: the hour axis is what the peek
           moves, so the axis is where you pull it. It stops at the gutter's edge,
           leaving every block free for tap-to-open-tooltip. */
        #hourRail {
            left: 0;
            top: 0;
            width: var(--gutter);
            height: 100%;
        }
        /* Reach marks. Six pixels of gold that exist only while the grid is
           being touched, saying which way the window can still be pulled.
           Absolutely positioned inside .chart and pointer-events:none, so
           they sit over the gutter and the column edges without taking a
           single pixel of hit area from the block or the rail beneath.

           They fade rather than appear, on the caption slot's own timing,
           so a finger landing on the grid produces one movement across the
           whole screen rather than two unrelated ones. */
        .reach {
            position: absolute;
            z-index: 3;
            color: var(--accent);
            font-size: 8px;
            line-height: 1;
            pointer-events: none;
            opacity: 0.75;
            animation: reachIn 120ms ease-out;
        }
        .reach[hidden] { display: none; }
        @keyframes reachIn { from { opacity: 0; } to { opacity: 0.75; } }
        /* The hour carets, centred in the label gutter, level with the top
           and bottom edges of the grid. */
        .reach-v { left: calc((var(--gutter) - 8px) / 2); transform: translateX(-50%); }
        #reachUp { top: -1px; }
        #reachDown { bottom: -1px; }
        html.reduce-motion .reach { animation: none; }
        @media (prefers-reduced-motion: reduce) { .reach { animation: none; } }

        .city-count {
            margin-left: 6px;
            font-size: 10px;
            letter-spacing: .04em;
            color: var(--text-dim);
            vertical-align: middle;
        }
        .city-count:empty { display: none; }

        /* Home chip: only ever visible while the drawer is latched away from
           today, and it sits in the label row's left gutter, which is empty at
           rest, so it displaces no data and adds no chrome to the glance. */
        .home-chip {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            z-index: 3;
            width: calc(var(--gutter) - 8px);
            padding: 3px 0;
            background: none;
            border: none;
            border-radius: 4px;
            color: var(--accent);
            font: inherit;
            font-size: 12px;
            line-height: 1;
            text-align: center;
            cursor: pointer;
        }
        .home-chip[hidden] { display: none; }
        .home-chip:focus-visible { outline: 1px solid var(--accent); }

        /* Chart and grid */
        .chart {
            position: relative;
            /* pan-y keeps one-finger vertical scroll while the day elastic
               (DR-39) reads horizontal ones; it also blocks an accidental
               browser pinch on the grid itself. */
            touch-action: pan-y;
            height: clamp(280px, 56vh, 720px);
            padding-left: var(--gutter);
            /* columns stop short of the right edge, so the full-width
               gridlines overhang the grid on both sides */
            padding-right: var(--overhang);
            margin-top: 0;
        }
        .time-labels {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: calc(var(--gutter) - 8px);
        }
        .time-label {
            position: absolute;
            font-size: 11px;
            color: var(--text-faint);
            right: 0;
            /* label is positioned at the vertical middle of its hour band;
               translateY centers the text on that point so each label
               lines up with its row of blocks */
            transform: translateY(-50%);
            font-weight: 300;
        }
        /* Hour label separators: a 1px line spans the full label gutter at the
           top of each labeled row, marking it off from the label above. Confined
           to .time-labels (gutter - 8px wide), so it stops short of the 8px gap
           and never touches the grid field. Skipped before the first label and
           after the last, so the grid's own top/bottom edges stay bare. */
        .hour-sep {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }
        .chart-grid {
            display: flex;
            gap: 0;      /* see .day-labels: the elastic owns the gaps */
            height: 100%;
        }
        /* Past the end of the days the columns freeze and the whole grid
           slides toward the pull, its trailing edge clipping into black
           (DR-39). The clip is switched on for exactly that: at rest the
           current-hour marker deliberately overhangs the field's left
           edge, and a clip that was always on would eat it. The transform
           itself rides the COLUMNS, not this box, or the clip would
           travel with them and nothing would ever clip. */
        .chart-grid.sliding, .day-labels.sliding { overflow: hidden; }
        /* Gapped "pixel" grid: no column outline. Each block is a discrete
           rounded pixel; the gaps and gridlines provide the structure. */
        .day-column {
            flex: 1;
            min-width: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* Each hour band is exactly --band = 100% / displayed rows. A block
           fills its band minus --block-gap of whitespace, split evenly above
           and below so the block sits centered in its band and each gridline
           runs down the middle of the gap between blocks (rather than the block
           bottom resting flush on the line below it).
           (px, not %, for the gap: percentage vertical margins resolve
           against the column width, which was the old misalignment bug.)
           Colors come inline from the JS CONDITIONS array, so no condition
           data lives in CSS; flex centering plus inline color draw the glyph. */
        .weather-block {
            width: 100%;
            height: calc(var(--band) - var(--block-gap));
            margin-top: calc(var(--block-gap) / 2);
            margin-bottom: calc(var(--block-gap) / 2);
            border-radius: var(--radius);
            cursor: pointer;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            line-height: 1;
            position: relative;   /* anchors the corner markers */
            -webkit-user-select: none;
            user-select: none;
        }
        /* Corner markers: hazard icons bottom-right (storm/fog/freeze + heat/UV),
           sky event bottom-left (moon phase / eclipse). Inline SVGs in the
           block's luminance-picked contrast colour (currentColor); absolute so
           they never disturb a centred wind arrow, and the two corners coexist
           on the 21:00 block without overlapping. Flex lays stacked hazards
           (heat + UV) in a row; anchored right, the box grows leftward. */
        .block-mark {
            position: absolute;
            bottom: 1px;
            right: 2px;
            display: flex;
            align-items: center;
            /* Corner icon size. Bumped from 9px for legibility. Narrow phones
               step down (below) so three stacked hazards still fit the column. */
            font-size: 13px;
            line-height: 1;
            pointer-events: none;
        }
        .block-mark svg { width: 1em; height: 1em; display: block; }
        .block-mark.sky { right: auto; left: 2px; }
        /* DR-17 frost contour: a region-level outline on ACTUAL air temp. An
           overlay inset over the block; the render sets a border only on the
           sides that face out of the frozen (solid, 0 °) or near-freezing
           (dashed, +3 °) region, so the borders of adjacent cells join into one
           contour around the region. Solid = certain freezing, dashed = possible
           frost, reusing the rain view's dashed = possible / solid = certain
           grammar. Lines only, never a fill: lightness is the temperature axis,
           so a wash would make a near-freezing cell read warmer. */
        .frost {
            position: absolute;
            inset: 0;
            border-radius: var(--radius);
            pointer-events: none;
        }
        /* Rain-streak overlay: the wrapper's width is the chance
           channel (fill extent, anchored left, bare front edge); the SVG
           pattern inside is the intensity channel. Sits under the corner
           marks, clipped to the block's rounded corners. */
        .rain-ov {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border-radius: var(--radius);
            pointer-events: none;
        }
        .rain-ov svg { width: 100%; height: 100%; display: block; }
        /* Wind view: one SVG arrow centred in the block, rotated to the wind
           octant by an inline transform. Larger than a corner mark so the
           direction reads at a glance. */
        .wind-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 1.5em;
            height: 1.5em;
        }
        .wind-arrow svg { width: 100%; height: 100%; display: block; }
        /* Inline SVG icons inherit currentColor and size to ~1em in each
           context (MR_ICON set). One place so the chrome, tooltip, legend, and
           status icons stay in step. */
        .geo-btn svg { width: 1em; height: 1em; display: block; }
        .status-icon { display: inline-flex; align-items: center; vertical-align: -0.18em; margin-right: 1px; }
        .status-icon svg { width: 1.15em; height: 1.15em; display: block; }
        .search-result .pin svg,
        .search-result .unpin svg,
        .install-banner .dismiss svg,
        .modal-close svg { width: 1em; height: 1em; display: block; }
        .tooltip svg { width: 1em; height: 1em; vertical-align: -0.15em; }
        .legend .swatch svg { width: 1em; height: 1em; display: block; }
        .setting-row span svg { width: 1em; height: 1em; vertical-align: -0.15em; }
        /* While a sweep is running the playhead owns every block's colour and
           writes it frame by frame, so the block's own transition has to stay
           out of the way. One class on the grid, cleared when the sweep ends.
           It replaces an inline `transition:none` that was written onto all
           112 cells and never cleared, which left the hover fade dead until
           some later unanimated rebuild happened to restore it. */
        .chart-grid.sweeping .weather-block { transition: none; }
        .weather-block:hover {
            opacity: 0.8;
        }
        /* Current hour: a gold accent bar in the gutter just left of the block.
           The current block is always in the first column (today), so the bar
           sits on the black gutter background rather than on the block itself, so
           it never fights the block colour (e.g. a sunny gold block) the way an
           on-block gold ring would. Static; the axis marker reinforces the row. */
        .weather-block.current {
            z-index: 1;
            position: relative;
        }
        .weather-block.current::before {
            content: '';
            position: absolute;
            left: calc(-1 * var(--gap));
            top: 0;
            bottom: 0;
            width: 2px;
            /* white, not gold: gold is reserved for sun/today/sunrise, and the
               now-marker reading white cuts the app's overall gold fatigue */
            background: var(--marker);
            border-radius: 1px;
            pointer-events: none;
        }
        /* Side "now" indicator: at the current hour the axis label reads the
           exact current time to the minute, in white bold. The white block bar
           above is the sole graphic marker: no triangle, no line across the
           grid, no duplicated temperature. */
        .time-label.now {
            color: var(--text);
            font-weight: 600;
        }
        .weather-block.empty {
            background: transparent;
            cursor: default;
        }

        /* --- Far days, at the data's own cadence (DR-39) ---------------
           A block that stands for three or six hours is simply taller;
           its height is written inline from the slots it covers, so
           nothing is needed here. The DAILY bar is the one that also
           changes shape: inset from the column's sides and outlined with
           a hairline, so a single value for a whole day cannot be
           mistaken for an hour that happens to be very tall. DR-29's
           geometry, unchanged.

           `width: auto` rather than the block's usual 100%: a margin does
           not shrink a definite width, so 100% plus an 18% margin would
           push the bar out over its neighbour instead of insetting it.
           The column is a flex column, so auto stretches to what is left. */
        .weather-block.daily {
            width: auto;
            align-self: stretch;
            margin-left: 18%;
            margin-right: 18%;
            border: 1px solid rgba(255, 255, 255, 0.22);
        }

        /* --- The lock mark (DR-39) ------------------------------------
           A hairline BESIDE the grid, never on it: the grid surface is
           data and stays data. It sits in the chart's own side padding,
           outside the clip, so the slide never carries it off. It grows
           and brightens with the overpull, goes solid and glows when the
           release would lock, and stays small and dim while locked — the
           reminder of which edge is being held. */
        .lock-mark {
            position: absolute;
            top: 50%;
            width: 3px;
            height: 12%;
            transform: translateY(-50%);
            border-radius: 2px;
            background: var(--accent);
            opacity: 0;
            pointer-events: none;
            z-index: 3;
        }
        .lock-mark.left { left: 0; }
        .lock-mark.right { right: 0; }
        .lock-mark.armed {
            width: 4px;
            opacity: 1 !important;
            box-shadow: 0 0 6px 1px var(--accent);
        }
        .lock-mark.held {
            height: 15%;
            opacity: 0.4;
        }

        /* Sunrise/sunset: one straight gold hairline across the full chart
           width (same span as the gridlines) at today's exact minute,
           behind the blocks, so it peeks out in the gaps (negative z-index
           keeps the data pixels on top). Starts at the column field, clear
           of the time labels; keeps the gridlines' right overhang. Per-day
           exact times live in each covering block's tooltip. */
        .sun-line {
            position: absolute;
            left: var(--gutter);
            right: 0;
            height: 0;
            border-top: 1px solid var(--accent);
            z-index: -1;
            pointer-events: none;
        }

        /* Horizontal gridlines removed: the block gaps carry the row rhythm on
           their own, and the per-label edge ticks (.time-label::after) keep the
           clock tied to the grid. This is the single biggest declutter: the
           block grid now reads uninterrupted. */

        /* Legend and tooltip.
           Spectrum legend: both views render the same one-line strip of
           blocks; conditions ordered sun → cloud → rain → storm → snow
           (group labels beneath), or the heat scale in temp view. 2px gaps
           and per-block radius match the grid. */
        .legend {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 2px;
        }
        .legend[hidden], .legend.hidden { display: none; }
        .sheet-list.hidden { display: none; }
        .legend-step {
            flex: 1;
            max-width: 64px;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            color: var(--text-muted);
        }
        .legend-step .swatch {
            width: 100%;
            /* slimmed from 14px: the palette still reads at a glance but the
               strip gives its vertical space back to the grid */
            height: 8px;
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            line-height: 1;
            -webkit-user-select: none;
            user-select: none;
        }
        /* group label may be wider than its cell; neighbors are empty */
        .legend-step span { min-height: 1.2em; white-space: nowrap; }
        .legend-swatch { cursor: pointer; }
        .legend-swatch:focus-visible { outline: 1px solid var(--marker); outline-offset: 1px; }
        .tooltip {
            position: absolute;
            /* Placed entirely by transform, so left/top are the origin and
               never move. left/top cannot be composited, and this element
               repositions on every block a pointer visits. */
            left: 0;
            top: 0;
            background: var(--bg);
            color: var(--text);
            padding: 8px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: 12px;
            width: max-content;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 1000;
        }
        /* Only while MOVING from one block to another. An opening tooltip has
           no previous position worth travelling from, so it fades up in place
           and this class is off. */
        .tooltip.travel { transition: opacity 0.2s ease, transform 0.14s ease-out; }
        /* One fact per line, never wrapped mid-fact ("wind 6 km/h NW"
           stays whole); the tooltip grows to fit instead. */
        .tooltip div { white-space: nowrap; line-height: 1.5; }
        /* The freshness explanation is prose, not facts: let it wrap and cap
           the width so it reads as a paragraph rather than one long line. */
        .tooltip.explain { width: auto; max-width: min(260px, calc(100vw - 16px)); padding: 10px 12px; }
        .tooltip.explain div { white-space: normal; line-height: 1.45; margin-top: 7px; }
        /* Title sits tight to the top; the muted rule under it groups the body. */
        .tooltip.explain div:first-child { margin-top: 0; }
        .tooltip.explain .tip-title {
            font-size: 12px;
            padding-bottom: 6px;
            margin-bottom: 1px;
            border-bottom: 1px solid var(--line);
        }
        /* Bold lead-ins ("Local", "Global") brighten so the eye lands on them. */
        .tooltip.explain strong { color: var(--text); }
        .tooltip.explain .tip-body { color: var(--tip-body); }
        /* The docs link gets extra separation from the body prose. */
        .tooltip.explain .tip-link { margin-top: 10px; font-size: 11px; }
        /* Link inside the explanation (gold accent; the tooltip becomes
           interactive so it can be clicked; see showTooltip). */
        .tooltip a { color: var(--accent); text-decoration: underline; }
        .tooltip a:hover { color: var(--text); }

        /* Block hover tooltip: header, three view-ordered main lines (temp,
           rain, wind; always present, only the active view's line gets the
           big/bright treatment), a divider, one muted detail line, and hazard
           chips. Capped width so the detail line wraps instead of stretching
           the tooltip; the header and main lines keep the default nowrap and
           stay single-line. */
        .tooltip.block { width: max-content; max-width: min(240px, calc(100vw - 16px)); }
        .tooltip .tip-when {
            display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
            padding-bottom: 4px; margin-bottom: 5px; border-bottom: 1px solid var(--divider);
        }
        .tooltip .tip-when .d { color: var(--text-muted); font-weight: 600; }
        .tooltip .tip-when .t { color: var(--text-faint); }
        /* Active-view main line: big and bright. Inactive views share one
           quieter size/weight/color so nothing drops out, it just recedes. */
        .tooltip .tip-hero { font-size: 21px; font-weight: 600; line-height: 1.15; color: var(--text); }
        .tooltip .tip-hero.dim { font-size: 15px; font-weight: 500; color: #eee; }
        .tooltip .tip-temp { margin-top: 2px; }
        .tooltip .tip-rain { margin: 1px 0 5px; }
        .tooltip .tip-wind { margin: 1px 0 5px; }
        /* Accent tint applies only when that view's line is the active one. */
        .tooltip .tip-temp .tip-hero:not(.dim) { color: var(--tip-temp); }
        .tooltip .tip-rain .tip-hero:not(.dim) { color: var(--tip-rain); }
        .tooltip .tip-wind .tip-hero:not(.dim) { color: var(--tip-wind); }
        /* Snow (sleet) drops to its own line under the rain amount, inheriting
           whatever weight/size the rain line has for the active view. */
        .tooltip .tip-snow { display: block; }
        .tooltip .tip-divider { border-top: 1px solid var(--divider); margin: 6px 0 5px; }
        .tooltip .tip-ctx { white-space: normal; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
        /* Detail line: active-view fact leads, shared facts trail on the same
           line, wrapping to a second line only when it doesn't fit. */
        .tooltip .tip-detail { color: var(--text-muted); }
        .tooltip .tip-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        /* Reuse the amber status button (see .status.outdated) for the chips. */
        .tooltip .tip-chip {
            color: var(--warn);
            background: var(--warn-bg);
            border: 1px solid var(--warn);
            border-radius: var(--radius);
            padding: 3px 9px;
            font-size: 11px;
            line-height: 1.35;
        }

        /* Shared modal shell: a panel over a scrim, opened only from the
           settings menu so nothing steals attention on its own. Both the
           changelog ("What's new") and the hourly-data explainer use this
           same scrim/panel/head/close family; only their body content (and,
           for the wider explainer, the panel's size) differs, so those stay
           in modal-specific rules below instead of duplicating the shell. */
        .modal-scrim {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--scrim);
            padding: max(20px, env(safe-area-inset-top))
                     max(20px, env(safe-area-inset-right))
                     max(20px, env(safe-area-inset-bottom))
                     max(20px, env(safe-area-inset-left));
        }
        .modal-scrim.hidden { display: none; }
        .modal-panel {
            display: flex;
            flex-direction: column;
            width: min(460px, 100%);
            max-height: min(80vh, 720px);
            /* Flush black like the settings menu, not a raised box. The 1px
               frame stays because this modal floats on its own dark scrim,
               where a borderless panel would lose its edge. */
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            font-size: 12px;
        }
        /* Wider/taller variant for the hourly-data explainer, which embeds a
           full illustrated page rather than a short <pre> of changelog text. */
        .modal-panel.wide {
            width: min(720px, 100%);
            height: min(85vh, 900px);
            max-height: none;
        }
        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: none;
            padding: 12px 14px;
            border-bottom: 1px solid var(--divider);
        }
        .modal-head strong { font-size: 13px; color: var(--text); }
        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 15px;
            line-height: 1;
            padding: 4px 6px;
            cursor: pointer;
        }
        .modal-close:hover, .modal-close:focus-visible { color: var(--accent); }

        /* Changelog body: CHANGELOG.md turned into real elements (headings,
           lists, inline code) by the small line-based parser in
           renderChangelog, rather than a single <pre> dump. Still no
           markdown library and no extra network request: same file, a
           little more parsing logic, styled with the tokens already in this
           stylesheet. */
        .changelog-body {
            overflow-y: auto;
            margin: 0;
            padding: 8px 14px 16px;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 12px;
            line-height: 1.5;
            overflow-wrap: break-word;
        }
        /* "v43" leads each release, gold and a step larger; the date trails
           in a muted, smaller weight so the version number stays the eye's
           anchor when scanning down the list. */
        .changelog-body h2 {
            margin: 18px 0 4px;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
        }
        .changelog-body h2:first-child { margin-top: 0; }
        .changelog-body h2 .cl-date {
            font-weight: 400;
            font-size: 11px;
            color: var(--text-dim);
            margin-left: 5px;
        }
        /* Section headers ("### swiping between views") stay in the body
           colour, one step down from the version, so the gold reads as
           "release", not "topic". */
        .changelog-body h3 {
            margin: 10px 0 4px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }
        .changelog-body ul {
            margin: 0 0 8px;
            padding-left: 16px;
        }
        .changelog-body li {
            margin: 3px 0;
        }
        .changelog-body li::marker { color: var(--accent); }
        /* The intro line ("what changed, newest first...") ahead of the
           first version heading. */
        .changelog-body p { margin: 0 0 12px; color: var(--text-dim); }
        .changelog-body code {
            font: inherit;
            background: rgba(255,255,255,0.08);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* Hourly-data explainer body: how-hourly-data-is-made.html in an
           iframe. The iframe's src is set only on open and cleared on close
           (see openHourly/closeHourly) so the page's ~70KB and its own
           script never load until the user actually asks to see it, and
           don't linger in memory once dismissed. */
        .hourly-body {
            flex: 1;
            min-height: 0;
        }
        .hourly-body iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg);
            display: block;
        }

        /* Status and animations. Centered on the column field like the
           legend. No hue of its own: gold is reserved for now/today/sun and
           the palette for conditions, so the status text carries the state
           in words. */
        /* Data-freshness line: shares the view-toggle row, sits to the left
           of the rain/temp/wind buttons. Ellipsizes so long states never
           push the buttons out of alignment. */
        /* The freshness line is also the refresh button: click/tap refetches,
           hover/focus explains. */
        /* Wrap holds the freshness label (refresh button) plus the ⓘ that
           owns the explanation, so hovering/tapping the label just refreshes
           and the info is a separate, non-intrusive target. */
        .status-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            max-width: 100%;
            min-width: 0;
        }
        .status {
            font-size: 11px;
            color: var(--text-dim);
            text-align: left;
            flex: 0 1 auto;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
        }
        .status:hover { color: var(--status-hover); }
        .status:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
        /* Info affordance for the freshness explanation. A small down chevron
           (inline SVG, hairline) reads as "reveal details" and stays muted so
           it doesn't compete with the state text. The SVG inherits colour via
           currentColor, so hover just brightens it. */
        .status-info {
            flex: none;
            padding: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            color: var(--status-info);
            background: none;
            border: none;
            cursor: help;
        }
        .status-info svg { display: block; width: 12px; height: 12px; }
        .status-info:hover { color: var(--text); }
        .status-info:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
        .status.stale {
            color: var(--status-stale);
        }
        /* Out of date / update CTAs: "↻ Update forecast", "↻ Update app", and
           the "New version · see ⚙" note all share this one button. Same shape
           and behaviour as the settings-panel .btn (1px border, --radius, smooth
           transition, border brightens on hover) so every button in the app
           reads as one family; recoloured amber with a soft --warn-bg fill so it
           carries more colour and pulls the eye as an attention CTA. The ↻ glyph
           doubles the "refresh" signal for colour-blind users. Kept at the row's
           11px scale (not the settings 12px) so it lines up with the
           rain/temp/wind toggles beside it instead of towering over them. Like
           the resting line it may shrink and ellipsize (flex 0 1 auto, min-width
           0) so a long state never pushes the toggles out of the row on a narrow
           phone. */
        .status.outdated {
            color: var(--warn);
            flex: 0 1 auto;
            min-width: 0;
            background: var(--warn-bg);
            border: 1px solid var(--warn);
            border-radius: var(--radius);
            padding: 3px 9px;
            transition: all 0.2s ease;
        }
        .status.outdated:hover { color: var(--warn-strong); border-color: var(--warn-strong); }
        .hidden {
            display: none;
        }
        /* Present to a screen reader, absent to everything else. Not
           `display:none`, which would take it out of the accessibility tree
           along with everything else. */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        /* Install banner: bottom-center pill, dismissible, remembered.
           Hidden by default in CSS, since it must never pre-empt the forecast.
           JS adds .revealed only after the grid has painted real data once
           and a short read delay has elapsed (see maybeScheduleInstallBanner).
           Shown once per device until installed or dismissed. */
        .install-banner {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            /* Flush black with a hairline frame, like the changelog panel.
               The frame stays because the pill floats over the grid with no
               dim behind it, so a borderless panel would lose its edge. */
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px 12px;
            display: none;              /* revealed only via .revealed */
            align-items: center;
            gap: 12px;
            font-size: 12px;
            z-index: 50;
            max-width: calc(100vw - 32px);
        }
        .install-banner.revealed { display: flex; animation: installIn .25s ease-out; }
        /* Opacity-only fade: animating transform would fight translateX(-50%). */
        @keyframes installIn { from { opacity: 0; } to { opacity: 1; } }
        /* Gold-fill Install button, the same accent-filled treatment as the
           geo button, so the one action the banner wants reads as tappable. */
        .install-banner .btn {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--on-accent);
            font-weight: 600;
            padding: 5px 12px;
            font-size: 12px;
            white-space: nowrap;
        }
        .install-banner .btn:hover, .install-banner .btn:focus { background: var(--accent-hi); border-color: var(--accent-hi); }
        .install-banner .btn:active { background: var(--accent-lo); border-color: var(--accent-lo); }
        /* iOS has no button: the share-sheet hint carries the gold instead. */
        .install-banner .hint { color: var(--accent); font-weight: 600; }
        .install-banner .dismiss {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
