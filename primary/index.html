            font-family: inherit;
            font-size: 14px;
            line-height: 1;
            padding: 4px;
        }
        .install-banner .dismiss:hover { color: var(--text); }

        /* Search. The field is the wide slot of the sheet's action row: tap
           the placeholder and it becomes a live input in the same place, at
           the bottom of the screen, with its results filling the sheet above
           it. Nothing about search happens at the top of the screen any more.
           Flush with the app, no box and no underline: the only gold line in
           the search UI is the selection under the active result. */
        .search-container {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
            padding: 0 0 0 var(--gutter);
        }
        .search-container[hidden] { display: none; }
        .search-input {
            flex: 1;
            min-width: 0;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--text);
            font-family: inherit;
            /* One unified search size on every device, matched to the row it
               replaces so the placeholder and the live field are the same
               size in the same place. */
            font-size: 17px;
            font-weight: 600;
            /* type="search" adds native chrome (clear button, inner spin);
               strip it so the field renders like a plain text input. */
            -webkit-appearance: none;
            appearance: none;
        }
        .search-input::-webkit-search-cancel-button,
        .search-input::-webkit-search-decoration { -webkit-appearance: none; }
        .search-input:focus { outline: none; }
        /* Compact "use my location" control, inline at the right edge of the
           field: a solid gold square with a dark GPS crosshair, no label. */
        .geo-btn {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            margin-left: 12px;
            background: var(--accent);
            border: none;
            border-radius: var(--radius);
            color: var(--on-accent);
            font-family: inherit;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .geo-btn svg { width: 1em; height: 1em; display: block; }
        .geo-btn:hover { background: var(--accent-hi); }
        .geo-btn:active { background: var(--accent-lo); }
        .geo-btn:focus-visible { outline: none; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.55); }
        /* The results are a sheet body, in flow, sharing the sheet's own
           scroll behaviour with the places list and the menu. */
        .search-results { background: var(--bg); }
        .search-results[hidden] { display: none; }
        .search-results,
        .changelog-body {
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
        .search-results::-webkit-scrollbar,
        .changelog-body::-webkit-scrollbar { width: 6px; }
        .search-results::-webkit-scrollbar-track,
        .changelog-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .search-results::-webkit-scrollbar-thumb,
        .changelog-body::-webkit-scrollbar-thumb {
            /* 2px bg border + padding-box clip leaves a ~2px gold hairline,
               floating clear of the panel edges */
            background: var(--accent);
            border: 2px solid var(--bg);
            background-clip: padding-box;
            border-radius: var(--radius);
        }
        /* A result row and a switch row are the same row: the switch list and
           the search list are one list shown in two modes of one sheet, so
           they share height, gutter, type size and the hairline whose colour
           travels with the selection. Only the actions on the right and the
           region text differ, because only those are actually different. */
        .search-result {
            border-bottom: 1px solid transparent;
            min-height: 44px;
            padding: 0 var(--sp-1) 0 var(--gutter);
            font-size: 15px;
            cursor: pointer;
            transition: color 0.2s ease, border-color 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: var(--sp-1);
        }
        /* City name leads (bold); the region recedes via opacity, so it dims
           in white and follows the gold on the selected row (A3). */
        .result-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .rl-city { font-weight: 600; }
        .rl-region { opacity: 0.55; }
        /* Favorites-cap advisory: amber, matching the app's "attention" accent,
           softer than an error. Sits above the results until it self-clears. */
        .fav-hint {
            padding: 8px 12px;
            font-size: 11px;
            line-height: 1.3;
            color: var(--warn);
            background: var(--warn-bg-soft);
            border-bottom: 1px solid var(--line);
        }
        /* One action per row now — ★ pins, ✕ unpins, and a row only ever
           carries the one that applies to it — so the two reserved columns
           and the empty spacer that kept them aligned are gone with the
           toggle that needed them. What is left is a single 44px target
           flush to the right edge: the minimum, which the old 30px and 34px
           columns were both under. */
        .result-actions { display: flex; align-items: center; flex-shrink: 0; }
        .search-result .pin,
        .search-result .unpin {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 13px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        /* The star is an offer, so it sits at the quietest grey the app has
           until it is reached for. The ✕ is only ever on a row you already
           committed to, so it is one step brighter: it is not advertising
           itself, it is findable. */
        .search-result .pin { color: var(--text-dimmer); }
        .search-result .pin:hover { color: var(--accent); }
        .search-result .unpin { color: var(--text-dim); }
        .search-result .unpin:hover { color: var(--text); }
        /* Tier name, on the first row of its block beside the seam, in the
           same treatment as the switcher's. Live geocoding hits get none:
           they are what the list is for, and the two saved tiers are named
           by contrast with them. */
        .rl-tier { flex-shrink: 0; font-size: 11px; color: var(--text-dim); padding-left: var(--sp-1); }
        /* Same doubled hairline the sheet uses, and for the same reason: the
           three groups have three different lifetimes and the list used to
           say nothing about that. */
        .search-result.seam { box-shadow: inset 0 1px 0 var(--line-strong); }
        /* The two-city comparison, drawn only while a switcher preview is
           aimed. One line, both readings, the destination in the accent so
           the pair reads as from → to rather than as two unrelated facts.
           It wraps rather than ellipsizing: half a comparison is worse than
           a taller box. */
        .tip-compare {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0 6px;
            font-variant-numeric: tabular-nums;
        }
        .tip-compare .tc-vs { color: var(--text-dimmer); }
        .tip-compare .tc-there { color: var(--accent); }
        /* Soft hairline between rows: every row but the last underlines itself,
           so there's no line at the very bottom of the list (or under the
           search bar at the top). */
        .search-result:not(:last-child) {
            border-bottom-color: var(--divider);
        }
        /* One active row at a time (hover and the keyboard drive the same
           .highlighted class; see the mouseover sync in JS). The selected row
           tints gold and underlines itself with the single gold line. This
           works for the last row too (its own bottom border). Placed after the
           divider rule so it wins at equal specificity. */
        .search-result.highlighted {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }
        /* The grid used to be dimmed while searching. The sheet's own scrim
           does that now, in every mode, so there is one rule instead of two. */

        /* Mobile styles */
        @media (max-width: 480px) {
            :root {
                --gutter: 36px;
                --gap: 4px;
                --block-gap: 4px;
                --overhang: 10px;
            }
            body {
                /* The extra bottom padding is not decoration: Android's
                   gesture navigation owns a strip along the bottom edge, and
                   a swipe up that starts inside it goes to the system rather
                   than to the page. The control row has to sit above it. */
                padding: 10px 10px calc(10px + env(safe-area-inset-bottom, 12px));
                min-height: 100vh;
                min-height: -webkit-fill-available;
                min-height: 100dvh;
            }
            .container {
                max-width: 100%;
                height: 100vh;
                height: -webkit-fill-available;
                height: 100dvh;
                display: flex;
                flex-direction: column;
            }
            /* Let the grid absorb whatever height the screen has:
               tall phones get a taller grid, everything stays one screen. */
            #content {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            .chart {
                flex: 1;
                height: auto;
                min-height: 280px;
                margin-top: var(--sp-1);
            }
            .control-row .location {
                font-size: 19px;
            }
            .control-row .seg { gap: 8px; }
            /* One step down on phone widths, on the two spans rather than the
               button: the button's own font-size no longer draws anything. The
               active value stays clearly the largest thing in the row. */
            .control-row .seg .seg-val { font-size: 12px; }
            .control-row .seg button.active .seg-val { font-size: 16px; }
            .control-row .location-caret svg {
                width: 10px;
                height: 10px;
            }
            .time-label {
                font-size: 10px;
            }
            .day-label {
                font-size: 11px;
            }
            .legend {
                margin-top: var(--sp-2);
                padding-top: var(--sp-2);
            }
            .legend-step {
                font-size: 9px;
            }
            /* Narrow columns: trim the corner icons a touch so a rare three-way
               hazard stack (storm + heat + UV) still fits without overrunning
               the block or the opposite corner's sky mark. */
            .block-mark {
                font-size: 11px;
            }
            html {
                height: -webkit-fill-available;
            }
        }

        /* Installed PWA on a phone: the app fills the screen. Lock the
           viewport (no scroll, no rubber-banding) and pad into the safe
           areas (viewport-fit=cover plus a translucent status bar mean
           content otherwise runs under the notch/home bar). The .standalone
           class is set from JS (display-mode media query + iOS legacy). */
        @media (max-width: 480px) {
            html.standalone, html.standalone body {
                overflow: hidden;
                overscroll-behavior: none;
                height: 100dvh;
            }
            html.standalone body {
                position: fixed;
                inset: 0;
                padding: calc(10px + env(safe-area-inset-top, 0px))
                         calc(10px + env(safe-area-inset-right, 0px))
                         calc(10px + env(safe-area-inset-bottom, 0px))
                         calc(10px + env(safe-area-inset-left, 0px));
            }
            html.standalone .container { height: 100%; }
            html.standalone .chart { min-height: 0; }
        }

        /* ------------------------------------------------------------------
           Tablet / iPad. The phone rule (≤480px) fills the screen edge to
           edge; the default rule centers a narrow ≤540px column. Between them
           an iPad got that narrow column floating in a sea of black. These
           two rules close the gap. Portrait is the intended orientation for a
           vertical agenda grid, so it does the real work: the column widens
           and the grid stretches to the bottom of the screen. Landscape (short
           and wide) just stays tidy and centered. The landscape rule is gated
           on pointer:coarse + a tall min-height so desktop/laptop browsers in
           the same width range are never caught. */

        /* Portrait tablet: fill the viewport height like the phone, but keep a
           centered column with a larger cap and roomier margins. */
        @media (min-width: 481px) and (orientation: portrait) {
            /* A *definite* container height (not flex-grow inside a min-height
               body) is required so the grid's percentage cell heights (--band)
               resolve, the same approach the phone rule uses. Growing the
               container with flex:1 fills the screen but collapses every cell
               to ~0 height (an empty grid). calc(100dvh - 56px) accounts for
               the 28px body padding top+bottom, so it fills without overflow. */
            body { padding: 28px; }
            .container {
                max-width: min(820px, 90vw);
                height: calc(100vh - 56px);
                height: calc(100dvh - 56px);
                margin: 0 auto;
                display: flex;
                flex-direction: column;
            }
            #content {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            /* the grid absorbs the extra height so it reaches the bottom */
            .chart {
                flex: 1;
                height: auto;
                min-height: 360px;
                margin-top: var(--sp-2);
            }
            /* larger lead type for the bigger canvas (grid cells scale with
               the chart height on their own; these are the text elements) */
            .time-label { font-size: 12px; }
            .day-label { font-size: 13px; }
            .day-date { font-size: 15px; }
        }

        /* Landscape tablet (touch, tall viewport): short and wide. Don't fill
           height; center the portrait grid and cap it so it never overflows.
           min-height rules out phones in landscape; pointer:coarse rules out
           desktops. */
        @media (orientation: landscape) and (min-height: 600px) and (pointer: coarse) {
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: -webkit-fill-available;
                min-height: 100dvh;
                padding: 24px;
            }
            .container { max-width: clamp(420px, 64vh, 600px); width: 100%; }
            .chart { height: clamp(280px, 58vh, 620px); }
        }

        /* Desktop (fine pointer, wide landscape window). The default rule
           leaves a ~540px column top-aligned with the top of the viewport, so
           on a large screen it floats in the upper-centre with half the height
           empty below. Centre it on both axes, lift the height-driven caps a
           little so the canvas grows with the screen (still portrait, so the
           day columns keep their proportions), and open the header→grid and
           grid→legend gaps to match the bigger canvas. Gated on pointer:fine
           so touch tablets (their own rules above) are untouched, and on a
           min-width so a narrowed desktop window falls back to the plain
           centred column. Placed before the window-controls-overlay block so
           an installed desktop PWA's titlebar padding still wins. */
        @media (min-width: 900px) and (pointer: fine) and (orientation: landscape) {
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                min-height: 100dvh;
                padding: 24px;
            }
            .container { max-width: clamp(440px, 60vh, 600px); width: 100%; }
            /* Let the grid use the tall desktop viewport: the width stays
               capped (portrait day columns), but the height reaches most of
               the screen so the blocks grow vertically instead of leaving the
               lower half empty. */
            .chart { height: clamp(300px, 74vh, 900px); }
            /* section gaps scaled up for the larger canvas (the base 8px scale
               stays elsewhere; only these two grouping gaps grow) */
            .botcap { height: 28px; }
        }

        /* desktop keyboard-shortcut reference in the settings pane */
        .shortcuts-hint {
            display: flex;
            flex-direction: column;
            gap: 5px;
            color: var(--text-dim);
            font-size: 11px;
            border-top: 1px solid var(--line);
            padding: 10px 12px 12px;
            margin-top: 2px;
        }
        .shortcuts-hint .sc { display: flex; justify-content: space-between; gap: 12px; }
        .shortcuts-hint .sc span:last-child { color: var(--text-faint); letter-spacing: 0.04em; }

        /* Window Controls Overlay: on Chromium desktop the black background
           extends into the OS title bar. The drag strip keeps the window
           movable; content is padded below it. display:none outside this
           display mode, so mobile, standalone, and browser are unaffected. */
        .titlebar-drag { display: none; }
        @media (display-mode: window-controls-overlay) {
            .titlebar-drag {
                display: block;
                position: fixed;
                top: 0;
                left: env(titlebar-area-x, 0);
                width: env(titlebar-area-width, 100%);
                height: env(titlebar-area-height, 33px);
                -webkit-app-region: drag;
                app-region: drag;
                z-index: 40;
            }
            body { padding-top: calc(env(titlebar-area-height, 33px) + 8px); }
            /* keep controls clickable if any reaches the bar */
            .location, .btn, .search-container {
                -webkit-app-region: no-drag;
                app-region: no-drag;
            }
        }
    </style>
</head>
<body>
    <div class="titlebar-drag" aria-hidden="true"></div>
    <!-- The spoken half of the status channel. Off-screen, never drawn, and
         written to only for states worth interrupting for: loading, offline,
         stale data, a waiting update, and the transient replies. The resting
         freshness line is not announced, because its countdown reticks every
         minute and a live region reading that out is noise. -->
    <p id="statusLive" class="sr-only" role="status" aria-live="polite"></p>
    <div class="container">
        <div id="content">
            <!-- hourRail (below) is the hour peek's touch target (DR-29). It is
                 transparent, created once here, and never rebuilt: touch
                 dispatches every touchmove/touchend to whatever element was
                 under the finger at touchstart, so a listener living on markup
                 that a mid-drag re-render replaces (the time labels) would be
                 detached after one frame and the gesture would die. Mouse is
                 immune, so that bug looks fine on desktop and is total on a
                 phone.
                 The day rail is gone: date paging now lives on the grid field
                 itself, so there is no second origin to separate it from. -->
            <div class="day-row">
                <div class="day-labels" id="days"></div>
                <button class="home-chip" id="dayHome" type="button" hidden
                        aria-label="Back to today"></button>
            </div>
            <div class="chart">
                <div id="sunLines"></div>
                <div class="time-labels" id="times"></div>
                <div class="chart-grid" id="grid"></div>
                <div class="rail" id="hourRail" aria-hidden="true"></div>
                <!-- The reach carets. Nothing at rest; drawn only while a
                     hand is on the grid, and only on the sides the hour
                     window can still travel to. They sit in the hour
                     gutter, which is the rail the hour pull is armed
                     from. The day axis had a pair of arrows here; the
                     elastic shows its own extent in the widths, so they
                     went with the paging. -->
                <span class="reach reach-v" id="reachUp" aria-hidden="true" hidden>&#9650;</span>
                <span class="reach reach-v" id="reachDown" aria-hidden="true" hidden>&#9660;</span>
                <!-- The lock mark, beside the grid rather than on it. -->
                <span class="lock-mark" id="lockMark" aria-hidden="true"></span>
            </div>
            <!-- The control row. One row, in thumb reach: the city name (which
                 IS the city switcher, tap or swipe up) and the three view
                 buttons. The status line keeps the line above it, so DR-7's
                 single state channel costs no new layout. -->
            <div class="view-toggle" id="viewToggle">
                <div class="control-row" id="controlRow">
                    <div class="location" id="location" role="button" tabindex="0" aria-haspopup="listbox" aria-expanded="false" aria-controls="sheetList" aria-label="Change city"><span class="location-name" id="locationName"></span><span class="city-count" id="cityCount" aria-hidden="true"></span><span class="location-caret" id="locationCaret" aria-hidden="true"></span></div>
                    <!-- Each button carries its own current-hour reading above
                         its name (chance, temperature, wind speed). The value
                         spans start empty: renderViewValues fills them, and
                         nothing is ever shown before the data is in hand. -->
                    <div class="seg" id="viewSeg">
                        <button data-view="rain"><span class="seg-val"></span><span class="seg-lb">rain</span></button>
                        <button data-view="temp"><span class="seg-val"></span><span class="seg-lb">temp</span></button>
                        <button data-view="wind"><span class="seg-val"></span><span class="seg-lb">wind</span></button>
                        <!-- DR-30: the active underline as a movable element, so
                             it can slide toward the view a transition is heading
                             for. At rest it is measured onto the active button
                             and is the same 1px gold line the words carried. -->
                        <i class="segbar" id="viewBar" aria-hidden="true" hidden></i>
                    </div>
                </div>
                <!-- One line, three occupants that never coexist: the status
                     line at rest, the key while the grid is being touched, and
                     the swipe hint on a first run. They never needed three
                     homes, and the slot is a fixed height so the swap between
                     them moves nothing above it.

                     It sits under the control row: the row is what the hand
                     reaches for, so it takes the position nearest the thumb,
                     and the line that only ever has to be READ sits below it.
                     The key is the one occupant with a reason to be near the
                     grid, and a hand on the grid is a hand above this line
                     either way. -->
                <div class="botcap" id="botcap">
                    <div class="status-wrap" id="captionText">
                        <div id="status" class="status" tabindex="0" role="button"></div>
                        <button class="status-info" id="statusInfo" aria-label="About forecast freshness"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                    </div>
                    <div class="legend" id="legend" hidden></div>
                    <div class="swipe-hint" id="swipeHint" hidden></div>
                </div>
            </div>
        </div>
    </div>

    <div class="install-banner" id="installBanner">
        <span id="installText"></span>
        <button class="btn" id="installGo">Install</button>
        <button class="dismiss" id="installDismiss" aria-label="Dismiss"></button>
    </div>

    <!-- The city sheet. Absent from the DOM's flow at rest (hidden), drawn
         only while a swipe up from the control row is live or a tap has
         opened it. Flush black, hairline rows: the same treatment the
         settings menu and the search results already use. -->
    <div class="sheet-scrim" id="sheetScrim" hidden></div>
    <!-- The sheet is everything that is not the grid: the saved places, the
         search, and the menu. Three bodies, one at a time, and one action row
         pinned to the bottom of all three. Nothing about it appears anywhere
         near the top of the screen. -->
    <div class="city-sheet" id="citySheet" hidden>
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-list" id="sheetList" role="listbox" tabindex="-1"
             aria-label="Saved cities" aria-activedescendant=""></div>
        <div class="search-results" id="searchResults" hidden></div>
        <div class="settings hidden" id="settings"></div>
        <!-- The destination readout, drawn only while the switch is held. It
             occupies the slot the action row occupies and sits at the control
             row's own size and position, so the name you release on does not
             move when the sheet goes and the control row comes back. -->
        <div class="sheet-aim" id="sheetAim" aria-hidden="true"></div>
        <!-- The action row. The wide slot on the left is the mode you are in:
             the search placeholder in the places list, the live field once
             you tap it, the menu's own title in the menu. The button on the
             right is the mode you are not. It sits outside every body so it
             survives the swap between them, and it is pinned so a long menu
             cannot scroll the way out of reach. -->
        <div class="sheet-actions" id="sheetActions">
            <div class="search-container" id="searchContainer" hidden>
                <input type="search"
                       class="search-input"
                       id="searchInput"
                       name="q"
                       placeholder="Search city..."
                       inputmode="search"
                       enterkeyhint="search"
                       autocomplete="off"
                       autocorrect="off"
                       autocapitalize="off"
                       spellcheck="false"
                       data-lpignore="true"
                       data-1p-ignore
                       data-form-type="other">
                <button type="button" class="geo-btn" id="geoBtn"
                        aria-label="Use my location" title="Use my location"></button>
            </div>
            <div class="sheet-row sheet-action" id="sheetWide" role="button" tabindex="-1"></div>
            <div class="sheet-row sheet-action sheet-mode" id="sheetMode" role="button" tabindex="-1"></div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <div class="modal-scrim hidden" id="changelog" role="dialog" aria-modal="true" aria-label="What's new">
        <div class="modal-panel">
            <div class="modal-head">
                <strong>What's new</strong>
                <button class="modal-close" id="changelogClose" aria-label="Close"></button>
            </div>
            <div class="changelog-body" id="changelogBody"></div>
        </div>
    </div>

    <div class="modal-scrim hidden" id="hourly" role="dialog" aria-modal="true" aria-label="How hourly data is made">
        <div class="modal-panel wide">
            <div class="modal-head">
                <strong>How hourly data is made</strong>
                <button class="modal-close" id="hourlyClose" aria-label="Close"></button>
            </div>
            <div class="hourly-body" id="hourlyBody"></div>
        </div>
    </div>

    <!-- Dev-time module split. build.mjs inlines every one of these
         into a single <script> before minifying, so the published
         page is one self-contained file with no extra requests.
         Order matters: config declares the horizon the shared core
         reads, and shared/ must be evaluated before app.js. -->
    <script src="config.js"></script>
    <script src="../shared/constants.js"></script>
    <script src="../shared/dom.js"></script>
    <script src="../shared/state.js"></script>
    <script src="../shared/cache.js"></script>
    <script src="../shared/settings.js"></script>
    <script src="../shared/format.js"></script>
    <script src="../shared/colors.js"></script>
    <script src="../shared/icons.js"></script>
    <script src="../shared/astro.js"></script>
    <script src="../shared/wmo.js"></script>
    <script src="../shared/forecast.js"></script>
    <script src="../shared/api.js"></script>
    <script src="../shared/places.js"></script>
    <script src="../shared/install.js"></script>
    <script src="../shared/sw-update.js"></script>
    <script src="app.js"></script>
</body>
</html>
