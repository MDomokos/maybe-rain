name: deploy

# On every push to main: minify the site into dist/ and publish it to the
# gh-pages branch, which GitHub Pages serves. Source on main stays readable;
# only the minified output goes live.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install build tools
        run: npm ci

      - name: Minify into dist/
        run: npm run build

      # The build writes what the app costs into the <!-- sizes --> block in
      # README.md, so the figures come from the release they describe rather
      # than from whenever someone last edited them by hand. Committed here
      # because the runner's copy is otherwise thrown away with it.
      #
      # [skip ci] keeps this commit from starting the workflow again. A push
      # that lands behind a newer main is reported and swallowed rather than
      # rebased: the checkout is shallow, and a README line is not worth
      # failing a deploy that already produced the site. The next run to move
      # the numbers carries them.
      - name: Commit README sizes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md; then
            echo "README sizes unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -qm "sizes: update README for ${GITHUB_SHA::7} [skip ci]"
          git push -q origin HEAD:main \
            || echo "push rejected (main moved); the next run picks the sizes up"

      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
