name: release

# Push a version tag (v17, v18, ...) and this turns it into a GitHub Release,
# using that version's section of CHANGELOG.md as the notes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull this version's notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v t="$tag" '
            $0 ~ "^## " t " " { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See CHANGELOG.md." > notes.md
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file notes.md
